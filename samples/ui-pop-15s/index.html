<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>UI Pop 15s</title>
<style>
  html, body { margin: 0; height: 100%; background: #EFE7D6; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
/*
 * 15 秒样片：纸剪出来的交互 UI 被"操作"起来，节奏越来越快。
 *
 *   - 全部 Canvas 2D，画面是 t 的纯函数：纸纹、纤维、折痕在启动时用种子 PRNG 生成一次；
 *     每个纸片的剪刀毛边来自无状态哈希，逐帧稳定。
 *   - 纸片 = 投影 + 底色 + 纸纹（multiply）+ 错位 1–2px 的油墨描边（套印不准的印刷感）。
 *   - 时间轴、交互事件、音效都来自 timeline.js 的同一张拍号表；配乐见 music.js。
 */
import { B, SHOTS, EV, DURATION, FPS, hash, typeBeats } from './timeline.js';
import * as M from './music.js';

const W = 1920, H = 1080, RAD = Math.PI / 180;
const RENDER = new URLSearchParams(location.search).has('render');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg: '#EFE7D6', card: '#FFFCF5', ink: '#1E1B18', mute: '#8C8375', faint: '#D9D0BF',
  red: '#E0533A', mustard: '#F0B43C', blue: '#3E6FB0', sky: '#C4DAEA', green: '#4E9A6A',
  mint: '#CFE5D2', pink: '#F2C1B4', sand: '#EDE4D2',
};
const F = {
  big: '"Avenir Next Condensed", "Futura", "Helvetica Neue", sans-serif',
  ui: '"Avenir Next", "Helvetica Neue", "PingFang SC", sans-serif',
  code: 'Menlo, "SF Mono", monospace',
  zh: '"PingFang SC", "Hiragino Sans GB", sans-serif',
};

/* ---------- 小工具 ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eo3 = p => 1 - (1 - p) ** 3;
const eio = p => (p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2);
const eBack = p => { const c = 1.9, c3 = c + 1; return 1 + c3 * (p - 1) ** 3 + c * (p - 1) ** 2; };
let t = 0;                                         // 当前秒
const prog = (t0, dur) => clamp((t - t0) / dur);
const after = b => t >= B(b);
/** 点击按压量：按下 50ms，松开 120ms */
function press(times) {
  let v = 0;
  for (const tc of times) {
    if (t >= tc - 0.05 && t < tc) v = Math.max(v, (t - tc + 0.05) / 0.05);
    else if (t >= tc && t < tc + 0.12) v = Math.max(v, 1 - (t - tc) / 0.12);
  }
  return v;
}
function mix(a, b, p) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => [(s >> 16) & 255, (s >> 8) & 255, s & 255];
  const [x, y] = [ch(pa), ch(pb)];
  return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], p))).join(',')})`;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let q = a;
    q = Math.imul(q ^ (q >>> 15), q | 1);
    q ^= q + Math.imul(q ^ (q >>> 7), q | 61);
    return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
  };
}
const fmt = n => n < 1000 ? String(Math.round(n)) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'K' : (n / 1e6).toFixed(1) + 'M';

/* ---------- 纸：底纸和纸片纹理（启动时生成一次） ---------- */
function makeTex(w, h, seed, { base, mott, grain, speck, fibers, fiberCol, creases }) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const rnd = mulberry32(seed);
  const lattice = cell => {
    const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2;
    const a = new Float32Array(gw * gh).map(() => rnd() * 2 - 1);
    return (x, y) => {
      const fx = x / cell, fy = y / cell, ix = fx | 0, iy = fy | 0;
      let u = fx - ix, v = fy - iy; u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v);
      const i = iy * gw + ix;
      return lerp(lerp(a[i], a[i + 1], u), lerp(a[i + gw], a[i + gw + 1], u), v);
    };
  };
  const n1 = lattice(210), n2 = lattice(55), n3 = lattice(9);
  const img = g.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = mott[0] * n1(x, y) + mott[1] * n2(x, y) + mott[2] * n3(x, y) + grain * (rnd() - 0.5)
      + (rnd() < speck ? -30 - 30 * rnd() : 0);
    const i = (y * w + x) * 4;
    d[i] = base[0] + v; d[i + 1] = base[1] + v * 0.97; d[i + 2] = base[2] + v * 0.9; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // 纤维：短弧线，深浅两种
  g.lineCap = 'round';
  for (let i = 0; i < fibers; i++) {
    const x = rnd() * w, y = rnd() * h, len = 8 + rnd() * 34, a = rnd() * Math.PI * 2, bend = (rnd() - 0.5) * 18;
    const light = rnd() < 0.4;
    g.strokeStyle = light ? `rgba(255,255,255,${0.1 + rnd() * 0.25})` : `rgba(${fiberCol},${0.05 + rnd() * 0.11})`;
    g.lineWidth = 0.5 + rnd() * 0.9;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a) * len / 2 - Math.sin(a) * bend, y + Math.sin(a) * len / 2 + Math.cos(a) * bend,
      x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.stroke();
  }
  // 折痕：一条暗线 + 一条亮线 + 一侧很淡的阴影带
  for (const [x0, y0, x1, y1] of creases) {
    const nx = -(y1 - y0), ny = x1 - x0, L = Math.hypot(nx, ny), ux = nx / L, uy = ny / L;
    const gr = g.createLinearGradient(x0, y0, x0 + ux * 90, y0 + uy * 90);
    gr.addColorStop(0, 'rgba(90,65,35,0.07)'); gr.addColorStop(1, 'rgba(90,65,35,0)');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.lineTo(x1 + ux * 90, y1 + uy * 90); g.lineTo(x0 + ux * 90, y0 + uy * 90); g.fill();
    g.lineWidth = 2; g.strokeStyle = 'rgba(90,65,35,0.14)';
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.5)';
    g.beginPath(); g.moveTo(x0 - ux * 2.5, y0 - uy * 2.5); g.lineTo(x1 - ux * 2.5, y1 - uy * 2.5); g.stroke();
  }
  return c;
}
const BG = makeTex(W, H, 7331, {
  base: [239, 232, 216], mott: [7, 4, 2], grain: 9, speck: 0.0006, fibers: 2200, fiberCol: '110,85,50',
  creases: [[1235, -10, 1190, 1090], [-10, 470, 1930, 515]],
});
const GRAIN = makeTex(2500, 1400, 9127, {
  base: [250, 248, 244], mott: [4, 3, 2], grain: 8, speck: 0.0012, fibers: 2600, fiberCol: '140,115,80', creases: [],
});

/* ---------- 纸片：剪刀毛边路径 + 投影 + 纹理 + 错位描边 ---------- */
const pathCache = new Map();
function rr(x, y, w, h, r, seed, amp = 1.1) {
  const key = `${x},${y},${w},${h},${r},${seed}`;
  let p = pathCache.get(key);
  if (p) return p;
  r = Math.min(r, w / 2, h / 2);
  const pts = [];
  const corner = (cx, cy, a0) => { for (let i = 0; i <= 4; i++) { const a = a0 + i / 4 * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  const side = (x0, y0, x1, y1) => { const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 22)); for (let i = 1; i < n; i++) pts.push([lerp(x0, x1, i / n), lerp(y0, y1, i / n)]); };
  corner(x + w - r, y + r, -Math.PI / 2); side(x + w, y + r, x + w, y + h - r);
  corner(x + w - r, y + h - r, 0); side(x + w - r, y + h, x + r, y + h);
  corner(x + r, y + h - r, Math.PI / 2); side(x, y + h - r, x, y + r);
  corner(x + r, y + r, Math.PI); side(x + r, y, x + w - r, y);
  p = new Path2D();
  pts.forEach(([px, py], i) => {
    const jx = px + amp * hash(i, seed * 2), jy = py + amp * hash(i, seed * 2 + 1);
    i ? p.lineTo(jx, jy) : p.moveTo(jx, jy);
  });
  p.closePath();
  pathCache.set(key, p);
  return p;
}
function circ(cx, cy, r, seed, amp = 0.9) {
  const key = `c${cx},${cy},${r},${seed}`;
  let p = pathCache.get(key);
  if (p) return p;
  p = new Path2D();
  const n = Math.max(10, Math.round(r * 2 * Math.PI / 12));
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, rr2 = r + amp * hash(i, seed);
    i ? p.lineTo(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2) : p.moveTo(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2);
  }
  p.closePath();
  pathCache.set(key, p);
  return p;
}
function paper(path, bb, o = {}) {
  const lift = o.lift ?? 1;
  ctx.save();
  if (lift > 0) {
    ctx.shadowColor = `rgba(70,48,25,${0.2 + 0.04 * lift})`;
    ctx.shadowBlur = 3 + 9 * lift; ctx.shadowOffsetX = 1 + 2.5 * lift; ctx.shadowOffsetY = 2 + 6 * lift;
  }
  ctx.fillStyle = o.fill ?? C.card;
  ctx.fill(path);
  ctx.restore();
  if (o.tex !== false) {
    ctx.save(); ctx.clip(path);
    ctx.globalCompositeOperation = 'multiply';
    const s = Math.abs(o.seed ?? 0);
    const [x, y, w, h] = bb;
    const sx = (s * 211) % 500, sy = (s * 97) % 200;
    const dw = Math.min(w + 4, 1990), dh = Math.min(h + 4, 1190);
    ctx.drawImage(GRAIN, sx, sy, dw, dh, x - 2, y - 2, dw, dh);
    if (o.crease) {
      const [a, b] = o.crease;
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(90,65,35,0.12)';
      ctx.beginPath(); ctx.moveTo(x + w * a, y); ctx.lineTo(x + w * b, y + h); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.moveTo(x + w * a - 2.5, y); ctx.lineTo(x + w * b - 2.5, y + h); ctx.stroke();
    }
    ctx.restore();
  }
  if (o.ink !== false) {
    ctx.save();
    ctx.translate(-1.6, -1.1);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = o.inkCol ?? C.ink; ctx.lineWidth = o.inkW ?? 3;
    ctx.stroke(path);
    ctx.restore();
  }
}
function text(s, x, y, size, o = {}) {
  ctx.font = `${o.weight ?? 600} ${size}px ${o.font ?? F.ui}`;
  ctx.textAlign = o.align ?? 'left';
  ctx.textBaseline = o.base ?? 'alphabetic';
  ctx.fillStyle = o.color ?? C.ink;
  ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}

/* ---------- 大字动态排版：逐字掉落，油墨 + 错位色版 ---------- */
function bigType(str, x, y, size, t0, o = {}) {
  const font = `${o.weight ?? 800} ${size}px ${o.font ?? F.big}`;
  ctx.font = font;
  const widths = Array.from(str, ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + (o.track ?? 0) * (str.length - 1);
  let cx = o.align === 'center' ? -total / 2 : o.align === 'right' ? -total : 0;
  const stagger = o.stagger ?? 0.035;
  ctx.save();
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot * RAD);
  Array.from(str).forEach((ch, i) => {
    const w = widths[i];
    const p = prog(t0 + i * stagger, 0.2);
    if (p > 0 && ch !== ' ') {
      const k = eBack(p);
      ctx.save();
      ctx.translate(cx + w / 2, -size * 0.35 - (1 - k) * size * 0.45);
      ctx.rotate((1 - k) * 12 * RAD * (i % 2 ? 1 : -1) + hash(i, str.length) * 1.5 * RAD);
      const sc = lerp(1.5, 1, eo3(p));
      ctx.scale(sc, sc);
      ctx.globalAlpha = clamp(p * 4) * (o.alpha ?? 1);
      ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const off = size * 0.035;
      ctx.fillStyle = o.shade ?? C.red;
      ctx.fillText(ch, off, off);
      ctx.fillStyle = o.color ?? C.ink;
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    }
    cx += w + (o.track ?? 0);
  });
  ctx.restore();
  return total;
}

/* ---------- 光标 ---------- */
const ARROW = [[0, 0], [0, 38], [9, 29.5], [15.5, 43], [22, 40], [15.8, 27], [28, 27]];
function cursor(x, y, pr = 0) {
  ctx.save();
  ctx.translate(x, y);
  const s = 1.45 * (1 - 0.14 * pr);
  ctx.scale(s, s);
  ctx.rotate(-4 * RAD);
  const p = new Path2D();
  ARROW.forEach(([px, py], i) => (i ? p.lineTo(px, py) : p.moveTo(px, py)));
  p.closePath();
  ctx.save();
  ctx.shadowColor = 'rgba(70,48,25,0.3)'; ctx.shadowBlur = 6 - 4 * pr; ctx.shadowOffsetX = 3 - 2 * pr; ctx.shadowOffsetY = 6 - 4 * pr;
  ctx.fillStyle = '#FFFEFA'; ctx.fill(p);
  ctx.restore();
  ctx.lineJoin = 'round'; ctx.lineWidth = 2.4; ctx.strokeStyle = C.ink; ctx.stroke(p);
  ctx.restore();
}
/** 点击落点的四道油墨短线 */
function clickMark(x, y, tc) {
  const p = prog(tc, 0.24);
  if (p <= 0 || p >= 1) return;
  ctx.save();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 4 * (1 - p) + 1; ctx.lineCap = 'round';
  for (const a of [-150, -110, -70, 170]) {
    const r0 = 18 + 26 * eo3(p), r1 = r0 + 16 * (1 - p);
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a * RAD) * r0, y + Math.sin(a * RAD) * r0);
    ctx.lineTo(x + Math.cos(a * RAD) * r1, y + Math.sin(a * RAD) * r1);
    ctx.stroke();
  }
  ctx.restore();
}
/** 光标关键帧 [拍, x, y]：缓入缓出 + 一点弧度 */
function cpath(keys) {
  const ks = keys.map(([b, x, y]) => [B(b), x, y]);
  if (t <= ks[0][0]) return [ks[0][1], ks[0][2]];
  for (let i = 1; i < ks.length; i++) {
    const [t1, x1, y1] = ks[i], [t0, x0, y0] = ks[i - 1];
    if (t < t1) {
      const p = eio((t - t0) / (t1 - t0));
      const bow = Math.sin(Math.PI * p) * 0.12;
      return [lerp(x0, x1, p) - (y1 - y0) * bow, lerp(y0, y1, p) + (x1 - x0) * bow];
    }
  }
  const l = ks[ks.length - 1];
  return [l[1], l[2]];
}
function drawCursor(keys, clicks) {
  const cs = clicks.map(B);
  const [x, y] = cpath(keys);
  cs.forEach(tc => clickMark(x, y, tc));
  cursor(x, y, press(cs));
  return [x, y];
}

/* ---------- 窗口：纸片 + 标题栏，返回局部 → 屏幕坐标映射 ---------- */
const TB = 64;
function win(o, content) {
  const e = o.t0 == null ? 1 : prog(o.t0, 0.3);
  if (e <= 0) return;
  const k = eBack(e);
  ctx.save();
  ctx.translate(o.x + o.w / 2, o.y + o.h / 2 - (1 - k) * 60);
  ctx.rotate(((o.rot ?? 0) + (1 - e) * 3) * RAD);
  const s = (o.s ?? 1) * (1 + 0.05 * (1 - e));
  ctx.scale(s, s);
  ctx.translate(-o.w / 2, -o.h / 2);
  ctx.globalAlpha = clamp(e * 5);
  paper(rr(0, 0, o.w, o.h, 20, o.seed), [0, 0, o.w, o.h], { fill: o.fill ?? C.card, lift: (o.lift ?? 1) + 2 * (1 - e), seed: o.seed, crease: o.crease });
  if (o.title != null) {
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.translate(-1, -1);
      ctx.lineWidth = 2.2; ctx.strokeStyle = C.ink;
      ctx.stroke(circ(34 + i * 30, TB / 2, 9, o.seed + i));
      ctx.restore();
    }
    text(o.title, o.w / 2, TB / 2 + 1, 26, { align: 'center', base: 'middle', color: C.mute, weight: 600 });
    ctx.fillStyle = C.ink; ctx.fillRect(10, TB - 1, o.w - 20, 2.5);
  }
  if (content) {
    ctx.save();
    ctx.translate(0, o.title != null ? TB : 0);
    content(o.w, o.h - (o.title != null ? TB : 0));
    ctx.restore();
  }
  ctx.restore();
}
/** 窗口局部坐标（内容区，不含标题栏）→ 屏幕坐标（按入场结束后的姿态） */
function l2s(o, lx, ly) {
  const s = o.s ?? 1, a = (o.rot ?? 0) * RAD;
  const dx = (lx - o.w / 2) * s, dy = (ly + (o.title != null ? TB : 0) - o.h / 2) * s;
  return [o.x + o.w / 2 + dx * Math.cos(a) - dy * Math.sin(a), o.y + o.h / 2 + dx * Math.sin(a) + dy * Math.cos(a)];
}
/** 固定设计尺寸的内容缩放进任意内容区（平铺时用） */
function fitContent(dw, dh, fn) {
  return (w, h) => {
    const s = Math.min(w / dw, h / dh);
    ctx.save();
    ctx.translate((w - dw * s) / 2, (h - dh * s) / 2);
    ctx.scale(s, s);
    fn(dw, dh);
    ctx.restore();
  };
}

/* ---------- 组件 ---------- */
function toast(x, y, w, title, sub, col, glyph, tIn, seed) {
  const p = prog(tIn, 0.22);
  if (p <= 0) return;
  ctx.save();
  ctx.translate(x + (1 - eBack(p)) * (w + 80), y);
  ctx.rotate(hash(seed, 3) * 1.2 * RAD);
  const h = 104;
  paper(rr(0, 0, w, h, 16, seed), [0, 0, w, h], { lift: 1.2, seed });
  paper(circ(52, h / 2, 26, seed + 1), [26, h / 2 - 26, 52, 52], { fill: col, lift: 0, seed: seed + 1, inkW: 2.2 });
  text(glyph, 52, h / 2 + 2, 28, { align: 'center', base: 'middle', color: C.card, weight: 800 });
  text(title, 96, 46, 29, { weight: 700 });
  text(sub, 96, 80, 23, { color: C.mute, weight: 500 });
  ctx.restore();
}
function toastStack(x, y, w, list, dy = 120) {
  // list: [tIn, title, sub, col, glyph]；新的在最上面，旧的被往下推
  list.forEach(([tIn, ...rest], i) => {
    let push = 0;
    for (let j = i + 1; j < list.length; j++) push += eo3(prog(list[j][0], 0.22));
    toast(x, y + push * dy, w, ...rest, tIn, 400 + i * 7);
  });
}
function heartPath(cx, cy, s) {
  const p = new Path2D();
  p.moveTo(cx, cy + s * 0.42);
  p.bezierCurveTo(cx - s * 1.05, cy - s * 0.2, cx - s * 0.5, cy - s * 1.0, cx, cy - s * 0.45);
  p.bezierCurveTo(cx + s * 0.5, cy - s * 1.0, cx + s * 1.05, cy - s * 0.2, cx, cy + s * 0.42);
  p.closePath();
  return p;
}
function toggle(x, y, on, seed) {
  const w = 120, h = 62;
  paper(rr(x, y, w, h, 31, seed), [x, y, w, h], { fill: mix(C.faint, C.green, on), lift: 0.3, seed, inkW: 2.5 });
  const cx = x + 31 + (w - 62) * eBack(on);
  paper(circ(cx, y + h / 2, 24, seed + 5), [cx - 24, y + 7, 48, 48], { fill: C.card, lift: 0.8, seed: seed + 5, inkW: 2.5 });
}
function bar(x, y, w, h, p, col, seed) {
  paper(rr(x, y, w, h, h / 2, seed), [x, y, w, h], { fill: C.sand, lift: 0, seed, inkW: 2.2 });
  if (p > 0.005) {
    const fw = Math.max(h, w * clamp(p));
    paper(rr(x, y, fw, h, h / 2, seed + 1, 0.6), [x, y, fw, h], { fill: col, lift: 0, seed: seed + 1, ink: false });
  }
}

/* ---------- 各窗口内容（固定设计尺寸，平铺时整体缩放） ---------- */
// 聊天 1000×700
function chatContent(w, h, st) {
  ctx.font = `600 34px ${F.ui}`;
  const bubbles = st.msgs.filter(m => t >= m.tIn);
  const bh = 80, gap = 20;
  const inputY = h - 118;
  let total = bubbles.length * (bh + gap);

  for (let s = t0; s < tt; s += 1 / 240) {
    const k = speed(s);
    for (let i = 0; i < 3; i++) p[i] += rates[i] * k / 240;
  }
  return p;
}
function shotDials() {
  const o1 = { ...SETW, t0: B(16) }, o2 = { ...DLW, t0: B(16) + 0.08 };
  const v = sliderV(t);
  const [g1, g2] = EV.E.toggles.map(B);
  const tgl = [eo3(prog(g1 + 0.02, 0.14)), eo3(prog(g2 + 0.02, 0.14))];
  const grab = t >= B(EV.E.grab) - 0.03 && t < B(EV.E.release) + 0.05 ? 1 : 0;
  bigType('turn it up', 1000, 900, 170, B(EV.E.word), { stagger: 0.025 });
  win(o2, (w, h) => downloadsContent(w, h, { p: dlProgress(t, B(16), s => 1 + 9 * sliderV(s), [0.3, 0.42, 0.12]) }));
  win(o1, (w, h) => settingsContent(w, h, { v, toggles: tgl, grab }));
  const th = v2 => l2s(o1, SET.track[0] + SET.track[2] * v2 + 6, SET.track[1] + 8);
  const [a0x, a0y] = th(0), [a1x, a1y] = th(1);
  const [t1x, t1y] = l2s(o1, SET.toggles[0][0] + 60, SET.toggles[0][1] + 36);
  const [t2x, t2y] = l2s(o1, SET.toggles[1][0] + 60, SET.toggles[1][1] + 36);
  if (grab) {
    const [x, y] = th(v);
    cursor(x, y, 0.6);
  } else {
    drawCursor([[16, 560, 1000], [EV.E.grab, a0x, a0y], [EV.E.release, a1x, a1y], [17.2, t1x, t1y], [17.4, t1x, t1y], [17.58, t2x, t2y], [18, t2x + 120, t2y + 150]], EV.E.toggles);
  }
}

// F：⌘K 命令面板 → 回车 → 通知堆叠
const CMDS = ['Open file…', 'Ship to production', 'Toggle turbo', 'Share post', 'Ship it faster', 'Show chart'];
function shotPalette() {
  const F_ = EV.F;
  const tk = B(F_.keys), te = B(F_.enter);
  win({ x: 170, y: 90, w: 1560, h: 900, rot: -0.4, seed: 26, title: 'notes', t0: B(18) }, (w, h) => {
    for (let i = 0; i < 11; i++) {
      const lw = 400 + 900 * (0.5 + 0.5 * hash(i, 5)), y = 60 + i * 66;
      ctx.fillStyle = i % 4 === 0 ? '#CBBFA9' : C.faint;
      ctx.fillRect(70, y, i % 4 === 0 ? lw * 0.45 : lw, i % 4 === 0 ? 26 : 16);
    }
  });
  // 背景变暗：盖一层半透明油墨
  const dim = clamp(prog(tk, 0.12)) * (1 - prog(te + 0.05, 0.15));
  if (dim > 0) { ctx.fillStyle = `rgba(30,27,24,${0.22 * dim})`; ctx.fillRect(0, 0, W, H); }
  // 键帽 ⌘ K
  const kp = press([tk]), kv = 1 - prog(tk + 0.4, 0.15);
  if (kv > 0 && t >= B(18)) {
    ['⌘', 'K'].forEach((ch, i) => {
      const x = 330 + i * 120, y = 200 + 10 * kp;
      ctx.save(); ctx.globalAlpha = kv;
      paper(rr(x, y, 100, 100, 18, 140 + i), [x, y, 100, 100], { lift: 1.4 - 1.2 * kp, seed: 140 + i });
      text(ch, x + 50, y + 54, 50, { align: 'center', base: 'middle', weight: 700 });
      ctx.restore();
    });
  }
  // 面板
  const open = prog(tk, 0.16), close = prog(te + 0.05, 0.14);
  if (open > 0 && close < 1) {
    const typed = typeBeats(F_.text, ...F_.type, 3).map(B).filter(k => t >= k).length;
    const q = F_.text.slice(0, typed);
    const items = CMDS.filter(c => c.toLowerCase().includes(q));
    const pw = 820, px = 550, py = 190, ih = 76;
    const ph = 116 + items.length * ih + 14;
    ctx.save();
    ctx.translate(px + pw / 2, py);
    const sc = lerp(0.9, 1, eBack(open)) * (1 - 0.15 * close);
    ctx.scale(sc, sc); ctx.globalAlpha = clamp(open * 4) * (1 - close);
    ctx.translate(-pw / 2, -(1 - eBack(open)) * 30);
    paper(rr(0, 0, pw, ph, 22, 150), [0, 0, pw, ph], { lift: 2.4, seed: 150 });
    text('›', 40, 64, 48, { base: 'middle', weight: 700, color: C.red });
    const tw = q ? text(q, 86, 64, 44, { base: 'middle', weight: 600 }) : (text('type a command', 86, 64, 40, { base: 'middle', weight: 500, color: C.mute }), 0);
    ctx.fillStyle = C.red; ctx.fillRect(90 + tw, 40, 4, 48);
    ctx.fillStyle = C.ink; ctx.fillRect(20, 114, pw - 40, 2.5);
    const ep = press([te]);
    items.forEach((c, i) => {
      const y = 126 + i * ih;
      if (i === 0) paper(rr(16, y, pw - 32, ih - 8, 12, 151), [16, y, pw - 32, ih - 8], { fill: ep > 0 ? C.red : C.mustard, lift: 0, seed: 151, inkW: 2.2 });
      text(c, 48, y + ih / 2 - 2, 36, { base: 'middle', weight: 600, color: i === 0 && ep > 0 ? C.card : C.ink });
      if (i === 0) text('↵', pw - 50, y + ih / 2 - 2, 36, { align: 'right', base: 'middle', weight: 700 });
    });
    ctx.restore();
  }
  bigType('ship it', 150, 960, 220, te, { stagger: 0.035 });
  toastStack(1400, 120, 460, [
    [B(F_.toasts[0]), 'Deployed', 'production · 12s', C.green, '✓'],
    [B(F_.toasts[1]), 'Tests passed', '128 / 128', C.blue, '✓'],
    [B(F_.toasts[2]), '+4,096 stars', 'this morning', C.mustard, '★'],
    [B(F_.toasts[3]), 'Server says', 'wow', C.red, '!'],
  ]);
}

// G：图表长高 + 拖窗口
const CHARTW = { w: 820, h: 564, seed: 27, title: 'growth' };
function chartPos(tt) {
  const p = eio(clamp((tt - B(EV.G.grab)) / (B(EV.G.release) - B(EV.G.grab))));
  const v = Math.sin(Math.PI * p);
  return { x: lerp(110, 1050, p), y: lerp(380, 90, p), rot: lerp(-1.5, 0.8, p) - 4 * v, lift: 1 + 2.5 * v };
}
function shotChart() {
  const G = EV.G;
  const pos = chartPos(t);
  const tr = B(G.release);
  const land = t > tr ? Math.exp(-(t - tr) * 12) * Math.sin((t - tr) * 30) * 0.03 : 0;
  bigType('up and to the right', 50, 1030, 118, B(20.5), { rot: -22, stagger: 0.028, track: 2 });
  toastStack(60, 50, 440, [
    [B(G.toasts[0]), 'New high', 'users ▲ 312%', C.green, '▲'],
    [B(G.toasts[1]), 'Chart updated', 'live', C.blue, '↗'],
  ]);
  const o = { ...CHARTW, ...pos, s: 1 + land, t0: B(20) };
  const t0 = B(20);
  win(o, (w, h) => chartContent(w, h, {
    grow: i => eBack(prog(t0 + 0.05 + i * 0.075, 0.18)),
    value: 312 * eo3(prog(t0, B(22) - t0)),
  }));
  const [gx, gy] = [o.x + 260, o.y + 34];
  const dragging = t >= B(G.grab) && t < tr + 0.05;
  if (dragging) cursor(gx, gy, 0.6);
  else drawCursor([[20, 900, 1060], [G.grab, 370, 414], [G.release, 1310, 124], [21.2, 1310, 124], [22, 1500, 300]], [G.grab]);
}

// X：六个窗口平铺，同时爆发
const TILE = (() => {
  const m = 36, g = 26, tw = (W - 2 * m - 2 * g) / 3, th = (H - 2 * m - g) / 2;
  return Array.from({ length: 6 }, (_, i) => ({ x: m + (i % 3) * (tw + g), y: m + Math.floor(i / 3) * (th + g), w: tw, h: th }));
})();
const BURST_TEXTS = ['faster', 'ok', 'even faster', 'shipping', '10×', 'again', 'done', 'next'];
const MORE_CODE = ["  const v = accelerate({ to: 'max' })", '  return ship(v)', '}', '', 'export function again() {', '  return go().then(go)', '}', '', 'for (;;) ship(faster())'];
function shotBurst() {
  const X = EV.X, t0 = B(X.snap);
  const clicks = X.clicks.map(B);
  const titles = ['chat', 'post', 'speed.ts', 'settings', 'downloads', 'growth'];
  const bump = i => { let v = 0; X.targets.forEach((ti, k) => { if (ti === i) v = Math.max(v, press([clicks[k]])); }); return v; };
  const contents = [
    fitContent(1000, 700, (w, h) => chatContent(w, h, {
      msgs: [{ text: 'on it. faster than fast.', side: 'l', tIn: -1, seed: 43 },
        ...X.msgs.map((b, i) => ({ text: BURST_TEXTS[i], side: i % 2 ? 'l' : 'r', tIn: B(b), seed: 300 + i }))],
      input: '', caret: false, sendPress: bump(0),
    })),
    fitContent(860, 560, (w, h) => {
      const k = clamp((t - t0) / (B(26) - t0));
      postContent(w, h, { liked: 1, likePop: bump(1), likes: 1.2e6 * 8.25 ** k, reposted: 1, reposts: 48000 * 6.5 ** k, views: 4.1e6 * 3 ** k });
    }),
    fitContent(1100, 700, (w, h) => {
      const base = codeState(B(16)).lines.slice(0, 4);
      const chars = Math.floor((t - t0) * 70);
      let left = chars;
      const typed = [];
      for (const ln of MORE_CODE.slice(1)) { if (left <= 0) break; typed.push({ text: ln.slice(0, left) }); left -= ln.length + 1; }
      const lines = [...base, ...typed];
      codeContent(w, h, { lines, caret: [lines.length - 1, lines[lines.length - 1].text.length], scroll: Math.max(0, lines.length - 9) });
    }),
    fitContent(760, 600, (w, h) => {
      const bt = (t - t0) / 0.46;
      const v = 0.55 + 0.45 * Math.abs(Math.sin(bt * 1.7));
      settingsContent(w, h, { v, toggles: [Math.floor(bt * 2) % 2 ? 1 : 0, Math.floor(bt * 2 + 1) % 2 ? 1 : 0].map((x, i) => x ^ (i ? 1 : 0) ? 1 : 0), grab: bump(3) });
    }),
    fitContent(800, 400, (w, h) => {
      const p = [0.1, 0.45, 0.7].map((o, i) => (o + (t - t0) * [1.3, 0.9, 1.7][i]) % 1.08);
      downloadsContent(w, h, { p });
    }),
    fitContent(820, 500, (w, h) => chartContent(w, h, {
      grow: () => 1, scale: 1 + 0.25 * eo3(prog(t0, B(26) - t0)) * (1 + 0.06 * Math.sin((t - t0) * 20)),
      value: 312 + 988 * eo3(prog(t0, B(26) - t0)),
    })),
  ];
  TILE.forEach((tl, i) => {
    const p = eBack(prog(t0 + i * 0.03, 0.24));
    const ox = 700 * hash(i, 91), oy = 500 * hash(i, 92), orot = 10 * hash(i, 93);
    const bp = bump(i);
    win({
      x: tl.x + ox * (1 - p), y: tl.y + oy * (1 - p), w: tl.w, h: tl.h, rot: orot * (1 - p) + 0.6 * hash(i, 94),
      s: 1 - 0.02 * bp, seed: 60 + i, title: titles[i], lift: 1 + 2 * (1 - clamp(p)),
    }, contents[i]);
  });
  // 通知从右上角往下堆
  toastStack(1420, 26, 460, X.toasts.map((b, i) => [B(b), ['Deployed', 'Merged', '+1M likes', 'Tests passed', 'New high', 'Shipped', 'Again'][i], ['v2.' + (i + 1), 'main', 'post', '128 / 128', 'growth', 'production', 'faster'][i], [C.green, C.blue, C.red, C.green, C.mustard, C.blue, C.red][i], ['✓', '↗', '♥', '✓', '▲', '✓', '!'][i]]), 112);
  // 红色纸条 + ALL AT ONCE
  const sp = eo3(prog(t0, 0.14));
  if (sp > 0) {
    ctx.save();
    ctx.translate(960, 560); ctx.rotate(-4 * RAD);
    const sw = 2300 * sp, sh = 250;
    ctx.translate(-1150, -sh / 2);
    paper(rr(0, 0, sw, sh, 6, 170, 2), [0, 0, sw, sh], { fill: C.red, lift: 2.2, seed: 170, inkW: 3.5 });
    ctx.restore();
    const words = ['ALL', 'AT', 'ONCE'];
    ctx.save();
    ctx.translate(960, 560); ctx.rotate(-4 * RAD);
    const pulse = 1 + 0.05 * Math.exp(-Math.max(0, t - B(25)) * 8) * (t >= B(25) ? 1 : 0);
    ctx.scale(pulse, pulse);
    ctx.font = `800 210px ${F.big}`;
    const ws = words.map(w => ctx.measureText(w).width), gap = 60, total = ws.reduce((a, b) => a + b) + gap * 2;
    let x = -total / 2;
    words.forEach((wd, i) => { bigType(wd, x, 88, 210, B(X.words[i]), { stagger: 0.03, color: C.card, shade: C.ink }); x += ws[i] + gap; });
    ctx.restore();
  }
  // 光标在窗口之间来回点
  const keys = [[22, 1500, 900]];
  X.clicks.forEach((b, k) => {
    const tl = TILE[X.targets[k]];
    keys.push([b - 0.12, tl.x + tl.w * (0.35 + 0.3 * (hash(k, 7) * 0.5 + 0.5)), tl.y + tl.h * (0.4 + 0.35 * (hash(k, 8) * 0.5 + 0.5))]);
    keys.push([b + 0.05, keys[keys.length - 1][1], keys[keys.length - 1][2]]);
  });
  drawCursor(keys, X.clicks);
}

// Z：收尾
function shotEnd() {
  const t0 = B(EV.Z.hit), tc = B(EV.Z.click);
  ctx.font = `800 260px ${F.big}`;
  const word = 'accelerate', ww = ctx.measureText(word + '.').width;
  const x0 = 960 - ww / 2;
  bigType(word, x0, 600, 260, t0, { stagger: 0.025 });
  // 句点：被点一下，变红弹起
  const pp = prog(t0 + 0.25, 0.2), dotX = x0 + ctx.measureText(word).width + ctx.measureText('.').width / 2;
  if (pp > 0) {
    const bounce = t > tc ? Math.exp(-(t - tc) * 7) * Math.sin((t - tc) * 26) : 0;
    ctx.save();
    ctx.translate(dotX, 600 - 30 - 40 * bounce);
    ctx.scale(eBack(pp) * (1 + 0.5 * Math.abs(bounce)), eBack(pp) * (1 + 0.5 * Math.abs(bounce)));
    paper(circ(0, 0, 24, 180), [-24, -24, 48, 48], { fill: t >= tc ? C.red : C.ink, lift: 0.6 + Math.abs(bounce), seed: 180, ink: t >= tc });
    ctx.restore();
  }
  const up = eo3(prog(t0 + 0.3, 0.3));
  if (up > 0) {
    const uw = ww * up;
    paper(rr(x0, 650, uw, 26, 4, 181, 1.4), [x0, 650, uw, 26], { fill: C.red, lift: 0.5, seed: 181, inkW: 2.5 });
  }
  const sp = eo3(prog(t0 + 0.6, 0.35));
  if (sp > 0) {
    ctx.save(); ctx.globalAlpha = sp;
    text('一起加速', 960, 790 + 20 * (1 - sp), 64, { align: 'center', font: F.zh, weight: 600, color: C.mute });
    ctx.restore();
  }
  drawCursor([[26, 1560, 1120], [27, 1560, 1120], [27.85, dotX + 8, 582], [30, dotX + 8, 582]], [EV.Z.click]);
}

const DRAW = { button: shotButton, chat: shotChat, post: shotPost, code: shotCode, dials: shotDials, palette: shotPalette, chart: shotChart, burst: shotBurst, end: shotEnd };

/* ---------- seek：t 的纯函数 ---------- */
function render(tt) {
  t = Math.max(0, Math.min(DURATION, tt));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(BG, 0, 0);
  const shot = SHOTS.find(s => t >= B(s.b0) && t < B(s.b1)) ?? SHOTS[SHOTS.length - 1];
  // 切镜头时的一记"推近"：1.8% 缩放在 0.2s 内回落
  const since = t - B(shot.b0);
  const z = shot.b0 > 0 ? 1 + 0.018 * Math.exp(-since * 12) : 1;
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  DRAW[shot.id]();
  ctx.restore();
}

/* ---------- 预览：点击或空格播放 ---------- */
function startPreview() {
  let actx = null, buf = null, src = null, t0 = 0, playing = false, tt = 0;
  const toggle = async () => {
    if (playing) { src.stop(); playing = false; return; }
    actx ??= new AudioContext();
    buf ??= await M.renderMusic();
    if (tt >= DURATION) tt = 0;
    src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
    src.start(0, tt); t0 = actx.currentTime - tt; playing = true;
  };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
  cv.addEventListener('click', toggle);
  (function loop() {
    if (playing) { tt = actx.currentTime - t0; if (tt >= DURATION) { tt = DURATION; src.stop(); playing = false; } }
    render(tt);
    requestAnimationFrame(loop);
  })();
}

await document.fonts.load(`800 100px ${F.big}`);
await document.fonts.load(`600 30px ${F.ui}`);
await document.fonts.load(`500 30px ${F.code}`);
await document.fonts.load(`600 30px ${F.zh}`, '一起加速');
render(0);
window.__video = {
  width: W, height: H, fps: FPS, duration: DURATION,
  seek: render,
  renderAudio: async () => M.encodeWav(await M.renderMusic()),
};
if (!RENDER) startPreview();
