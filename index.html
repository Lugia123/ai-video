<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>讲解员 · 动作 / 表情 / 情绪符号 / 说话</title>
<style>
  /* 色板：从两个颜色推出来的——墨色（人物制服的深蓝，OKLCH 0.28 0.075 262）和唯一的强调色橙 #FF5A1F（OKLCH 0.68 0.21 38）。
     对比度是按「毛玻璃叠在房间最暗处」的实际底色量的：墨色字 ≥ 12.7，次要字 ≥ 5.9，报错字 ≥ 5.7，橙底上的墨色字 4.7。
     橙色对白底只有 2.7–3.1，所以橙色不单独当字色、不单独当焦点框；要靠颜色区分的地方另有字重或位置。 */
  :root {
    color-scheme: light;
    --ink: #13274D; --ink-2: #4B5B77; --edge: #68758D;
    --accent: #FF5A1F; --accent-hover: #FF6C36; --accent-press: #E44A02; --accent-edge: #B83B03; --accent-wash: #FFEBE4;
    --bad: #B6143F;
    --page: #EEF0F3;
    --glass: rgb(255 255 255 / .56); --glass-thick: rgb(255 255 255 / .7);
    --ctl: rgb(255 255 255 / .62); --ctl-hover: #FFFFFF; --ctl-press: #E9EDF2;
    --track: rgb(19 39 77 / .16);
    --shadow-ctl: 0 0 0 .5px rgb(19 39 77 / .16), 0 1px 1.5px rgb(19 39 77 / .12);
    --shadow-float: 0 0 0 .5px rgb(19 39 77 / .12), 0 2px 6px rgb(19 39 77 / .06), 0 18px 48px rgb(19 39 77 / .14);
    --shadow-chip: 0 0 0 .5px rgb(19 39 77 / .12), 0 1px 3px rgb(19 39 77 / .08), 0 8px 24px rgb(19 39 77 / .10);
    --blur: blur(28px) saturate(180%);
    --ease-out: cubic-bezier(.23, 1, .32, 1); --ease-sheet: cubic-bezier(.32, .72, 0, 1);
    --r-panel: 24px; --r-ctl: 9px; --pad: 16px; --peek: 292px;
    --figx: 50vw; --capb: 22px; --loady: 62vh;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; }
  body { height: 100dvh; overflow: hidden; color: var(--ink); background: linear-gradient(#EDEFF2 0 46%, #E3E6EA 46.2%, #F1F2F4 100%);
    font: .875rem/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* —— 房间和人 —— */
  #room { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #stagebox { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  #fit { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  body.is-intro #fit { will-change: transform; }
  #stage { position: relative; width: 1200px; height: 1080px; overflow: hidden; pointer-events: auto; touch-action: manipulation; }
  #stage.hit { cursor: pointer; }
  #poster { position: absolute; left: 0; top: 0; width: 1200px; height: 1080px; }
  #poster:not([src]) { display: none; }
  body:not(.is-ready) #stage { pointer-events: none; }          /* 加载和镜头移动时人物点不了 */

  /* —— 毛玻璃底：半透明白 + 模糊提饱和，上沿一道 1px 高光，下面柔和的投影 —— */
  .glass { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid transparent;
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / .55), inset 0 1px 0 rgb(255 255 255 / .9), var(--shadow-float); }

  /* —— 字幕 —— */
  #caption { position: fixed; z-index: 2; left: var(--figx); bottom: var(--capb); translate: -50% 0; margin: 0; width: max-content; max-width: min(92vw, 30em); text-align: center; pointer-events: none;
    transition: opacity 300ms ease; }
  body:not(.is-ready) #caption { opacity: 0; }
  #caption span { display: inline-block; font-size: 1.125rem; font-weight: 600; line-height: 1.35; padding: 7px 18px; border-radius: 14px; text-wrap: balance; overflow-wrap: break-word;
    background: var(--glass-thick); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .6), var(--shadow-chip); }
  #caption span.idle, #caption span.error { font-weight: 400; font-size: .8125rem; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
  #caption span.idle { color: var(--ink-2); }
  #caption span.error { color: var(--bad); white-space: pre-wrap; text-wrap: wrap; background: var(--glass-thick); box-shadow: var(--shadow-chip); }

  /* —— 加载条 —— */
  #loading { position: fixed; z-index: 4; left: 50%; top: var(--loady); translate: -50% 0; width: min(300px, calc(100vw - 48px)); padding: 12px 16px 14px; border-radius: 16px;
    transition: opacity 150ms ease-out, translate 150ms ease-out; }
  #loading.gone { opacity: 0; translate: -50% -8px; pointer-events: none; }
  #loadRow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  #loadWhat { font-weight: 600; }
  #loadPct { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  #loadBar { margin-top: 9px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  #loadFill { height: 100%; width: 100%; border-radius: 2px; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); transition: transform 240ms linear; }
  #loadSize { margin: 7px 0 0; min-height: 1.4em; font-size: .75rem; line-height: 1.4; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  #loading.failed #loadBar, #loading.failed #loadPct { display: none; }
  #loading.failed #loadSize { font-size: .8125rem; overflow-wrap: anywhere; }
  #retry { display: none; margin-top: 10px; width: 100%; min-height: 34px; }
  #loading.failed #retry { display: block; }

  #skip { position: fixed; z-index: 4; right: 20px; bottom: 20px; min-height: 34px; padding: 6px 16px; border-radius: 17px; opacity: 0; visibility: hidden; transition: opacity 200ms ease, visibility 0s 200ms, scale 150ms ease-out; }
  body.is-intro #skip { opacity: 1; visibility: visible; transition: opacity 200ms ease 300ms, scale 150ms ease-out; }

  /* —— 按钮面板 —— */
  #panel { position: fixed; z-index: 3; top: 16px; right: 16px; bottom: 16px; width: clamp(300px, 27vw, 372px); border-radius: var(--r-panel); display: flex; flex-direction: column; overflow: hidden;
    opacity: 0; translate: 32px 0; scale: .985; visibility: hidden; }
  body.is-ready #panel { opacity: 1; translate: 0 0; scale: 1; visibility: visible; transition: opacity 420ms ease-out, translate 560ms var(--ease-sheet), scale 560ms var(--ease-sheet); }
  #grab { display: none; }
  #panelBody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgb(19 39 77 / .28) transparent; display: flex; flex-direction: column; gap: 18px; padding: var(--pad) var(--pad) 22px;
    -webkit-mask-image: linear-gradient(#0000, #000 12px, #000 calc(100% - 18px), #0000); mask-image: linear-gradient(#0000, #000 12px, #000 calc(100% - 18px), #0000); }
  section { --d: calc(var(--i, 0) * 50ms + 140ms); }
  body.is-ready section { animation: rise 380ms var(--ease-out) var(--d) both; }
  @keyframes rise { from { opacity: 0; translate: 0 12px; filter: blur(4px); } }
  h2 { font-size: .75rem; font-weight: 600; line-height: 1.3; color: var(--ink-2); margin: 0 0 8px; }
  .btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }

  button { font: inherit; font-size: .8125rem; line-height: 1.25; min-height: 28px; padding: 4px 8px; border-radius: var(--r-ctl); border: 1px solid transparent; background: var(--ctl); color: var(--ink); box-shadow: var(--shadow-ctl);
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: background-color 120ms ease, box-shadow 120ms ease, scale 150ms ease-out; }
  @media (hover: hover) { button:not(:disabled, [aria-disabled="true"]):hover { background: var(--ctl-hover); box-shadow: 0 0 0 .5px rgb(19 39 77 / .2), 0 1px 2.5px rgb(19 39 77 / .16); } }
  button:not(:disabled, [aria-disabled="true"]):active { scale: .96; background: var(--ctl-press); }
  button:disabled { opacity: .4; cursor: default; }
  button[aria-disabled="true"] { opacity: .42; cursor: not-allowed; }          /* 有动作正在做：动作按钮和「随机来一个」点了无效 */
  button.on[aria-disabled="true"] { opacity: 1; }          /* 正在做的那一个照样亮着 */
  button.on { background: var(--accent-wash); box-shadow: 0 0 0 1.5px var(--accent-press); font-weight: 600; }          /* 正在生效的那一个：橙圈 + 加粗 */
  @media (hover: hover) { button.on:not(:disabled, [aria-disabled="true"]):hover { background: #FFF3EE; box-shadow: 0 0 0 1.5px var(--accent-press); } }
  :is(button, input, summary):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  #randomBtn { width: 100%; min-height: 46px; font-size: 1.0625rem; font-weight: 600; border-radius: 13px; background: var(--accent); color: var(--ink);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .38), 0 0 0 .5px var(--accent-edge), 0 1px 2px rgb(184 59 3 / .3), 0 6px 16px rgb(255 90 31 / .22); }
  @media (hover: hover) { #randomBtn:not(:disabled, [aria-disabled="true"]):hover { background: var(--accent-hover); box-shadow: inset 0 1px 0 rgb(255 255 255 / .38), 0 0 0 .5px var(--accent-edge), 0 1px 2px rgb(184 59 3 / .3), 0 8px 20px rgb(255 90 31 / .28); } }
  #randomBtn:not(:disabled, [aria-disabled="true"]):active { background: var(--accent-press); }
  #randomNote { margin: 9px 2px 0; font-size: .8125rem; line-height: 1.45; color: var(--ink-2); min-height: 2.9em; text-wrap: pretty; }

  p.opt { margin: 10px 0 0; color: var(--ink-2); font-size: .8125rem; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-variant-numeric: tabular-nums; }
  p.opt label { display: inline-flex; align-items: center; min-height: 24px; }
  #clearEmote { margin-inline-start: auto; min-height: 26px; padding: 3px 11px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 112px; height: 24px; margin: 0; background: none; cursor: pointer; --p: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .5px rgb(19 39 77 / .3), 0 1px 3px rgb(19 39 77 / .32); transition: scale 150ms ease-out; }
  input[type=range]:not(:disabled):active::-webkit-slider-thumb { scale: 1.08; }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .5px rgb(19 39 77 / .3), 0 1px 3px rgb(19 39 77 / .32); }
  input[type=range]:disabled { cursor: default; }

  details { margin-top: 10px; }
  summary { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; cursor: pointer; color: var(--ink-2); font-size: .8125rem; border-radius: 6px; padding: 2px 6px 2px 2px; list-style: none; -webkit-tap-highlight-color: transparent; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: ""; width: 6px; height: 6px; margin: 0 3px 0 4px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; rotate: -45deg; transition: rotate 150ms ease-out; }
  details[open] > summary::before { rotate: 45deg; }
  details[open] > summary { margin-bottom: 8px; }
  #reset { color: var(--ink-2); }

  /* —— 直接双击打开时的说明 —— */
  #fileNote { display: none; position: relative; z-index: 5; max-width: 40em; margin: 0; padding: 28px; font-size: 1rem; line-height: 1.8; }
  #fileNote code { font: .875rem ui-monospace, "SF Mono", Menlo, monospace; background: #fff; padding: 2px 7px; border-radius: 5px; }
  body.file { overflow: auto; } body.file > :not(#fileNote) { display: none; } body.file #fileNote { display: block; }

  /* —— 窄屏：面板改成底部抽屉 —— */
  @media (max-width: 860px) {
    :root { --pad: 14px; }
    #panel { --glass: rgb(255 255 255 / .8); top: auto; left: 8px; right: 8px; bottom: 0; width: auto; height: min(calc(100dvh - 56px), 760px); border-radius: var(--r-panel) var(--r-panel) 0 0; translate: 0 100%; scale: 1;
      transform: translateY(calc(100% - var(--peek))); padding-bottom: env(safe-area-inset-bottom); }
    body.is-ready #panel { transition: opacity 300ms ease-out, translate 620ms var(--ease-sheet), transform 500ms var(--ease-sheet); }
    body.sheet-open #panel { transform: none; }
    #panel.dragging { transition: none !important; }
    #grab { display: block; flex: none; width: 100%; height: 30px; min-height: 0; padding: 0; border-radius: 0; background: none; box-shadow: none; touch-action: none; }
    #grab::before { content: ""; display: block; width: 38px; height: 5px; margin: 0 auto; border-radius: 3px; background: rgb(19 39 77 / .5); }
    #grab:active { scale: 1 !important; background: none !important; }
    #grab:focus-visible { outline-offset: -4px; }
    #panelBody { padding-top: 2px; gap: 22px; -webkit-mask-image: linear-gradient(#000 calc(100% - 18px), #0000); mask-image: linear-gradient(#000 calc(100% - 18px), #0000); }
    body:not(.sheet-open) #panelBody { overflow: hidden; }
    body:not(.sheet-open) #panel { touch-action: none; }
    .btns { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
    button { min-height: 40px; }
    #randomBtn { min-height: 50px; }
    #clearEmote { min-height: 36px; }
    #skip { right: 50%; translate: 50% 0; bottom: calc(24px + env(safe-area-inset-bottom)); min-height: 40px; }
    input[type=range] { width: 136px; height: 32px; }
    summary { min-height: 32px; }
    #caption span { font-size: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    #panel, body.is-ready #panel { translate: 0 0; scale: 1; transition: opacity 240ms ease; }
    body.is-ready section { animation: appear 240ms ease var(--d) both; }
    button, input[type=range]::-webkit-slider-thumb, summary::before, #loading, #skip { transition-duration: 1ms; }
    button:active, input[type=range]:not(:disabled):active::-webkit-slider-thumb { scale: 1 !important; }
  }
  @keyframes appear { from { opacity: 0; } }
  @media (prefers-reduced-transparency: reduce) {
    :root { --glass: rgb(250 251 252 / .97); --glass-thick: rgb(250 251 252 / .97); --blur: none; }
  }
  @media (prefers-contrast: more) {
    :root { --glass: #FFFFFF; --glass-thick: #FFFFFF; --ctl: #FFFFFF; --blur: none; --ink-2: #2E3E5C; --shadow-ctl: 0 0 0 1px var(--ink); --track: rgb(19 39 77 / .45); }
    .glass, #caption span { border-color: var(--ink); }
  }
  @media (forced-colors: active) { .glass, button, #caption span { border-color: CanvasText; } #loadFill { background: Highlight; } }
</style>
<canvas id="room" aria-hidden="true"></canvas>
<div id="fileNote">这个页面要走本地服务打开，直接双击 index.html 不行（浏览器不让本地文件加载脚本模块和读图片像素）。<br>
  在这个目录里运行：<code>sh start.sh</code>，然后打开它打印出来的地址。<br>macOS 可以直接双击目录里的「打开.command」。</div>
<main id="stagecol">
  <h1 class="vh">讲解员演示</h1>
  <div id="stagebox"><div id="fit"><div id="stage"><img id="poster" alt="" decoding="async"><div id="host" role="img" aria-label="讲解员"></div></div></div></div>
  <p id="caption" aria-live="polite"><span class="idle">（没在说话）</span></p>
</main>
<div id="loading" class="glass">
  <div id="loadRow"><span id="loadWhat" role="status">准备中</span><span id="loadPct" aria-hidden="true">0%</span></div>
  <div id="loadBar" role="progressbar" aria-label="加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loadFill"></div></div>
  <p id="loadSize"></p>
  <button id="retry" type="button" aria-describedby="loadSize">重试</button>
</div>
<button id="skip" class="glass" type="button">跳过</button>
<aside id="panel" class="glass" aria-label="按钮面板" inert>
  <button id="grab" type="button" aria-expanded="false" aria-controls="panelBody" aria-label="展开按钮面板"></button>
  <div id="panelBody">
  <section style="--i:0"><button id="randomBtn" class="solid">随机来一个</button><p id="randomNote">随机挑一个动作 + 一张表情 + 一个情绪符号；点人物也一样。</p></section>
  <section style="--i:1"><h2>动作</h2><div class="btns" id="actions"></div>
    <details id="moreSec"><summary>更多版本</summary><div class="btns" id="moreActions"></div></details>
</section>
  <section style="--i:2"><h2>表情</h2><div class="btns" id="faces"></div>
    <p class="opt"><label for="faceStay">停留</label> <input id="faceStay" type="range" min="1.5" max="8.5" step="0.5" value="4"> <span id="faceStayVal"></span></p></section>
  <section style="--i:3"><h2>情绪符号</h2><div class="btns" id="emotes"></div>
    <p class="opt"><label for="stay">停留</label> <input id="stay" type="range" min="1.5" max="8" step="0.5" value="3"> <span id="stayVal"></span><button id="clearEmote">收起情绪符号</button></p></section>
  <section id="comboSec" style="--i:4"><h2>常用组合（一个情绪符号 + 一张表情）</h2><div class="btns" id="combos"></div></section>
  <section style="--i:5"><h2>说话（只有口型，没有声音）</h2><div class="btns"><button id="talk" class="solid">说话</button></div></section>
  <section style="--i:6"><div class="btns"><button id="reset">全部复位</button></div></section>
  </div>
</aside>
<script>if (location.protocol === 'file:') document.body.classList.add('file'); else document.body.classList.add('is-loading');</script>
<script type="module">
// 片段式讲解员的成品页：点按钮往时间表里加东西（动作 / 表情 / 情绪符号 / 一句话），时间一直往前走；画面始终是「时间表 + t」的函数。
// 目录约定：./lib/ 是播放器和讲解员的脚本（原样拷来的），./library/ 是片段库（clips.json、points.json、frames/、patches/、track*/）。
// ?intro=0 不走开场镜头（直接到位）。?lib=<目录> 换片段库目录；?rebase=<秒> 改「空闲多久把时钟拨回去」（测试用，默认 120）；?seed=<数字> 把「随机来一个」和「说话」的随机固定下来（复现、录屏用）。
import './lib/clips/player.js';
import { createClipHost } from './lib/host-clips/index.js';
import { attachEmotes, emoteSpan } from './lib/host-clips/emotes.js';

const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const W = 1200, H = 1080, X = 600, GROUND = 1040;
const LIB = new URL((Q.get('lib') || 'library') + '/', location.href).href, REBASE = +(Q.get('rebase') || 120);
const T_PAGE = performance.now();
// 随机：交互页，默认用 Math.random；带 ?seed= 时换成带种子的
const rnd = Q.has('seed') ? (() => { let a = (+Q.get('seed') || 0) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })() : Math.random;
const pick = list => list[Math.floor(rnd() * list.length)];

let now = 0, sentences = [], poses = [], emotes = [], faces = [], DURATION = 20, PAGE = {};
const timingsOf = () => ({ duration: DURATION, segments: [{ sentences }] });
function stateAt(t) {
  const p = poses.find(q => t >= q.t0 && t < q.t1), e = emotes.find(q => t >= q.t0 && t < q.t1), f = faces.find(q => t >= q.t0 && t < q.t1);
  return { x: X, ...(p ? { pose: { [p.name]: 1 }, ...(p.move ? { move: p.move } : {}) } : {}), ...(e ? { emote: e } : {}), ...(f ? { face: f.name } : {}) };
}

// ———————————————————— 场景（只管怎么摆、怎么亮相，不碰时间表）————————————————————
// 白色大房间：一张铺满窗口的画布，每个像素从镜头出发找它打到哪面墙（地面 / 后墙 / 两面侧墙 / 天花板），明暗的算法照着成片里的房间：
// 各面亮度差一点点、墙角墙脚的柔和暗角、地面中间一片顶光、脚下一块接触阴影。只在镜头动和窗口变的时候画，停稳之后不占显卡。
// 人物是房间里 z = 0 处一张正对镜头的平面（舞台那块 1200×1080），镜头只平移不转，所以人永远是正面。长度单位 = 舞台像素，U = 房间里的 1 个单位。
const U = 570, NARROW = matchMedia('(max-width: 860px)'), CALM = matchMedia('(prefers-reduced-motion: reduce)');
const ROOM_FRAG = `precision highp float;
uniform vec2 res, pp; uniform float dpr, f; uniform vec3 cam, room;
float ao(float d, float s) { return exp(-max(d, 0.0) / s); }
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {

const hitG = Object.assign(document.createElement('canvas'), { width: 1, height: 1 }).getContext('2d', { willReadFrequently: true });
function onHost(ev) {
  const c = host.canvas, r = c.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W, y = (ev.clientY - r.top) / r.height * H, b = host.bbox();
  if (!b || x < b.x0 || x > b.x1 || y < b.y0 || y > b.y1) return false;
  hitG.clearRect(0, 0, 1, 1); hitG.drawImage(c, Math.round(x * c.width / W), Math.round(y * c.height / H), 1, 1, 0, 0, 1, 1);          // 只把那一个像素拷出来读，不去读整张讲解员画布
  return hitG.getImageData(0, 0, 1, 1).data[3] > 40;
}
$('stage').addEventListener('pointermove', ev => $('stage').classList.toggle('hit', !acting() && onHost(ev)));
$('stage').addEventListener('pointerleave', () => $('stage').classList.remove('hit'));
$('stage').addEventListener('click', ev => { if (onHost(ev)) randomAct(); });
$('reset').onclick = () => { sentences = []; poses = []; emotes = []; faces = []; changed(); };

// 开着不管时时间表会越来越长（每次点按钮都要把整条时间表扫一遍）。空闲时把时钟拨回去：往回拨呼吸周期的整数倍（呼吸不跳），并且只挑两头都睁着眼的时刻。
function rebase() {
  if (now < REBASE || busyUntil() > now || sentences.some(s => s.end > now) || emotes.some(e => e.t1 > now)) return;
  const bp = host.lib.breath.period, S = Math.floor((now - 2) / bp) * bp, bl = host.lib.blink, open = t => !bl || (((t + (bl.offset || 0)) % bl.period) + bl.period) % bl.period > bl.closed + 0.05;
  if (S <= 0 || !open(now) || !open(now - S) || !open(now - S - 0.1)) return;
  faces = faces.filter(f => f.t1 > now).map(f => ({ ...f, t0: Math.max(0, f.t0 - S), t1: f.t1 > 1e8 ? f.t1 : f.t1 - S }));
  sentences = []; poses = []; emotes = []; window.__app.lastTalk = null; now -= S; DURATION = now + 20; host.duration = DURATION; host.retime(timingsOf()); window.__app.rebased++;
}

const cap = $('caption').firstElementChild; let capKey = '';
function caption() {
  const cur = sentences.find(s => !s.silent && now >= s.start && now < s.end), lt = window.__app.lastTalk, mute = !cur && lt && now >= lt.t0 && now < lt.t0 + lt.seconds;
  const key = problem ? 'e' + problem : cur ? 's' + cur.text : mute ? 'm' : '';
  if (key === capKey) return; capKey = key;
  cap.className = problem ? 'error' : cur ? '' : 'idle'; cap.textContent = problem || (cur ? cur.text : mute ? '（说话中：只有口型，没有声音）' : '（没在说话）');
}
window.__host = () => host;
window.__app = { now: () => now, loadMs: Math.round(T_READY - T_PAGE), rebased: 0, frames: 0, randomLog: [], randomSkipped: 0, lastTalk: null, seeded: Q.has('seed') };
let last = performance.now();
function loop(ts) {
  now += Math.min(0.1, (ts - last) / 1000); last = ts;
  rebase();
  if (now > DURATION - 10) { DURATION = now + 20; host.duration = DURATION; }
  try { drawHost(now); } catch (e) { problem = e.message; }
  caption(); lit(); window.__app.frames++;
  requestAnimationFrame(loop);
}
drawHost(0); $('poster').remove(); requestAnimationFrame(loop);

// ———————————————————— 面板上的展示细节（不改按钮做什么）————————————————————
// 滑杆左半段填色：把当前位置写成 --p
for (const r of document.querySelectorAll('input[type=range]')) { const fill = () => r.style.setProperty('--p', (r.value - r.min) / (r.max - r.min) * 100 + '%'); r.addEventListener('input', fill); fill(); }
// 正在生效的那个按钮亮着（动作 / 表情 / 情绪符号）；有动作正在做时动作按钮和「随机来一个」置灰。只读时间表，状态变了才动 DOM
let litKey = '';
function lit() {
  let mv = null; try { mv = host.moves().find(m => now >= m.t0 && now < m.t1); } catch (e) {}
  const s = stateAt(now), a = (mv && mv.action) || (s.pose ? Object.keys(s.pose)[0] : ''), f = s.face || '', e = s.emote ? s.emote.name : '';
  const busy = acting(), key = a + '|' + f + '|' + e + '|' + busy; if (key === litKey) return; litKey = key;
  $('randomBtn').setAttribute('aria-disabled', busy); if (busy) $('stage').classList.remove('hit');
  for (const b of $('panelBody').querySelectorAll('button[data-action], button[data-face], button[data-emote]')) {
    const on = b.dataset.action !== undefined ? b.dataset.action === a : b.dataset.face !== undefined ? (b.dataset.face !== '' && b.dataset.face === f) : b.dataset.emote === e;
    if (b.dataset.action !== undefined) b.setAttribute('aria-disabled', busy);
    if (b.classList.contains('on') !== on) { b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); }
  }
}

// 窄屏的底部抽屉：点把手展开 / 收起；也可以拖（收起时整块都能往上拖）。松手时按速度推一下落点，决定停在哪一头。
{ const panel = $('panel'), grab = $('grab'), body = document.body; let drag = null;
  const open = () => body.classList.contains('sheet-open');
  const setOpen = v => { body.classList.toggle('sheet-open', v); grab.setAttribute('aria-expanded', v); grab.setAttribute('aria-label', v ? '收起按钮面板' : '展开按钮面板'); if (!v) $('panelBody').scrollTop = 0; };
  const travel = () => panel.offsetHeight - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--peek')) || 292);
  grab.addEventListener('click', () => setOpen(!open()));
  panel.addEventListener('pointerdown', ev => { if (!NARROW.matches || drag || (open() && ev.target !== grab)) return; drag = { id: ev.pointerId, y0: ev.clientY, base: open() ? 0 : travel(), on: false, hist: [[ev.timeStamp, ev.clientY]] }; });
  panel.addEventListener('pointermove', ev => { if (!drag || ev.pointerId !== drag.id) return;
    const dy = ev.clientY - drag.y0; if (!drag.on) { if (Math.abs(dy) < 8) return; drag.on = true; panel.setPointerCapture(ev.pointerId); panel.classList.add('dragging'); }
    drag.hist.push([ev.timeStamp, ev.clientY]); if (drag.hist.length > 5) drag.hist.shift();
    const T = travel(); let y = drag.base + dy; if (y < 0) y = -(-y * T * 0.55) / (T + 0.55 * -y); else if (y > T) y = T + ((y - T) * T * 0.55) / (T + 0.55 * (y - T));          // 两头越拖越拖不动
    panel.style.transform = `translateY(${y}px)`; });
  const end = ev => { if (!drag || ev.pointerId !== drag.id) return; const d = drag; drag = null; if (!d.on) return;
    const [ta, ya] = d.hist[0], [tb, yb] = d.hist[d.hist.length - 1], v = tb > ta ? (yb - ya) / (tb - ta) * 1000 : 0, T = travel();
    const landed = d.base + (ev.clientY - d.y0) + v / 1000 * 0.998 / (1 - 0.998) * 0.35;
    panel.classList.remove('dragging'); panel.style.transform = ''; setOpen(landed < T / 2); };
  panel.addEventListener('pointerup', end); panel.addEventListener('pointercancel', end);
  panel.addEventListener('focusin', ev => { if (NARROW.matches && !open() && ev.target !== grab && ev.target.getBoundingClientRect().bottom > innerHeight - 8) setOpen(true); });          // 键盘走到折叠在下面的按钮：自动展开
  addEventListener('keydown', ev => { if (ev.key === 'Escape' && NARROW.matches && open()) { setOpen(false); grab.focus(); } });
  NARROW.addEventListener('change', () => { panel.style.transform = ''; setOpen(false); });
}

// ———————————————————— 亮相：镜头从远处推近到人，停稳后面板从边上出来 ————————————————————
// 每次打开页面走一遍；点一下、按任意键或点「跳过」直接到位；系统开了「减弱动态效果」或地址带 ?intro=0 时不走镜头。
function ready() {
  document.body.classList.remove('is-intro'); document.body.classList.add('is-ready'); $('panel').inert = false; window.__app.intro = 'done';
  removeEventListener('pointerdown', skipIntro, true); removeEventListener('keydown', skipIntro, true);
}
let swallow = false;          // 用来跳过的那一下点击不再算作点按钮 / 点人物
addEventListener('click', e => { if (swallow) { swallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
function skipIntro(ev) {
  if (stageMode !== 'move' || window.__app.intro !== 'moving') return;
  if (ev && ev.type === 'keydown' && !['Escape', 'Enter', ' '].includes(ev.key)) return;
  if (ev && ev.type === 'pointerdown') { swallow = true; setTimeout(() => { swallow = false; }, 700); }
  window.__app.intro = 'skipping'; fly(() => P.end, 260, bezier(.23, 1, .32, 1), ready);
}
$('loading').classList.add('gone'); setTimeout(() => $('loading').remove(), 400); document.body.classList.remove('is-loading');
if (CALM.matches || Q.get('intro') === '0') { stageMode = 'end'; aim(P.end, true); ready(); }
else {
  window.__app.intro = 'moving'; document.body.classList.add('is-intro');
  addEventListener('pointerdown', skipIntro, true); addEventListener('keydown', skipIntro, true);
  fly(() => P.end, 2200, bezier(.3, .12, .12, 1), ready);
}
</script>
