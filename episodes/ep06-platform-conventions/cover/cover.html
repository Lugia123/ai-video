<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ep06 封面</title>
<style>
  html, body { margin: 0; background: #EFE7D6; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
/*
 * ep06 封面：大键帽 Ctrl+W 被按下，旁边的黑窗口「啪」地合上、被抽走；小人伸手去拦，头顶一个大「？」。
 *   ?ratio=4x3  → 1440×1080（横版）
 *   ?ratio=16x9 → 1920×1080（宽版：标题放大压在上方，下方主画面横向铺开）
 *   ?ratio=9x16 → 1080×1920（竖版：上标题、中间键帽 + 合上的窗口、下小人）
 * 导出：node tools/cover/cover.mjs episodes/ep06-platform-conventions
 * 页面画完后置 window.__coverReady = true。
 */
import { createKit, C, F, RAD, clamp, lerp, eo3, hash, mulberry32 } from '../../../assets/lib/paper-kit.js';
import { createBuddy } from '../../../assets/lib/paper-girl.js';   // 纸片女孩，统一 s = 2.0

const RATIO = new URLSearchParams(location.search).get('ratio') ?? '4x3';
const V = RATIO === '9x16', WIDE = RATIO === '16x9';
const W = V ? 1080 : WIDE ? 1920 : 1440, H = V ? 1920 : 1080;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const K = createKit(ctx, { W, H, bgSeed: 606, creases: V ? [[-10, 1180, 1090, 1230]] : WIDE ? [[-10, 610, 1930, 650]] : [[-10, 610, 1450, 650]] });
const { rr, paper, text, poly } = K;
const ZH = F.zh;

/* ---------- 版式 ---------- */
const L = V ? {
  title: [{ x: 540, y: 330, align: 'center', size: 100 }, { x: 540, y: 490, align: 'center', size: 118 }],
  key: { x: 300, y: 1320, s: 1.2 },
  win: { x: 700, y: 860, s: 1.05 },
  buddy: { x: 790, y: 1860, s: 2 },
  tape: { x: 30, y: 60, rot: -4 },
} : WIDE ? {
  title: [{ x: 80, y: 220, align: 'left', size: 132 }, { x: 86, y: 395, align: 'left', size: 132 }],
  key: { x: 330, y: 800, s: 1.05 },
  win: { x: 960, y: 730, s: 0.95 },
  buddy: { x: 1640, y: 1000, s: 2 },
  tape: { x: 1500, y: 44, rot: 5 },
} : {
  title: [{ x: 70, y: 210, align: 'left', size: 118 }, { x: 76, y: 370, align: 'left', size: 118 }],
  key: { x: 240, y: 820, s: 0.85 },
  win: { x: 700, y: 740, s: 0.8 },
  buddy: { x: 1210, y: 1010, s: 2 },
  tape: { x: 1060, y: 40, rot: 5 },
};

function keycap(x, y, label, s) {
  const w = 380, h = 240;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  paper(rr(-w / 2, -h / 2 + 14, w, h, 26, 21, 0.6), [-w / 2, -h / 2 + 14, w, h], { fill: '#BFB6A6', lift: 0.6, seed: 21, inkW: 2.6 });
  paper(rr(-w / 2 + 10, -h / 2 + 10, w - 20, h - 30, 20, 22, 0.6), [-w / 2 + 10, -h / 2 + 10, w - 20, h - 30], { fill: C.mustard, lift: 0.2, seed: 22, inkW: 2.4 });
  text(label, 0, -8, 96, { align: 'center', base: 'middle', font: F.ui, weight: 800 });
  ctx.strokeStyle = C.ink; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (const a of [-150, -120, -90, -60, -30]) { const r0 = 175, r1 = 215; ctx.beginPath(); ctx.moveTo(Math.cos(a * RAD) * r0 * 1.2, -40 + Math.sin(a * RAD) * r0 * 0.8); ctx.lineTo(Math.cos(a * RAD) * r1 * 1.2, -40 + Math.sin(a * RAD) * r1 * 0.8); ctx.stroke(); }
  ctx.restore();
}
/** 正在合上、被抽走的黑窗口：压扁 + 倾斜 + 速度线 */
function closingWin(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = 'rgba(30,27,24,0.45)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.moveTo(-330 - k * 20, -60 + k * 34); ctx.lineTo(-180 - k * 10, -90 + k * 34); ctx.stroke(); }
  ctx.rotate(-14 * RAD);
  ctx.save(); ctx.transform(1, 0, -0.35, 0.42, 0, 0);
  paper(rr(-260, -300, 520, 300, 18, 31), [-260, -300, 520, 300], { fill: '#2A2623', lift: 1.4, seed: 31 });
  ctx.restore();
  paper(rr(-260, 0, 520, 150, 18, 32), [-260, 0, 520, 150], { fill: '#2A2623', lift: 1.6, seed: 32 });
  ctx.font = `500 40px ${F.code}`; ctx.fillStyle = '#F3E9D2'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('$ echo hello', -220, 70);
  ctx.restore();
  text('啪！', x + 200 * s, y - 250 * s, 110 * s, { align: 'center', base: 'middle', font: ZH, weight: 800, color: C.red });
}

/* ---------- 主标题：纸剪字——白纸描边 + 投影 + 错位色版；数字用红/绿强调 ---------- */
const fontOf = (p, size) => p.num ? `800 ${size * 1.12}px ${F.big}` : `600 ${size}px ${ZH}`;
function paperType(parts, x, y, size, align) {
  const widths = parts.map(p => { ctx.font = fontOf(p, size); return ctx.measureText(p.s).width; });
  const total = widths.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const x0 = cx;
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  // 1. 整行白纸底（带投影），2. 错位色版，3. 墨色字
  for (const pass of [0, 1, 2]) {
    cx = x0;
    parts.forEach((p, i) => {
      ctx.font = fontOf(p, size);
      if (pass === 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(70,48,25,0.38)'; ctx.shadowBlur = 14; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 10;
        ctx.strokeStyle = C.card; ctx.lineWidth = size * 0.2; ctx.strokeText(p.s, cx, y);
        ctx.restore();
      } else if (pass === 1) {
        ctx.fillStyle = p.col && p.col !== C.mute ? C.ink : C.mustard;
        ctx.fillText(p.s, cx + size * 0.04, y + size * 0.04);
      } else {
        ctx.fillStyle = p.col ?? C.ink; ctx.fillText(p.s, cx, y);
      }
      cx += widths[i];
    });
  }
  ctx.restore();
  return { x0, x1: x0 + total };
}

/* ---------- 系列标签：斜贴的纸胶带 ---------- */
function tape(o) {
  const label = '移植不是翻译 · 06';
  ctx.font = `600 34px ${ZH}`;
  const w = ctx.measureText(label).width + 70, h = 64;
  ctx.save(); ctx.translate(o.x + w / 2, o.y + h / 2); ctx.rotate(o.rot * RAD);
  // 胶带两端锯齿
  const p = new Path2D(), r = mulberry32(77);
  p.moveTo(-w / 2, -h / 2);
  p.lineTo(w / 2, -h / 2);
  for (let k = 0; k <= 8; k++) p.lineTo(w / 2 + (k % 2 ? -7 : 0) + (r() - 0.5) * 3, -h / 2 + h * k / 8);
  p.lineTo(-w / 2, h / 2);
  for (let k = 8; k >= 0; k--) p.lineTo(-w / 2 + (k % 2 ? 7 : 0) + (r() - 0.5) * 3, -h / 2 + h * k / 8);
  p.closePath();
  paper(p, [-w / 2, -h / 2, w, h], { fill: 'rgba(240,180,60,0.88)', lift: 0.5, seed: 141, ink: false });
  text(label, 0, 2, 34, { align: 'center', base: 'middle', font: ZH, weight: 600 });
  ctx.restore();
}

/* ---------- 主标题 ---------- */
const TITLE = [
  [{ s: '按 ' }, { s: 'Ctrl+W', col: C.red, num: true }, { s: ' 删个词，' }],
  [{ s: '整个窗口', col: C.red }, { s: '没了？' }],
];

const buddy = createBuddy(ctx, {
  path: [[0, L.buddy.x, L.buddy.y, L.buddy.s]],
  acts: [{ type: 'question', t0: 0, t1: 99 }],   // 摊手疑问
});

await document.fonts.load(`600 150px ${ZH}`, '按删个词，整个窗口没了？移植不是翻译啪！');
await document.fonts.load(`800 120px ${F.big}`, 'Ctrl+W');
await document.fonts.load(`800 96px ${F.ui}`, 'Ctrl+W');
K.setTime(0);
K.drawBG();
tape(L.tape);
closingWin(L.win.x, L.win.y, L.win.s);
keycap(L.key.x, L.key.y, 'Ctrl+W', L.key.s);
buddy.draw(3.3);
TITLE.forEach((parts, i) => paperType(parts, L.title[i].x, L.title[i].y, L.title[i].size, L.title[i].align));
ctx.font = `600 ${L.title[1].size}px ${ZH}`;
const m = ctx.measureText('整个窗口没了');
window.__coverInfo = { W, H, titleInkH: Math.round(m.actualBoundingBoxAscent + m.actualBoundingBoxDescent), minH: Math.round(H * (V ? 0.06 : 0.09)) };
window.__coverReady = true;
</script>
</body>
</html>
