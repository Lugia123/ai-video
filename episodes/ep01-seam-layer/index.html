<script type="module">
/*
 * ep01《接缝选在哪一层》v2（v1 见 out/final-v1.mp4、script-v1.md）
 *
 *   - 全部 Canvas 2D，画面是 t 的纯函数。纸剪 UI 来自 assets/lib/paper-kit.js，讲解员来自 paper-girl.js（纸片女孩，原方块小人版见 out/final-boxbuddy.mp4），
 *     配乐来自 lofi.js（renderAudio 返回 WAV，渲染器与旁白混音）。
 *   - 时间轴全部由 narration/timings.json 推出（按句：每段带 sentences）。kw(段, '关键词') 先定位到句，
 *     再按句内字数比例估出关键词的时刻；落在「句末后 0.5s」之内的时刻一律推到句末 + 0.5s（hold）。
 *   - 镜头切点 cutAfter()：段后静音的中点，且离旁白说完 ≥ 0.5s。
 *   - 开头没有口号和片头：第 0 帧就是纸代码山（23,669）；系列名只在 s02 之后 1.5s 的无配音字卡上出现。
 *   - 再抓回来：s03 纸板被切开、s06 急拉远露出文件山、s08 拼图飞入、s09 万能插座亮起；s11 回扣开场构图。
 *   - 字幕按句切换，文字与 script.md 逐字一致（window.__debug.SUBS 可核对）。
 */
import { createKit, C, F, RAD, clamp, lerp, eo3, ei3, eio, eBack, hash, mulberry32, mix } from '../../assets/lib/paper-kit.js';
import { createBuddy as createGirl } from '../../assets/lib/paper-girl.js';
// 纸片女孩全片统一 s = 2.0（= girl-q/motion.mp4 里的大小，约占画高 45%；用户 2026-10-01 定）。
// 各镜头 path 里原来给方块小人写的 s 一律忽略，只用 x / y 站位；画在镜头缩放里的（s09–s10）用 keepS 自己按 GIRL_S / 缩放 给 s。
const GIRL_S = 2.0;
const BUDDIES = [];   // 自查用：window.__debug.buddies 里每个讲解员的 state(t)
const createBuddy = (c, o) => { const b = createGirl(c, { ...o, path: o.keepS ? o.path : o.path.map(([t, x, y]) => [t, x, y, GIRL_S]) }); BUDDIES.push(b); return b; };
import { renderLofi, encodeWav } from '../../assets/lib/lofi.js';

const W = 1920, H = 1080, FPS = 30;
const RENDER = new URLSearchParams(location.search).get('render') === '1';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const K = createKit(ctx);
const { prog, press, rr, circ, poly, paper, text, bigType, win, l2s, toast, drawCursor } = K;
let t = 0;

/* ---------- 时间轴（旁白驱动，按句） ---------- */
const TL = await (await fetch('narration/timings.json', { cache: 'no-store' })).json();
const SEG = Object.fromEntries(TL.segments.map(s => [s.id, s]));
const seg = id => SEG[id] ?? (() => { throw new Error(`timings.json 里没有段落 ${id}`); })();
// 每段的句子，带在段文本里的字符区间 [i0, i1)
for (const s of TL.segments) {
  let off = 0;
  s.sents = (s.sentences ?? [{ text: s.text, start: s.start, end: s.end }]).map(x => {
    const i0 = s.text.indexOf(x.text, off);
    if (i0 < 0) throw new Error(`${s.id} 的句子对不上段落文本：${x.text}`);
    off = i0 + x.text.length;
    return { ...x, i0, i1: off };
  });
}
const SENT_ENDS = TL.segments.flatMap(s => s.sents.map(x => x.end));

/** 每个"字"的朗读权重：汉字 1；全大写缩写按字母数；其它英文词按音节粗估；逗号顿一下，句中冒号停久一点 */
function units(str) {
  const out = [];
  for (const m of str.matchAll(/[A-Za-z]+|[0-9]+|./gsu)) {
    const s = m[0];
    let w = 0;
    if (/^[A-Z]+$/.test(s)) w = s.length;
    else if (/^[A-Za-z]+$/.test(s)) w = Math.ceil(s.length / 3);
    else if (/^[0-9]+$/.test(s)) w = s.length;
    else if (/[一-鿿]/.test(s)) w = 1;
    else if ('，、'.includes(s)) w = 0.8;
    else if ('。？！：；'.includes(s)) w = 1.4;
    out.push([s, w, m.index]);
  }
  // 句尾标点不占时长（音频首尾静音已裁掉）
  for (let k = out.length - 1; k >= 0 && !/[一-鿿A-Za-z0-9]/.test(out[k][0]); k--) out[k][1] = 0;
  return out;
}
/** 段内第 idx 个字符（UTF-16 下标）开始的时刻：先定位到句子，再在句内按字数比例插值 */
function timeAt(id, idx) {
  const s = seg(id);
  const x = s.sents.find(x => idx < x.i1) ?? s.sents[s.sents.length - 1];
  const rel = idx - x.i0;
  let before = 0, total = 0;
  for (const [, w, i] of units(x.text)) { if (i < rel) before += w; total += w; }
  return x.start + (x.end - x.start) * (total ? before / total : 0);
}
/** 一句说完后 0.5s 内画面不起新动作：落在 (句末, 句末+0.5) 的时刻推到句末+0.5 */
function hold(tt) {
  for (const e of SENT_ENDS) if (tt > e + 1e-3 && tt < e + 0.5) return e + 0.5;
  return tt;
}
/** 关键词开始说出的时刻；end=true 取说完的时刻 */
function kw(id, needle, end = false) {
  const i = seg(id).text.indexOf(needle);
  if (i < 0) throw new Error(`段落 ${id} 里没有「${needle}」`);
  return hold(timeAt(id, end ? i + needle.length : i));
}
/** 第 k 句（从 1 起）的起止 */
const sent = (id, k) => seg(id).sents[k - 1];
/** 段后的镜头切点：旁白说完至少停 0.5s，且不早于段间静音的中点 */
function cutAfter(id) {
  const i = TL.segments.findIndex(s => s.id === id), s = TL.segments[i], n = TL.segments[i + 1];
  return s.end + Math.max(0.5, n ? (n.start - s.end) / 2 : 0.5);
}

/* ---------- 字幕：按句切换，文字与旁白逐字一致；长句在最靠中间的逗号处断开 ---------- */
const SUB_FONT = `600 46px ${F.zh}`, SUB_Y = 1012, SUB_MAX_W = 1760, SUB_MAX_CH = 26;
function splitLong(p) {
  if (Array.from(p).length <= SUB_MAX_CH) return [p];
  const cuts = [...p.matchAll(/[，、：]/g)].map(m => m.index + 1).filter(c => c < p.length);
  if (!cuts.length) return [p];
  const mid = p.length / 2, c = cuts.reduce((a, b) => (Math.abs(b - mid) < Math.abs(a - mid) ? b : a));
  return [...splitLong(p.slice(0, c)), ...splitLong(p.slice(c))];
}
const SUBS = [];
for (const s of TL.segments) {
  s.sents.forEach((x, k) => {
    const chunks = splitLong(x.text);
    let idx = x.i0;
    const starts = chunks.map(c => { const tt = timeAt(s.id, idx); idx += c.length; return tt; });
    const next = s.sents[k + 1]?.start ?? TL.segments[TL.segments.indexOf(s) + 1]?.start ?? Infinity;
    chunks.forEach((c, i) => SUBS.push({ id: s.id, text: c, t0: starts[i], t1: i + 1 < chunks.length ? starts[i + 1] : Math.min(x.end + 0.3, next - 0.02) }));
  });
}

function drawSubtitle() {
  const s = SUBS.find(s => t >= s.t0 && t < s.t1);
  if (!s) return;
  const a = clamp((t - s.t0) / 0.12) * (1 - clamp((t - (s.t1 - 0.1)) / 0.1));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = SUB_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(245,239,226,0.92)'; ctx.lineWidth = 14; ctx.strokeText(s.text, 960, SUB_Y);
  ctx.fillStyle = C.ink; ctx.fillText(s.text, 960, SUB_Y);
  ctx.restore();
}

/* ---------- 共用小件 ---------- */
const ZH = F.zh;
function withCam(cx, cy, z, fn) { ctx.save(); ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
const w2s = (cam, x, y) => [(x - cam[0]) * cam[2] + 960, (y - cam[1]) * cam[2] + 540];
const s2w = (cam, x, y) => [(x - 960) / cam[2] + cam[0], (y - 540) / cam[2] + cam[1]];
/** 红色蜡笔线：从 a 画到 b，p 为进度 */
function crayonLine(x0, y0, x1, y1, p, w = 12, col = C.red) {
  if (p <= 0) return;
  const x = lerp(x0, x1, p), y = lerp(y0, y1, p);
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
  ctx.globalAlpha *= 0.45; ctx.lineWidth = w * 0.45; ctx.strokeStyle = '#FFF4E8';
  ctx.beginPath(); ctx.moveTo(x0 + 3, y0 - 3); ctx.lineTo(x + 3, y - 3); ctx.stroke();
  ctx.restore();
}
/** 手绘红圈（逐渐画出） */
function inkCircle(cx, cy, rx, ry, p, seed, col = C.red) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate((hash(seed, 1) * 6) * RAD);
  ctx.strokeStyle = col; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath();
  const a0 = -2.2 + hash(seed, 2) * 0.4, span = Math.PI * 2.15 * p;
  for (let i = 0; i <= 40; i++) {
    const a = a0 + span * i / 40, wob = 1 + 0.05 * Math.sin(a * 3 + seed);
    const x = Math.cos(a) * rx * wob, y = Math.sin(a) * ry * wob;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke(); ctx.restore();
}
/** 纸片插头（侧视）：右边缘 xr、中心高 cy；prong 从右边缘伸出 */
function plugShape(xr, cy, col, seed, o = {}) {
  const w = o.w ?? 210, h = o.h ?? 150, pl = o.pl ?? 84, gap = o.gap ?? 100;
  for (const dy of [-gap / 2, gap / 2]) {
    paper(rr(xr - 6, cy + dy - 11, pl + 6, 22, 5, seed + (dy > 0 ? 3 : 4), 0.4), [xr - 6, cy + dy - 11, pl + 6, 22], { fill: '#CFCBC3', lift: 0.3, seed: seed + 5, inkW: 2.4 });
  }
  paper(rr(xr - w, cy - h / 2, w, h, 26, seed), [xr - w, cy - h / 2, w, h], { fill: col, lift: 1.2, seed });
  // 握把上的三道防滑纹
  ctx.save(); ctx.strokeStyle = 'rgba(30,27,24,0.35)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(xr - w * 0.62 + i * 20, cy - h * 0.28); ctx.lineTo(xr - w * 0.62 + i * 20, cy + h * 0.28); ctx.stroke(); }
  ctx.restore();
}
/** 朝左的插头（插脚在左）：插脚尖端在 xTip */
function plugLeft(xTip, cy, col, seed, o = {}) {
  const pl = o.pl ?? 84, edge = xTip + pl;
  ctx.save(); ctx.translate(2 * edge, 0); ctx.scale(-1, 1);
  plugShape(edge, cy, col, seed, o);
  ctx.restore();
  return edge + (o.w ?? 210);   // 插头尾部（接线处）
}
function cord(x0, y0, x1, y1, bend = 120, col = C.ink) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.bezierCurveTo(x0 + bend, y0 + bend * 0.6, x1 - bend, y1 + bend * 0.2, x1, y1); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x0, y0 - 2); ctx.bezierCurveTo(x0 + bend, y0 + bend * 0.6 - 2, x1 - bend, y1 + bend * 0.2 - 2, x1, y1 - 2); ctx.stroke();
  ctx.restore();
}
function pill(x, y, label, col, seed, size = 30) {
  ctx.font = `600 ${size}px ${ZH}`;
  const w = ctx.measureText(label).width + size * 1.2, h = size * 1.6;
  paper(rr(x, y, w, h, h / 2, seed), [x, y, w, h], { fill: col, lift: 0.4, seed, inkW: 2.4 });
  text(label, x + w / 2, y + h / 2 + 1, size, { align: 'center', base: 'middle', font: ZH, weight: 600 });
  return w;
}
/** 代码行：简单着色 */
const CODE_KW = /^(const|pub|fn|void|typedef|union|struct|return|try|_)$/;
function codeLine(s, x, y, size, o = {}) {
  ctx.font = `500 ${size}px ${F.code}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const cw = ctx.measureText('m').width;
  const toks = s.match(/"[^"]*"?|\w+|\s+|[^\w\s]/g) || [];
  let cx = x;
  for (const tk of toks) {
    let col = o.color ?? C.ink;
    if (!o.plain) {
      if (tk[0] === '"') col = C.red;
      else if (CODE_KW.test(tk)) col = C.blue;
      else if (/^[{}()[\];=.,*!@]$/.test(tk)) col = C.mute;
    }
    ctx.fillStyle = col; ctx.fillText(tk, cx, y);
    cx += cw * tk.length;
  }
  return cw;
}

/* ================================================================
 * 分层纸板（s02 俯冲、s03 切开）
 * ================================================================ */
const LAYERS = [
  { name: '核心', sub: '终端逻辑（共享）', h: 84, col: '#C4DAEA', seed: 21 },
  { name: 'C API', h: 22, col: C.mustard, seed: 22 },
  { name: '界面层', sub: 'GTK · 只在 Linux 上', h: 84, col: C.pink, seed: 23 },
];
const SW = 620, SD = 400, SGAP = 72;
{
  let y = 0;
  for (const L of LAYERS) { L.y0 = y; L.y1 = y + L.h; y += L.h + SGAP; }
  const mid = (y - SGAP) / 2;
  for (const L of LAYERS) { L.y0 -= mid; L.y1 -= mid; }
}
function makeProj(cam) {
  const cyw = Math.cos(cam.yaw * RAD), syw = Math.sin(cam.yaw * RAD), cp = Math.cos(cam.pitch * RAD), sp = Math.sin(cam.pitch * RAD);
  const P = (x, y, z) => {
    const x1 = x * cyw - z * syw, z1 = x * syw + z * cyw;
    const k = cam.f / (cam.dist - (y * sp + z1 * cp));
    return [cam.cx + x1 * k, cam.cy - (y * cp - z1 * sp) * k];
  };
  P.eye = [cam.dist * cp * syw, cam.dist * sp, cam.dist * cp * cyw];
  return P;
}
function face(pts, col, seed, o = {}) {
  const path = poly(pts, seed, 0.7);
  ctx.fillStyle = col; ctx.fill(path);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x = Math.min(...xs), y = Math.min(...ys), w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  ctx.save(); ctx.clip(path); ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(K.GRAIN, (seed * 211) % 500, (seed * 97) % 200, Math.min(w + 4, 1990), Math.min(h + 4, 1190), x - 2, y - 2, Math.min(w + 4, 1990), Math.min(h + 4, 1190));
  ctx.restore();
  ctx.save(); ctx.translate(-1.4, -1); ctx.lineJoin = 'round'; ctx.strokeStyle = C.ink; ctx.lineWidth = o.inkW ?? 2.8; ctx.stroke(path); ctx.restore();
  return path;
}
/** 十六进制颜色插值（mix() 返回 rgb()，不能再嵌套） */
function mixHex(a, b, p) {
  const ch = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = ch(a), y = ch(b);
  return '#' + x.map((v, i) => Math.round(lerp(v, y[i], p)).toString(16).padStart(2, '0')).join('');
}
/** o.cols[i]：覆盖某层颜色；o.lift[i]：某层整体上移（世界单位）；o.hi：高亮哪一层 */
function drawStack(cam, o = {}) {
  const P = makeProj(cam), [ex, ey, ez] = P.eye;
  const hw = SW / 2, hd = SD / 2;
  const rect = (y, dx = 0, dz = 0, s = 1) => [[-hw * s + dx, y, -hd * s + dz], [hw * s + dx, y, -hd * s + dz], [hw * s + dx, y, hd * s + dz], [-hw * s + dx, y, hd * s + dz]];
  const Ls = LAYERS.map((L, i) => ({ ...L, y0: L.y0 + (o.lift?.[i] ?? 0), y1: L.y1 + (o.lift?.[i] ?? 0), col: o.cols?.[i] ?? L.col }));
  ctx.save(); ctx.fillStyle = 'rgba(70,48,25,0.13)';
  ctx.fill(poly(rect(Ls[0].y0, 36, 48, 1.02).map(p => P(...p)), 9, 1));
  ctx.fillStyle = 'rgba(70,48,25,0.08)';
  ctx.fill(poly(rect(Ls[0].y0, 52, 70, 1.06).map(p => P(...p)), 10, 1));
  ctx.restore();
  Ls.forEach((L, i) => {
    if (i === 2 && o.seam > 0) drawSeam(P, rect, (Ls[1].y1 + L.y0) / 2, o.seam);
    const sides = [
      { n: [0, 0, 1], pts: [[-hw, L.y1, hd], [hw, L.y1, hd], [hw, L.y0, hd], [-hw, L.y0, hd]], shade: 0.2 },
      { n: [0, 0, -1], pts: [[hw, L.y1, -hd], [-hw, L.y1, -hd], [-hw, L.y0, -hd], [hw, L.y0, -hd]], shade: 0.2 },
      { n: [1, 0, 0], pts: [[hw, L.y1, hd], [hw, L.y1, -hd], [hw, L.y0, -hd], [hw, L.y0, hd]], shade: 0.34 },
      { n: [-1, 0, 0], pts: [[-hw, L.y1, -hd], [-hw, L.y1, hd], [-hw, L.y0, hd], [-hw, L.y0, -hd]], shade: 0.34 },
    ];
    for (const f of sides) {
      const c = f.pts.reduce((a, p) => [a[0] + p[0] / 4, a[1] + p[1] / 4, a[2] + p[2] / 4], [0, 0, 0]);
      if (f.n[0] * (ex - c[0]) + f.n[1] * (ey - c[1]) + f.n[2] * (ez - c[2]) <= 0) continue;
      face(f.pts.map(p => P(...p)), mix(L.col, '#3A2A20', f.shade), L.seed + 30);
    }
    const topPts = rect(L.y1).map(p => P(...p));
    const top = face(topPts, i === o.hi ? mix(L.col, '#FFFFFF', 0.25) : L.col, L.seed);
    const [p0, p1, , p3] = topPts;
    ctx.save(); ctx.clip(top);
    ctx.transform((p1[0] - p0[0]) / SW, (p1[1] - p0[1]) / SW, (p3[0] - p0[0]) / SD, (p3[1] - p0[1]) / SD, p0[0], p0[1]);
    text(L.name, SW / 2, SD / 2 + (L.sub ? -18 : 0), 84, { align: 'center', base: 'middle', font: L.name === 'C API' ? F.ui : ZH, weight: 700 });
    if (L.sub) text(L.sub, SW / 2, SD / 2 + 58, 36, { align: 'center', base: 'middle', font: ZH, weight: 600, color: 'rgba(30,27,24,0.6)' });
    ctx.restore();
    const U = Ls[i + 1];
    if (U && U.y0 - L.y1 < SGAP * 1.3) {
      ctx.save(); ctx.clip(top);
      ctx.fillStyle = 'rgba(70,48,25,0.17)';
      ctx.fill(poly(rect(L.y1, 26, 34).map(p => P(...p)), 11 + i, 1));
      ctx.restore();
    }
  });
  return P;
}
/** 接缝：两层之间一圈发光的红虚线 */
function drawSeam(P, rect, y, a) {
  const pts = rect(y, 0, 0, 1.08).map(p => P(...p));
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(224,83,58,0.16)'; ctx.fill(poly(pts, 13, 0.5));
  ctx.setLineDash([22, 14]); ctx.lineDashOffset = -t * 40; ctx.strokeStyle = C.red; ctx.lineWidth = 5;
  ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p))); ctx.closePath(); ctx.stroke();
  ctx.restore();
}
function gapPoint(P, which) {
  const y = which === 'high' ? (LAYERS[1].y1 + LAYERS[2].y0) / 2 : (LAYERS[0].y1 + LAYERS[1].y0) / 2;
  return P(-SW / 2 + 30, y, SD / 2);
}

/* ================================================================
 * 时刻表（全部从 timings.json 推出）
 * ================================================================ */

      paper(rr(wx, wy, ww, wh, 20, 75), [wx, wy, ww, wh], { fill: C.pink, lift: 1.2 + 1.5 * (1 - lit), seed: 75 });
      text('Windows 版', wx + 40, wy + 96, 52, { font: ZH, weight: 600 });
      text('新做的插头', wx + 40, wy + 166, 34, { font: ZH, weight: 600, color: C.mute });
      ctx.restore();
      plugLeft(winTip, DG.winOut, C.pink, 76, PL);
    }
    // C API 插座条：「只往外留一个接口」时亮起并放大一下
    const [px, py, pw, ph] = DG.strip;
    const hiA = clamp((t - tApi) / 0.3) * (1 - clamp((t - T.pan0) / 0.4));
    const pop = 1 + 0.12 * Math.sin(Math.PI * clamp((t - tApi) / 0.4));
    ctx.save(); ctx.translate(px + pw / 2, py + ph / 2); ctx.scale(pop, pop); ctx.translate(-(px + pw / 2), -(py + ph / 2));
    if (hiA > 0) { ctx.save(); ctx.globalAlpha = 0.45 * hiA; ctx.fillStyle = '#FFE08A'; ctx.fill(rr(px - 26, py - 26, pw + 52, ph + 52, 30, 78)); ctx.restore(); }
    paper(rr(px, py, pw, ph, 16, 77), [px, py, pw, ph], { fill: hiA > 0 ? mix(C.mustard, '#FFE08A', hiA) : C.mustard, lift: 1.4, seed: 77 });
    for (const oy of [DG.macOut, DG.winOut]) for (const dy of [-35, 35]) { ctx.fillStyle = '#2A2623'; ctx.fillRect(px + pw - 14, oy + dy - 11, 16, 22); }
    ctx.restore();
    text('C API', px + pw / 2, py - 30, 44, { align: 'center', font: F.ui, weight: 700 });
    const sp = appear(tSock);
    if (sp > 0) { ctx.save(); ctx.translate(px + pw / 2, py + ph + 60); ctx.scale(sp, sp); ctx.translate(-(px + pw / 2), -(py + ph + 60)); pill(px + pw / 2 - 90, py + ph + 36, '万能插座', C.mustard, 79, 32); ctx.restore(); }
    K.clickMark(px + pw, DG.winOut, T.winIn);
    buddy9.draw(t);
  });
  bigType('怎么破局？', 180, 150, 96, kw('s09', '怎么破局'), { font: ZH, weight: 600, stagger: 0.05, out: tSock - 0.3 });
  bigType('大家都认的插座', 180, 150, 96, tSock, { font: ZH, weight: 600, stagger: 0.05, out: T.pan0 });
  const tEd = kw('s10', '插座这边'), tAdd = kw('s10', '只多了'), tTip = kw('s10', '窗口编号'), t20 = kw('s10', '大概二十行');
  if (t > tEd - 0.1) {
    const shift = eo3(clamp((t - tAdd) / 0.3));
    win({ ...EDITOR, t0: tEd }, (w) => {
      const lh = 64, y0 = 64, x0 = 60;
      ctx.font = `500 30px ${F.code}`;
      const cw = ctx.measureText('m').width;
      UNION_OLD.forEach((ln, i) => codeLine(ln, x0, y0 + (i + (i === 3 ? shift : 0)) * lh, 30));
      if (shift > 0) {
        const y = y0 + 3 * lh;
        ctx.save(); ctx.globalAlpha = shift;
        ctx.fillStyle = 'rgba(78,154,106,0.22)'; ctx.fillRect(20, y - 44, w - 40, 58);
        text('+', 32, y, 34, { font: F.code, weight: 700, color: C.green });
        codeLine(UNION_NEW, x0, y, 30);
        ctx.restore();
        const tp = eBack(clamp((t - tTip) / 0.25));
        if (tp > 0) {
          const bx = x0 + 16 * cw, by = y + 22;
          ctx.save(); ctx.translate(bx, by); ctx.scale(tp, tp);
          paper(rr(0, 0, 330, 64, 12, 82), [0, 0, 330, 64], { fill: C.mustard, lift: 1.2, seed: 82, inkW: 2.4 });
          text('hwnd ＝ 窗口编号', 22, 43, 32, { font: ZH, weight: 600 });
          ctx.restore();
        }
      }
    });
    const [lx, ly] = l2s(EDITOR, 60 + 20 * 18, 64 + 3 * 64 - 10);
    drawCursor([[tAdd - 0.5, 1300, 700], [tTip - 0.1, lx, ly], [t20 + 1, lx, ly]], [tTip - 0.05], clamp((t - tAdd + 0.5) / 0.3));
  }
  bigType('插座这边 ≈ 20 行', 120, 880, 72, t20, { font: ZH, weight: 600, stagger: 0.035 });
}

/* ---------- 镜头 11（s11）：回到开场构图，把插头插上 ---------- */
const buddy11 = createBuddy(ctx, {
  path: [[0, HK.bx, 880]],
  acts: [
    // 动作减量：「“二十行”」指回那张纸条
    { type: 'point', t0: T.back, t1: T.cut.s11, at: [HK.slipX, 760], hand: 'r' },
  ],
});
function shotBack() {
  const front = drawMount(t, true);
  front();
  buddy11.draw(t);
  drawCount(t, true);
  drawSlip(t, true);
  // 「二十行」时薄纸发光；「秘密」时插头从左边滑进 20 行上方的插座
  const g = clamp((t - T.back) / 0.3);
  if (g > 0) { ctx.save(); ctx.globalAlpha = 0.5 * g * (0.75 + 0.25 * Math.sin(t * 8)); ctx.fillStyle = '#FFE08A'; ctx.fill(rr(HK.slipX - 200, HK.base - 40, 400, 60, 20, 133)); ctx.restore(); }
  const sx = HK.slipX + 40, sy = 560;
  const pa = eo3(clamp((t - T.cut.s10) / 0.4));
  ctx.save(); ctx.globalAlpha = pa;
  const pIn = ei3(clamp((t - (T.click11 - 0.3)) / 0.3));
  const bounce = t > T.click11 ? Math.exp(-(t - T.click11) * 10) * Math.sin((t - T.click11) * 40) * 5 : 0;
  const xr = lerp(sx - 120, sx + 2, pIn) - bounce;
  ctx.save(); ctx.translate(xr, sy); ctx.scale(0.55, 0.55); ctx.translate(-xr, -sy);
  cord(xr - 520, sy + 300, xr - 205, sy + 25, 120);
  plugShape(xr, sy, C.pink, 134);
  ctx.restore();
  paper(rr(sx, sy - 110, 70, 220, 14, 135), [sx, sy - 110, 70, 220], { fill: C.mustard, lift: 1.2, seed: 135 });
  for (const dy of [-28, 28]) { ctx.fillStyle = '#2A2623'; ctx.fillRect(sx - 1, sy + dy - 8, 12, 16); }
  text('C API', sx + 35, sy - 130, 34, { align: 'center', font: F.ui, weight: 700 });
  ctx.restore();
  K.clickMark(sx, sy, T.click11);
  greenCheck(sx + 140, sy - 150, T.click11 + 0.1, 136, 32);
}

/* ---------- 镜头 12（s12）：原则 ---------- */
const RULE = { x: 120, y: 80, w: 1440, h: 480, seed: 95, rot: -0.3 };
const buddy12 = createBuddy(ctx, {
  path: [[0, 1740, 900]],
  acts: [
    // 动作减量：「规矩最少」指原则；「它到底在找谁帮忙」点赞收尾
    { type: 'talk', t0: kw('s12', '所以记住'), t1: kw('s12', '规矩最少') },              // 第二轮：说「所以记住」，直接换指
    { type: 'point', t0: kw('s12', '规矩最少'), t1: kw('s12', '它到底在') - 3.1, at: [1100, 400], hand: 'l' },   // 保持到离点赞 3 s 前
    { type: 'thumbs', t0: kw('s12', '它到底在'), t1: T.end0, hand: 'r' },
  ],
});
function shotRule() {
  const tA = kw('s12', '找接缝'), tB = kw('s12', '规矩最少'), tC = kw('s12', '别人已经走通'), tD = kw('s12', '先看一看');
  win({ ...RULE, t0: T.cut.s11 }, () => {
    pill(70, 56, '原则', C.mustard, 96, 32);
    bigType('找接缝，要选', 70, 250, 84, tA, { font: ZH, weight: 600, stagger: 0.04, shade: false });
    ctx.font = `600 84px ${ZH}`;
    const w1 = ctx.measureText('规矩最少').width, w2 = ctx.measureText('、').width, w3 = ctx.measureText('别人已经走通').width;
    bigType('规矩最少', 70, 390, 84, tB, { font: ZH, weight: 600, stagger: 0.04 });
    bigType('、', 70 + w1, 390, 84, tB + 0.2, { font: ZH, weight: 600, shade: false });
    bigType('别人已经走通', 70 + w1 + w2, 390, 84, tC, { font: ZH, weight: 600, stagger: 0.04 });
    bigType('的地方', 70 + w1 + w2 + w3, 390, 84, tC + 0.3, { font: ZH, weight: 600, stagger: 0.04, shade: false });
    crayonLine(70, 412, 70 + w1, 412, clamp((t - tB - 0.3) / 0.35), 9);
    crayonLine(70 + w1 + w2, 412, 70 + w1 + w2 + w3, 412, clamp((t - tC - 0.4) / 0.4), 9);
  });
  const tn = kw('s12', '下次给代码');
  if (t > tn) { ctx.save(); ctx.globalAlpha = clamp((t - tn) / 0.3); text('下次给代码搬家前', 156, 690, 40, { font: ZH, weight: 600, color: C.mute }); ctx.restore(); }
  bigType('先看它在找谁帮忙', 150, 790, 90, tD, { font: ZH, weight: 600, stagger: 0.04 });
  buddy12.draw(t);
}

/* ---------- 结尾字卡（1.5s，干脆结束） ---------- */
function shotEnd() {
  const p = eo3(clamp((t - T.end0) / 0.2));
  ctx.save(); ctx.globalAlpha = p;
  pill(960 - 70, 380, '下一集', C.mustard, 99, 34);
  text('先打掉最大的未知数', 960, 560, 72, { align: 'center', base: 'middle', font: ZH, weight: 600 });
  ctx.restore();
}

/* ---------- 镜头表：切点在段间静音里，且离上一句说完 ≥ 0.5s ---------- */
const SHOTS = [
  { id: 'hook', t0: 0, draw: shotHook },
  { id: 'stack', t0: T.cut.s01, draw: shotStack },
  { id: 'card', t0: T.card0, draw: shotCard },
  { id: 'split', t0: T.card1, draw: shotSplit },
  { id: 'plug', t0: T.cut.s03, draw: shotPlug },
  { id: 'twin', t0: T.cut.s04, draw: shotTwin },
  { id: 'term', t0: T.cut.s05, draw: shotTerm },
  { id: 'calls', t0: T.cut.s06, draw: shotCalls },
  { id: 'plans', t0: T.cut.s07, draw: shotPlans },
  { id: 'diagram', t0: T.cut.s08, draw: shotDiagram },
  { id: 'back', t0: T.cut.s10, draw: shotBack },
  { id: 'rule', t0: T.cut.s11, draw: shotRule },
  { id: 'end', t0: T.end0, draw: shotEnd },
];
SHOTS.forEach((s, i) => { s.t1 = SHOTS[i + 1]?.t0 ?? Infinity; });

// 交互音效（和画面同一张时刻表）
const SFX = [
  { t: T.collapse, kind: 'whoosh' }, { t: T.collapse + 0.45, kind: 'boing' }, { t: T.pop, kind: 'pop' }, { t: T.slipLand, kind: 'ding' },
  { t: T.knife0, kind: 'snip' }, { t: T.orbit0 + 0.3 * (T.orbit1 - T.orbit0), kind: 'snip' }, { t: T.orbit0 + 0.9 * (T.orbit1 - T.orbit0), kind: 'snip' },
  { t: T.card0, kind: 'whoosh' },
  { t: T.split, kind: 'snip' }, { t: T.seam, kind: 'pop' },
  { t: T.plugIn, kind: 'click' },
  { t: kw('s05', '“找谁帮忙”') - 0.15, kind: 'click' }, { t: kw('s05', '“找谁帮忙”') + 0.55, kind: 'click' },
  { t: T.crash0, kind: 'whoosh' }, { t: T.num, kind: 'boing' },
  { t: T.tools + 0.2, kind: 'whoosh' }, { t: kw('s07', '有些在'), kind: 'pop' },
  { t: T.puzzle, kind: 'whoosh' }, { t: T.x1, kind: 'snip' }, { t: T.x2 + 0.2, kind: 'pop' },
  { t: kw('s09', '只往外留'), kind: 'ding' },
  { t: T.pan0 + 0.2, kind: 'whoosh' }, { t: T.winIn, kind: 'click' }, { t: kw('s10', '窗口编号') - 0.05, kind: 'click' },
  { t: kw('s10', '大概二十行'), kind: 'ding' },
  { t: T.click11, kind: 'click' },
  { t: kw('s12', '先看一看') + 0.3, kind: 'ding' },
];

/* ---------- seek：t 的纯函数 ---------- */
function render(tt) {
  t = Math.max(0, Math.min(TL.duration, tt));
  K.setTime(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  K.drawBG();
  const shot = SHOTS.find(s => t >= s.t0 && t < s.t1) ?? SHOTS[SHOTS.length - 1];
  const since = t - shot.t0;
  const z = shot.t0 > 0 ? 1 + 0.015 * Math.exp(-since * 12) : 1;
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  shot.draw();
  ctx.restore();
  drawSubtitle();
}

/* ---------- 配乐 ---------- */
let musicBuf = null;
const music = async () => (musicBuf ??= await renderLofi({
  duration: TL.duration,
  speech: TL.segments.map(s => [s.start, s.end]),
  speechDb: TL.speech_mean_db ?? -21,
  bright: [[0, 3.0], [T.card0, T.card1], [T.end0, TL.duration]],
  sfx: SFX,
}));
/* ---------- 预览：空格播放（旁白 + 配乐），← → 跳 2 秒 ---------- */
function startPreview() {
  const hud = document.getElementById('hud'); hud.hidden = false;
  let actx = null, narr = null, srcs = [], playing = false, tt = 0, t0 = 0;
  const stop = () => { srcs.forEach(s => s.stop()); srcs = []; playing = false; };
  const play = async () => {
    actx ??= new AudioContext();
    narr ??= await actx.decodeAudioData(await (await fetch('narration/narration.mp3')).arrayBuffer());
    const mb = await music();
    if (tt >= TL.duration) tt = 0;
    srcs = [narr, mb].map(b => { const s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0, tt); return s; });
    t0 = actx.currentTime - tt; playing = true;
  };
  const toggle = () => (playing ? (tt = actx.currentTime - t0, stop()) : play());
  const jump = d => { const was = playing; if (playing) { tt = actx.currentTime - t0; stop(); } tt = clamp(tt + d, 0, TL.duration); if (was) play(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowLeft') jump(-2);
    if (e.code === 'ArrowRight') jump(2);
  });
  document.getElementById('hud-bar').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    jump((e.clientX - r.left) / r.width * TL.duration - (playing ? actx.currentTime - t0 : tt));
  });
  (function loop() {
    if (playing) { tt = actx.currentTime - t0; if (tt >= TL.duration) { tt = TL.duration; stop(); } }
    render(tt);
    document.getElementById('hud-play').textContent = playing ? '❚❚' : '▶ 空格播放';
    document.getElementById('hud-time').textContent = `${tt.toFixed(2)} / ${TL.duration.toFixed(2)}s`;
    hud.querySelector('.bar i').style.width = `${tt / TL.duration * 100}%`;
    requestAnimationFrame(loop);
  })();
}

await document.fonts.load(`600 46px ${F.zh}`, '接缝选在哪一层');
await document.fonts.load(`800 100px ${F.big}`);
await document.fonts.load(`600 30px ${F.ui}`);
await document.fonts.load(`500 30px ${F.code}`);
ctx.font = SUB_FONT;
for (const s of SUBS) s.width = Math.round(ctx.measureText(s.text).width);
render(0);
window.__debug = { buddies: BUDDIES, SUBS, SHOTS: SHOTS.map(s => ({ id: s.id, t0: s.t0, t1: s.t1 })), T, SUB_MAX_W, kw, SEGS: TL.segments.map(s => ({ id: s.id, start: s.start, end: s.end })) };
window.__video = {
  width: W, height: H, fps: FPS, duration: TL.duration,
  seek: render,
  renderAudio: async () => encodeWav(await music()),
};
if (!RENDER) startPreview();
