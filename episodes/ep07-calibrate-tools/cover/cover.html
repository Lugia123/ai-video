<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ep07 封面</title>
<style>
  html, body { margin: 0; background: #EFE7D6; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
/*
 * ep07 封面：兑现开场画面——搭到一半的纸架子轰然塌掉（红色「？」块碎开），方块小人在废墟边举着「先试这个」。
 *   ?ratio=4x3  → 1440×1080（横版）
 *   ?ratio=16x9 → 1920×1080（宽版：左标题、右主画面）
 *   ?ratio=9x16 → 1080×1920（竖版：上标题、中间塌架子、下小人）
 * 导出：node tools/cover/cover.mjs episodes/ep02-spike-first
 * 页面画完后置 window.__coverReady = true。
 */
import { createKit, C, F, RAD, clamp, lerp, eo3, eBack, hash, mulberry32 } from '../../../assets/lib/paper-kit.js';
import { createBuddy } from '../../../assets/lib/paper-girl.js';   // 纸片女孩 s=2.0（原方块小人版封面见 _boxbuddy/）

const RATIO = new URLSearchParams(location.search).get('ratio') ?? '4x3';
const V = RATIO === '9x16', WIDE = RATIO === '16x9';
const W = V ? 1080 : WIDE ? 1920 : 1440, H = V ? 1920 : 1080;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const K = createKit(ctx, { W, H, bgSeed: 707, creases: V ? [[-10, 1180, 1090, 1230]] : WIDE ? [[-10, 610, 1930, 650]] : [[-10, 610, 1450, 650]] });
const { rr, circ, paper, text, poly } = K;
const ZH = F.zh;

/* ---------- 主标题：纸剪字——白纸描边 + 投影 + 错位色版；数字用红/绿强调 ---------- */
const fontOf = (p, size) => p.num ? `800 ${size * 1.12}px ${F.big}` : `600 ${size}px ${ZH}`;
function paperType(parts, x, y, size, align) {
  const widths = parts.map(p => { ctx.font = fontOf(p, size); return ctx.measureText(p.s).width; });
  const total = widths.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const x0 = cx;
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  // 1. 整行白纸底（带投影），2. 错位色版，3. 墨色字
  for (const pass of [0, 1, 2]) {
    cx = x0;
    parts.forEach((p, i) => {
      ctx.font = fontOf(p, size);
      if (pass === 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(70,48,25,0.38)'; ctx.shadowBlur = 14; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 10;
        ctx.strokeStyle = C.card; ctx.lineWidth = size * 0.2; ctx.strokeText(p.s, cx, y);
        ctx.restore();
      } else if (pass === 1) {
        ctx.fillStyle = p.col && p.col !== C.mute ? C.ink : C.mustard;
        ctx.fillText(p.s, cx + size * 0.04, y + size * 0.04);
      } else {
        ctx.fillStyle = p.col ?? C.ink; ctx.fillText(p.s, cx, y);
      }
      cx += widths[i];
    });
  }
  ctx.restore();
  return { x0, x1: x0 + total };
}

/* ---------- 系列标签：斜贴的纸胶带 ---------- */
function tape(o) {
  const label = '移植不是翻译 · 07';
  ctx.font = `600 34px ${ZH}`;
  const w = ctx.measureText(label).width + 70, h = 64;
  ctx.save(); ctx.translate(o.x + w / 2, o.y + h / 2); ctx.rotate(o.rot * RAD);
  // 胶带两端锯齿
  const p = new Path2D(), r = mulberry32(77);
  p.moveTo(-w / 2, -h / 2);
  p.lineTo(w / 2, -h / 2);
  for (let k = 0; k <= 8; k++) p.lineTo(w / 2 + (k % 2 ? -7 : 0) + (r() - 0.5) * 3, -h / 2 + h * k / 8);
  p.lineTo(-w / 2, h / 2);
  for (let k = 8; k >= 0; k--) p.lineTo(-w / 2 + (k % 2 ? 7 : 0) + (r() - 0.5) * 3, -h / 2 + h * k / 8);
  p.closePath();
  paper(p, [-w / 2, -h / 2, w, h], { fill: 'rgba(240,180,60,0.88)', lift: 0.5, seed: 141, ink: false });
  text(label, 0, 2, 34, { align: 'center', base: 'middle', font: ZH, weight: 600 });
  ctx.restore();
}

/* ---------- 版式 ---------- */
const L = V ? {
  title: [{ x: 540, y: 330, align: 'center', size: 150 }, { x: 540, y: 500, align: 'center', size: 124 }, { x: 540, y: 640, align: 'center', size: 88 }],
  gauge: { x: 540, y: 1180, r: 240 }, timer: { x: 540, y: 820, s: 1.1 },
  buddy: { x: 830, y: 1860, s: 2.0 },
  tape: { x: 30, y: 60, rot: -4 },
} : WIDE ? {
  title: [{ x: 90, y: 240, align: 'left', size: 156 }, { x: 96, y: 420, align: 'left', size: 124 }, { x: 100, y: 560, align: 'left', size: 88 }],
  gauge: { x: 1440, y: 600, r: 230 }, timer: { x: 370, y: 770, s: 1.0 },
  buddy: { x: 980, y: 1040, s: 2.0 },
  tape: { x: 1490, y: 40, rot: 5 },
} : {
  title: [{ x: 70, y: 210, align: 'left', size: 150 }, { x: 76, y: 370, align: 'left', size: 118 }, { x: 80, y: 500, align: 'left', size: 84 }],
  gauge: { x: 1090, y: 640, r: 200 }, timer: { x: 270, y: 700, s: 0.8 },
  buddy: { x: 640, y: 1040, s: 2.0 },
  tape: { x: 1060, y: 40, rot: 5 },
};
const ZH2 = ZH, note = null;
function withLift(fn) { fn(); }
function gauge(cx, cy, r, o = {}) {
  const seed = o.seed ?? 401;
  paper(rr(cx - r * 1.2, cy - r * 1.2, r * 2.4, r * 2.4, 26, seed), [cx - r * 1.2, cy - r * 1.2, r * 2.4, r * 2.4], { fill: '#D8D4CC', lift: 1.2, seed });
  ctx.fillStyle = '#4A433C'; ctx.fillRect(cx - r * 0.4, cy - r * 1.2 + 10, r * 0.8, 12);          // 顶上的投样口
  paper(circ(cx, cy, r, seed + 1), [cx - r, cy - r, r * 2, r * 2], { fill: C.card, lift: 0.3, seed: seed + 1, inkW: 2.6 });
  const a0 = Math.PI * 1.08, a1 = Math.PI * 1.92;
  ctx.save(); ctx.lineWidth = r * 0.15; ctx.lineCap = 'butt';
  for (const [u0, u1, col] of [[0, 0.55, C.green], [0.55, 0.76, C.mustard], [0.76, 1, C.red]]) {
    ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r * 0.76, lerp(a0, a1, u0), lerp(a0, a1, u1)); ctx.stroke();
  }
  ctx.restore();
  if (o.broken) {
    ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath(); [[-0.42, -0.36], [-0.12, -0.08], [-0.2, 0.1], [0.1, 0.34], [0.05, 0.46]].forEach(([x, y], k) => (k ? ctx.lineTo(cx + x * r, cy + y * r) : ctx.moveTo(cx + x * r, cy + y * r))); ctx.stroke();
    ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.strokeStyle = C.ink;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * 0.1, cy - r * 0.2); ctx.stroke();            // 断掉的指针根
    ctx.beginPath(); ctx.moveTo(cx - r * 0.3, cy + r * 0.3); ctx.lineTo(cx + r * 0.12, cy + r * 0.38); ctx.stroke();   // 掉下来的半截
    ctx.restore();
  } else {
    const a = lerp(a0, a1, o.v ?? 0.2);
    ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r * 0.7, cy + Math.sin(a) * r * 0.7); ctx.stroke(); ctx.restore();
  }
  paper(circ(cx, cy, r * 0.08, seed + 2), [cx - 12, cy - 12, 24, 24], { fill: C.ink, lift: 0, seed: seed + 2, inkW: 1 });
  paper(circ(cx, cy + r * 0.62, r * 0.13, seed + 3), [cx - r * 0.13, cy + r * 0.49, r * 0.26, r * 0.26], { fill: o.lamp ?? '#BDB5A6', lift: 0.2, seed: seed + 3, inkW: 2.2 });
  const sp = o.sticker ?? -1;
  if (sp >= 0 && sp < 1) {
    ctx.save(); ctx.translate(cx + sp * r * 1.1, cy - r * 0.05 - sp * r * 0.9); ctx.rotate(sp * 32 * RAD); ctx.globalAlpha *= 1 - clamp((sp - 0.7) / 0.3);
    const pop = o.pop == null ? 1 : eBack(clamp(o.pop));
    if (o.pop != null && o.pop <= 0) {
      paper(circ(0, 0, r * 0.52, seed + 4), [-r * 0.52, -r * 0.52, r * 1.04, r * 1.04], { fill: C.sand, lift: 0.6, seed: seed + 4, inkW: 2.6 });
      ctx.restore(); return;
    }
    ctx.scale(lerp(1.35, 1, pop), lerp(1.35, 1, pop));
    paper(circ(0, 0, r * 0.52, seed + 4), [-r * 0.52, -r * 0.52, r * 1.04, r * 1.04], { fill: C.green, lift: 0.6 + sp * 2, seed: seed + 4, inkW: 2.6 });
    ctx.strokeStyle = C.card; ctx.lineWidth = r * 0.1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-r * 0.22, 0); ctx.lineTo(-r * 0.05, r * 0.18); ctx.lineTo(r * 0.25, -r * 0.18); ctx.stroke();
    ctx.restore();
  }
}
function timerTag(x, y, sec, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(-2 * RAD);
  paper(rr(-230, -60, 460, 120, 14, 211), [-230, -60, 460, 120], { fill: C.mustard, lift: 1.2, seed: 211 });
  text('挡住', -150, 4, 46, { align: 'center', base: 'middle', font: ZH, weight: 700 });
  text(String(sec), 34, 4, 96, { align: 'center', base: 'middle', font: F.big, weight: 800 });
  text('秒', 172, 4, 46, { align: 'center', base: 'middle', font: ZH, weight: 700 });
  ctx.restore();
}

const TITLE = [
  [{ s: '卡死' }, { s: '两分半', col: C.red }, { s: '，' }],
  [{ s: '工具说' }, { s: '没事', col: C.green }, { s: '？' }],
  [{ s: '先让它' }, { s: '红一次', col: C.red }],
];
const buddy = createBuddy(ctx, {
  path: [[0, L.buddy.x, L.buddy.y, L.buddy.s]],
  acts: [{ type: 'point', t0: 0, t1: 99, at: [L.gauge.x, L.gauge.y - L.gauge.r * 0.3], hand: V ? 'l' : 'r' }],
});

await document.fonts.load(`600 150px ${ZH}`, '卡死两分半，工具说没事？先让它红一次移植不是翻译挡住秒');
K.setTime(0);
K.drawBG();
tape(L.tape);
ctx.save(); ctx.translate(L.timer.x, L.timer.y); ctx.scale(L.timer.s, L.timer.s); timerTag(0, 0, 152); ctx.restore();
gauge(L.gauge.x, L.gauge.y, L.gauge.r, { broken: true, sticker: 0.42 });
buddy.draw(3.3);
TITLE.forEach((parts, i) => paperType(parts, L.title[i].x, L.title[i].y, L.title[i].size, L.title[i].align));
ctx.font = `600 ${L.title[0].size}px ${ZH}`;
const m = ctx.measureText('卡死两分半');
window.__coverInfo = { W, H, titleInkH: Math.round(m.actualBoundingBoxAscent + m.actualBoundingBoxDescent), minH: Math.round(H * (V ? 0.06 : 0.09)) };
window.__coverReady = true;
</script>
</body>
</html>
