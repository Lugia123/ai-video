<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>doom-scale.js：P(DOOM) 秤（读数爬升 → 顶住限位销 → 断销越界 → 裂开 → ERR → 熄灭）</title>
<script type="importmap">{ "imports": { "three": "../../../../assets/vendor/three/three.module.min.js" } }</script>
</head>
<body style="margin:0;background:#000">
<!-- 渲染：node tools/render/render.mjs episodes/mv-pdoom/kits/_gallery --page doom-scale.html --preview --step 0.5 -->
<script type="module">
import * as THREE from 'three';
import { loadMV } from '../../engine/index.js';
import { createDoomScale } from '../doom-scale.js';

const mv = await loadMV({ width: 960, height: 540 });
const scale = await createDoomScale();
const scene = new THREE.Scene(); scene.background = new THREE.Color('#06060b');
scene.add(new THREE.HemisphereLight('#bfc6ff', '#120c1c', 1.0));
const key = new THREE.DirectionalLight('#ffffff', 2); key.position.set(4, 10, 8); scene.add(key);
scene.add(scale.group);
const cam = new THREE.PerspectiveCamera(42, 16 / 9, 0.1, 500);
const T0 = 94.78, DUR = 8;
function draw(T) {
  const k = T - T0;
  const value = k < 1 ? 0.6 + 0.39 * k : k < 3 ? 0.99 + (k - 1) * 0.07 : 1.13;
  const cracked = Math.min(1, Math.max(0, (k - 2) / 1.5));
  const err = k > 3.6, lit = k < 6 ? 1 : Math.max(0, 1 - (k - 6) / 1.5);
  scale.update(T, { value, cracked, err, lit, pile: Math.min(1, k / 3), glow: 0 });
  const a = 0.3 + k * 0.05;
  cam.position.set(Math.sin(a) * 30, 8, Math.cos(a) * 30); cam.lookAt(0, scale.dims.dialY - 3, 0);
  mv.stage.render(scene, cam, { bloom: { strength: 0.7, threshold: 1.0 } });
}
mv.mount(draw, { offset: T0, duration: DUR });
</script>
</body>
</html>
