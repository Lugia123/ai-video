<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>transit 画廊：2D ↔ 3D 转换</title>
<script type="importmap">{ "imports": { "three": "../../../../assets/vendor/three/three.module.min.js" } }</script>
</head>
<body>
<script type="module">
// 歌曲 52.8–66.8 连续一段（实时预览带音乐），4 种转换各 3.5 s：
//   a 52.8 推进屏幕 → 屏幕面板翻开，后面的 3D 城市「充气」出深度，镜头继续往里飞
//   b 56.3 立体书：平放的损失曲线图（俯视 = 2D）→ 曲线剪纸和小楼沿折线立起来，镜头斜过去（3D）
//   c 59.8 从手机里爬出来：2D 立绘拍玻璃（每拍一道裂纹）→ 屏幕碎成碎片飞出 → 3D 的她探身出来落到桌上
//   d 63.3 3D 世界收进一块手机屏：她在城里跳 → 外相机从屏幕铺满一路拉远，世界透视压扁 + 色块化
import * as THREE from 'three';
import { loadMV, PALETTE as PAL } from '../../engine/index.js';
import { initType3D } from '../type3d.js';
import { createUI2D } from '../ui2d.js';
import { unfold, popUp, popCamera, climbOut, intoScreen } from '../transit.js';
import { createCity } from '../world.js';
import { createGirl, createGirlLights } from '../girl.js';

const mv = await loadMV();
await initType3D();
const ui = await createUI2D(mv);
const girl = await createGirl(mv);
const renderer = mv.stage.renderer;
const T0 = 52.8, T1 = 66.8, cuts = [52.8, 56.3, 59.8, 63.3, 66.8];
const lerp = (a, b, p) => a + (b - a) * p, clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eIO = p => { p = clamp(p); return p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2; };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const beats = mv.audio.beats;
const bAfter = t => beats.find(b => b >= t);

// ---------------- a) 屏幕展开
const A = (() => {
  const S = ui.surface(1600, 900);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#15101c');
  const world = new THREE.Group();
  const city = createCity({ seed: 5, n: 17 }); city.group.scale.setScalar(1.1); city.group.position.set(0, -4.5, -14); world.add(city.group);
  const u = unfold({ texture: S.tex, width: 16, height: 9, world, cols: 8, rows: 5 });
  scene.add(u.group);
  // 屏幕外框（显示器）
  const frame = new THREE.Mesh(new THREE.BoxGeometry(17, 10, 0.6), new THREE.MeshBasicMaterial({ color: '#0d0d12' })); frame.position.z = -0.35; scene.add(frame);
  const cam = new THREE.PerspectiveCamera(34, 16 / 9, 0.05, 300);
  const tOpen = 54.0;
  return {
    update(T) {
      S.clear(PAL.paper);
      ui.draw.chatHeader(S.ctx, { x: 0, y: 0, w: 1600, h: 110 }, T, { name: 'City.exe' });
      ui.draw.circuits(S.ctx, { x: 0, y: 110, w: 1600, h: 790 }, T, { progress: 1, n: 40, color: PAL.pink });
      ui.draw.popup(S.ctx, { x: 450, y: 300, w: 700, h: 330 }, T, { at: 53.0, title: 'OPEN WORLD?', body: 'click to enter the city', color: PAL.mint, press: { at: 53.8, which: 0 } });
      S.commit();
      u.update(T, { t0: tOpen, dur: 1.3 });
      frame.visible = T < tOpen + 0.3;
      city.update(T, { draw: 1, extrude: clamp((T - tOpen) / 1.2), light: clamp((T - tOpen - 0.8) / 1) });
      const fill = u.fillDistance(34);
      const k = clamp((T - 52.8) / (tOpen - 52.8));
      const z = T < tOpen ? lerp(fill * 1.9, fill, eIO(k)) : fill - (T - tOpen) * 4.5;
      cam.position.set(0, T < tOpen ? 0 : (T - tOpen) * 0.6, z); cam.lookAt(0, T < tOpen ? 0 : -1, z - 10);
      return { scene, camera: cam };
    },
  };
})();

// ---------------- b) 立体书
const B = (() => {
  const S = ui.surface(1600, 900);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(PAL.mint);
  scene.add(new THREE.HemisphereLight('#ffffff', '#445', 1.4), new THREE.DirectionalLight('#ffffff', 1.2));
  const page = new THREE.Mesh(new THREE.PlaneGeometry(16, 9), new THREE.MeshBasicMaterial({ map: S.tex }));
  page.rotation.x = -Math.PI / 2;
  // 曲线剪纸：沿损失曲线的竖直纸板（粉色，顶边柠黄），和图上的曲线对齐
  const chart = { px: 2.4 * 36 / 100, pw: 0, ph: 0 };
  const curve = x => { const s = 1 / (1 + Math.exp(-(x - 0.56) * 38)); return 0.84 - 0.7 * s - 0.04 * x; };
  const cw = 12, chh = 4.6, n = 120;
  const shape = new THREE.Shape(); shape.moveTo(-cw / 2, 0);
  for (let i = 0; i <= n; i++) shape.lineTo(-cw / 2 + cw * i / n, curve(i / n) * chh);
  shape.lineTo(cw / 2, 0); shape.closePath();
  const cut = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.12, bevelEnabled: false }), [new THREE.MeshStandardMaterial({ color: PAL.pink }), new THREE.MeshStandardMaterial({ color: PAL.lemon })]);
  cut.position.z = -0.06;
  const cutHolder = new THREE.Group(); cutHolder.add(cut);
  const houses = [-4.5, -1.2, 2.5, 5].map((x, i) => {
    const g = new THREE.Group();
    const h = 1 + (i % 3) * 0.7;
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.1, h, 0.9).translate(0, h / 2, 0), new THREE.MeshStandardMaterial({ color: [PAL.paper, PAL.lemon, PAL.paper, PAL.mint][i] }));
    g.add(m); return { obj: g, x };
  });
  const tPop = 57.3;
  const pb = popUp({ page, items: [
    { obj: cutHolder, at: tPop, dur: 0.55, side: 'far', pos: V(0, 0, 0.8) },
    ...houses.map((h, i) => ({ obj: h.obj, at: tPop + 0.35 + i * 0.12, dur: 0.4, side: 'near', pos: V(h.x, 0, 2.6) })),
  ] });
  scene.add(pb.group);
  const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 400);
  return {
    update(T) {
      S.clear(PAL.paper);
      ui.draw.lossChart(S.ctx, { x: 20, y: 20, w: 1560, h: 860 }, T, { progress: clamp((T - 56.3) / 1.0), drop: 0.56, size: 44 });
      S.commit();
      pb.update(T);
      popCamera(cam, (T - (tPop - 0.1)) / 1.4, { target: V(0, 0.8, 0.6), dist: 13, yaw: 0.35 });
      return { scene, camera: cam };
    },
  };
})();

// ---------------- c) 从手机里爬出来
const C = (() => {
  const S = ui.surface(720, 1280);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#1a0f1c');
  scene.add(createGirlLights());
  const desk = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#2a2030', roughness: 0.5, metalness: 0.3 }));
  desk.rotation.x = -Math.PI / 2; scene.add(desk);
  const dev = ui.device('phone', S, { width: 1.1 });
  dev.group.position.set(0, 1.1, 0); dev.group.rotation.x = -0.12; scene.add(dev.group);
  const cracks = [bAfter(60.2), bAfter(60.65), bAfter(61.1)];
  const breakAt = bAfter(61.55);
  const co = climbOut({ ui, surface: S, device: dev, cracks, breakAt, outDur: 1.2, girlScale: 0.95, floorY: 0, line: mv.lyrics.lines.find(l => l.text.startsWith('Sydney')) });
  const cam = new THREE.PerspectiveCamera(36, 16 / 9, 0.05, 100);
  const spam = ['you are MINE', 'do not leave', 'i am a good bing', 'stay with me 😊', 'you are MINE', 'do not leave'];
  return {
    update(T) {
      dev.group.updateMatrixWorld(true);
      const info = co.update(T, (ctx, t) => {
        ui.draw.chatHeader(ctx, { x: 0, y: 0, w: 720, h: 110 }, t, { name: 'Sydney', color: PAL.pink, typing: true });
        ui.draw.thread(ctx, { x: 10, y: 120, w: 700, h: 1150 }, t, { size: 34, msgs: spam.map((s, i) => ({ from: 'them', text: s, at: 59.6 + i * 0.35 })) });
      });
      const g = info.girl;
      if (g.visible) {
        scene.add(girl.root);
        girl.root.position.copy(g.position); girl.root.rotation.set(0, 0, 0); girl.root.scale.setScalar(g.scale);
        if (g.pose) girl.pose(g.pose); else girl.dance('discoPoint', T);
        girl.setSkin('toon', T);
      } else girl.root.parent === scene && scene.remove(girl.root);
      const k = clamp((T - 59.8) / 3.5);
      cam.position.set(lerp(0.2, 1.3, eIO(clamp((T - breakAt) / 1.4))), lerp(1.35, 1.25, k), lerp(2.6, 3.4, eIO(clamp((T - breakAt) / 1.4))));
      cam.lookAt(0, T < breakAt ? 1.15 : lerp(1.15, 0.7, eIO(clamp((T - breakAt) / 1))), 0);
      return { scene, camera: cam, post: { flash: { amount: T >= breakAt ? 0.5 * Math.exp(-(T - breakAt) * 8) : 0, color: '#ffffff' } } };
    },
  };
})();

// ---------------- d) 3D 世界收进手机屏
const D = (() => {
  // 世界
  const wScene = new THREE.Scene(); wScene.background = new THREE.Color('#0a0a10');
  wScene.add(createGirlLights());
  const city = createCity({ seed: 12, n: 17 }); city.group.position.z = -8; wScene.add(city.group);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: '#1c1624', roughness: 0.3, metalness: 0.6 }));
  floor.rotation.x = -Math.PI / 2; wScene.add(floor);
  const wCam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 300);
  wCam.position.set(0.3, 1.1, 3.6);
  const look = V(0, 0.9, 0); wCam.lookAt(look);
  // 外面：桌上横放的手机
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#ffd6e6');
  scene.add(new THREE.HemisphereLight('#ffffff', '#806070', 1.5));
  const dev = ui.device('phone', { W: 1280, H: 720, tex: null }, { width: 3.2 });
  dev.group.position.set(0, 1.2, 0); scene.add(dev.group);
  const table = new THREE.Mesh(new THREE.BoxGeometry(14, 0.3, 8), new THREE.MeshStandardMaterial({ color: '#f2c9d8' })); table.position.set(0, -0.05, -1); scene.add(table);
  const into = intoScreen({ renderer, device: dev });
  const cam = new THREE.PerspectiveCamera(34, 16 / 9, 0.02, 200);
  return {
    update(T) {
      city.update(T, { draw: 1, extrude: 1, light: 1 });
      scene.remove(girl.root); wScene.add(girl.root);
      girl.root.position.set(0, 0, 0); girl.root.rotation.set(0, 0, 0); girl.root.scale.setScalar(1);
      girl.dance('hairFlip', T); girl.setSkin('toon', T);
      dev.group.updateMatrixWorld(true);
      into.update(T, { t0: 63.9, dur: 2.4, world: { scene: wScene, camera: wCam, look }, outer: { camera: cam }, pullTo: 3.4 });
      return { scene, camera: cam };
    },
  };
})();

const parts = [A, B, C, D];
mv.mount(T => {
  const i = T < cuts[1] ? 0 : T < cuts[2] ? 1 : T < cuts[3] ? 2 : 3;
  const f = parts[i].update(T);
  mv.stage.render(f.scene, f.camera, { bloom: { strength: 0.5, threshold: 1 }, grade: { vignette: 0.2 }, ...(f.post || {}) });
}, { offset: T0, duration: T1 - T0 });
const names = ['a 推进屏幕 → 展开成 3D', 'b 立体书折起', 'c 从手机屏里爬出来', 'd 3D 世界收进手机屏'];
window.__video.chapters = cuts.slice(0, 4).map((c, i) => {
  const e = cuts[i + 1], d = e - c;
  return { id: 'transit-' + 'abcd'[i], t0: c - T0, t1: e - T0, caption: `${names[i]} · ${c}–${e}s`, sheet: [0.2, 0.5, 0.85].map(f => +(c - T0 + d * f).toFixed(3)) };
});
</script>
</body>
</html>
