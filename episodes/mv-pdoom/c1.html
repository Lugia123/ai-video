<script type="module">
import { loadMV } from './engine/index.js';
import { initType3D } from './kits/type3d.js';
import { createGirl } from './kits/girl.js';
import { createHolo } from './kits/hologram.js';
import { makeC1 } from './shots/c1.js';

const mv = await loadMV();
const [, girl, holo] = await Promise.all([initType3D(), createGirl(mv), createHolo(mv, { height: 1.6, base: false })]);
const { shots, cuts } = makeC1(mv, { girl, holo });
window.__cuts = cuts;
mv.mount(shots, { offset: 22.1, duration: 16.3 });
</script>
