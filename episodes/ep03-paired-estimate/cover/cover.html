<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ep03 封面</title>
<style>
  html, body { margin: 0; background: #EFE7D6; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
/*
 * ep03 封面：兑现开场画面——搭到一半的纸架子轰然塌掉（红色「？」块碎开），方块小人在废墟边举着「先试这个」。
 *   ?ratio=4x3  → 1440×1080（横版）
 *   ?ratio=16x9 → 1920×1080（宽版：左栏标题三行 + 划掉的纸条，右栏两根柱 + 小人）
 *   ?ratio=9x16 → 1080×1920（竖版：上标题三行、下两根柱 + 小人）
 * 导出：node tools/cover/cover.mjs episodes/ep03-paired-estimate
 * 页面画完后置 window.__coverReady = true。
 */
import { createKit, C, F, RAD, mulberry32 } from '../../../assets/lib/paper-kit.js';
import { createBuddy } from '../../../assets/lib/paper-girl.js';   // 纸片女孩 s=2.0（原方块小人版封面见 _boxbuddy/）

const RATIO = new URLSearchParams(location.search).get('ratio') ?? '4x3';
const V = RATIO === '9x16', WIDE = RATIO === '16x9';
const W = V ? 1080 : WIDE ? 1920 : 1440, H = V ? 1920 : 1080;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const K = createKit(ctx, { W, H, bgSeed: 303, creases: V ? [[-10, 1180, 1090, 1230]] : WIDE ? [[-10, 610, 1930, 660]] : [[-10, 610, 1450, 650]] });
const { rr, paper, text, poly } = K;
const ZH = F.zh;

/* ---------- 版式 ---------- */
const L = V ? {
  title: [{ x: 540, y: 330, align: 'center', size: 140 }, { x: 540, y: 490, align: 'center', size: 104 }, { x: 540, y: 630, align: 'center', size: 104 }],
  bars: { base: 1700, U: 240, xl: 320, xr: 870, w: 220 },
  buddy: { x: 580, y: 1712, s: 2.0 },
  slip: { x: 760, y: 1120, s: 0.66, rot: 4 },
  tape: { x: 30, y: 60, rot: -4 },
} : WIDE ? {
  title: [{ x: 80, y: 330, align: 'left', size: 120 }, { x: 84, y: 490, align: 'left', size: 104 }, { x: 84, y: 640, align: 'left', size: 104 }],
  bars: { base: 975, U: 150, xl: 1130, xr: 1720, w: 210 },
  buddy: { x: 1425, y: 985, s: 2.0 },
  slip: { x: 400, y: 840, s: 0.62, rot: 4 },
  tape: { x: 1540, y: 40, rot: 5 },
} : {
  title: [{ x: 70, y: 210, align: 'left', size: 150 }, { x: 76, y: 340, align: 'left', size: 84 }],
  bars: { base: 975, U: 150, xl: 330, xr: 1030, w: 210 },
  buddy: { x: 640, y: 985, s: 2.0 },
  slip: { x: 1120, y: 560, s: 0.62, rot: 4 },
  tape: { x: 1060, y: 40, rot: 5 },
};
const TITLE = V || WIDE ? [
  [{ s: '多花一半功夫？' }],
  [{ s: '有的贵 ' }, { s: '3', num: true, col: C.red }, { s: ' 倍' }],
  [{ s: '有的不到 ' }, { s: '1/5', num: true, col: C.green }],
] : [
  [{ s: '多花一半功夫？' }],
  [{ s: '有的贵 ' }, { s: '3', num: true, col: C.red }, { s: ' 倍，有的不到 ' }, { s: '1/5', num: true, col: C.green }],
];

function crayon(x0, y0, x1, y1, w, col) {
  ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.globalAlpha = 0.45; ctx.lineWidth = w * 0.45; ctx.strokeStyle = '#FFF4E8';
  ctx.beginPath(); ctx.moveTo(x0 + 3, y0 - 3); ctx.lineTo(x1 + 3, y1 - 3); ctx.stroke(); ctx.restore();
}
function bars(o) {
  const { base, U, xl, xr, w } = o;
  ctx.save(); ctx.setLineDash([14, 10]); ctx.strokeStyle = C.mute; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(xl - w, base - U); ctx.lineTo(xr + w * 0.8, base - U); ctx.stroke(); ctx.restore();
  ctx.strokeStyle = 'rgba(30,27,24,0.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(xl - w * 1.2, base + 3); ctx.lineTo(xr + w * 1.2, base + 3); ctx.stroke();
  const hl = U * 3.11, hr = U * 0.18;
  paper(rr(xl - w / 2, base - hl, w, hl, 8, 11, 0.9), [xl - w / 2, base - hl, w, hl], { fill: C.red, lift: 1.2, seed: 11, inkW: 2.8 });
  paper(rr(xr - w / 2, base - hr, w, hr, 8, 12, 0.9), [xr - w / 2, base - hr, w, hr], { fill: C.green, lift: 1.2, seed: 12, inkW: 2.8 });
  const sz = w * 0.5;
  text('×3.11', xl, base - hl - 24, sz, { align: 'center', font: F.big, weight: 800, color: C.red });
  text('×0.18', xr, base - hr - 24, sz, { align: 'center', font: F.big, weight: 800, color: C.green });
}
function slip(o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.rot * RAD); ctx.scale(o.s, o.s);
  paper(rr(-330, -62, 660, 124, 10, 31), [-330, -62, 660, 124], { fill: C.card, lift: 1.3, seed: 31, inkW: 2.6 });
  text('新系统 ≈ 原来 × 1.5', 0, 4, 58, { align: 'center', base: 'middle', font: ZH, weight: 700 });
  crayon(-300, 14, 300, -10, 13, C.red);
  ctx.restore();
}
const buddy = createBuddy(ctx, {
  path: [[0, L.buddy.x, L.buddy.y, L.buddy.s]],
  acts: [{ type: 'look', t0: 0, t1: 99, at: [L.bars.xl, L.bars.base - L.bars.U * 3] }],
});

/* ---------- 主标题：纸剪字——白纸描边 + 投影 + 错位色版；数字用红/绿强调 ---------- */
const fontOf = (p, size) => p.num ? `800 ${size * 1.12}px ${F.big}` : `600 ${size}px ${ZH}`;
function paperType(parts, x, y, size, align) {
  const widths = parts.map(p => { ctx.font = fontOf(p, size); return ctx.measureText(p.s).width; });
  const total = widths.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const x0 = cx;
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  // 1. 整行白纸底（带投影），2. 错位色版，3. 墨色字
  for (const pass of [0, 1, 2]) {
    cx = x0;
    parts.forEach((p, i) => {
      ctx.font = fontOf(p, size);
      if (pass === 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(70,48,25,0.38)'; ctx.shadowBlur = 14; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 10;
        ctx.strokeStyle = C.card; ctx.lineWidth = size * 0.2; ctx.strokeText(p.s, cx, y);
        ctx.restore();
      } else if (pass === 1) {
        ctx.fillStyle = p.col && p.col !== C.mute ? C.ink : C.mustard;
        ctx.fillText(p.s, cx + size * 0.04, y + size * 0.04);
      } else {
        ctx.fillStyle = p.col ?? C.ink; ctx.fillText(p.s, cx, y);
      }
      cx += widths[i];
    });
  }
  ctx.restore();
  return { x0, x1: x0 + total };
}

/* ---------- 系列标签：斜贴的纸胶带 ---------- */
function tape(o) {
  const label = '移植不是翻译 · 03';
  ctx.font = `600 34px ${ZH}`;
  const w = ctx.measureText(label).width + 70, h = 64;
  ctx.save(); ctx.translate(o.x + w / 2, o.y + h / 2); ctx.rotate(o.rot * RAD);
  // 胶带两端锯齿
  const p = new Path2D(), r = mulberry32(77);
  p.moveTo(-w / 2, -h / 2);
  p.lineTo(w / 2, -h / 2);
  for (let k = 0; k <= 8; k++) p.lineTo(w / 2 + (k % 2 ? -7 : 0) + (r() - 0.5) * 3, -h / 2 + h * k / 8);
  p.lineTo(-w / 2, h / 2);
  for (let k = 8; k >= 0; k--) p.lineTo(-w / 2 + (k % 2 ? 7 : 0) + (r() - 0.5) * 3, -h / 2 + h * k / 8);
  p.closePath();
  paper(p, [-w / 2, -h / 2, w, h], { fill: 'rgba(240,180,60,0.88)', lift: 0.5, seed: 141, ink: false });
  text(label, 0, 2, 34, { align: 'center', base: 'middle', font: ZH, weight: 600 });
  ctx.restore();
}

await document.fonts.load(`600 150px ${ZH}`, '多花一半功夫？有的贵倍，不到移植是翻译新系统原来');
await document.fonts.load(`800 150px ${F.big}`);
K.setTime(0);
K.drawBG();
tape(L.tape);
bars(L.bars);
slip(L.slip);
buddy.draw(3.3);
TITLE.forEach((parts, i) => paperType(parts, L.title[i].x, L.title[i].y, L.title[i].size, L.title[i].align));
ctx.font = `600 ${L.title[0].size}px ${ZH}`;
const m = ctx.measureText('多花一半功夫');
window.__coverInfo = { W, H, titleInkH: Math.round(m.actualBoundingBoxAscent + m.actualBoundingBoxDescent), minH: Math.round(H * (V ? 0.06 : 0.09)) };
window.__coverReady = true;
</script>
</body>
</html>
