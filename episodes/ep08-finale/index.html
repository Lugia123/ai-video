<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ep08 终章 报告和发生之间的连线</title>
<style>
  html, body { margin: 0; height: 100%; background: #EFE7D6; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; height: 36px;
    display: flex; align-items: center; gap: 12px; padding: 0 12px;
    background: rgba(0,0,0,.6); color: #ddd; font: 13px/1 ui-monospace, Menlo, monospace;
  }
  #hud[hidden] { display: none; }
  #hud .bar { flex: 1; height: 6px; background: #444; position: relative; cursor: pointer; }
  #hud .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #ddd; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud" hidden><span id="hud-play">▶ 空格播放</span><div class="bar" id="hud-bar"><i></i></div><span id="hud-time"></span></div>
<script type="module">
/*
 * ep08 终章《报告和发生之间的连线》
 *
 *   - 基础设施（时间轴 / kw / cutAfter / 字幕 / 小件）照 ep02、ep07；纸剪 UI 来自 paper-kit，讲解员来自 paper-girl（纸片女孩，原方块小人版见 out/final-boxbuddy.mp4），配乐来自 lofi。
 *   - 时间轴全部由 narration/timings.json 推出（按句）。镜头切点 cutAfter()：离说完 ≥ 1.0s、离下一句开口 ≥ 0.3s（CUTS 校验，不满足直接 throw）。
 *   - 开头没有口号和片头：第 0 帧就是三张报告卡，0.3 / 0.8 / 1.3s 依次盖上绿章「好了 ✓」，2.0–2.6s 三个章依次裂开透出红色；系列名只在 s02 之后的无配音字卡上。
 *   - 主画面「报告说的 | 实际发生的」两栏：每条连线的右端先在中间放大成前几集的招牌画面（一次只看一件），再缩回右栏。
 *     招牌画面借自各集 index.html 的同一画面元素：ep01 插头与万能插座（plugShape）、ep02 候选框落进虚线框、ep03 同一功能两根柱（bar）、
 *     ep04 右边和上边一圈黑边的窗口（termWin）、ep05 四道门（door）、ep06 三块地盘（配色 LAND 与 keycap 照 ep06 index.html）、ep07 仪表先红一次（gauge）。
 *   - 运镜：s02 三张卡飞进左栏；s03–s05 每条线的画面从中间放大 → 缩回右栏；s06 整块板子缩到上半屏，让出下半屏给两行大字。
 *   - 再抓回来：s03 第一条线连上（~25%）、s06 虚线擦掉重画成实线（~73%）；s07 回扣开头三张卡。
 *   - 字幕按句切换，文字与 script-v2-final-voice.txt 逐字一致（window.__debug.SUBS 可核对）。
 */
import { createKit, C, F, RAD, clamp, lerp, eo3, ei3, eio, eBack, hash, mulberry32, mix } from '../../assets/lib/paper-kit.js';
import { createBuddy as createGirl } from '../../assets/lib/paper-girl.js';
// 纸片女孩全片统一 s = 2.0（= girl-q/motion.mp4 里的大小，约占画高 45%；用户 2026-10-01 定）。
// 各镜头 path 里原来给方块小人写的 s 一律忽略，只用 x / y 站位；画在镜头缩放里的用 keepS 自己按 GIRL_S / 缩放 给 s。
const GIRL_S = 2.0;
const BUDDIES = [];   // 自查用：window.__debug.buddies 里每个讲解员的 state(t)（顺序 = 镜头顺序）
const createBuddy = (c, o) => { const b = createGirl(c, { ...o, path: o.keepS ? o.path : o.path.map(([t, x, y]) => [t, x, y, GIRL_S]) }); BUDDIES.push(b); return b; };
import { renderLofi, encodeWav } from '../../assets/lib/lofi.js';

const W = 1920, H = 1080, FPS = 30;
const RENDER = new URLSearchParams(location.search).get('render') === '1';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const K = createKit(ctx);
const { prog, press, rr, circ, poly, paper, text, bigType, win, l2s, toast, drawCursor } = K;
let t = 0;

/* ---------- 时间轴（旁白驱动，按句） ---------- */
const TL = await (await fetch('narration/timings.json', { cache: 'no-store' })).json();
const SEG = Object.fromEntries(TL.segments.map(s => [s.id, s]));
const seg = id => SEG[id] ?? (() => { throw new Error(`timings.json 里没有段落 ${id}`); })();
// 每段的句子，带在段文本里的字符区间 [i0, i1)
for (const s of TL.segments) {
  let off = 0;
  s.sents = (s.sentences ?? [{ text: s.text, start: s.start, end: s.end }]).map(x => {
    const i0 = s.text.indexOf(x.text, off);
    if (i0 < 0) throw new Error(`${s.id} 的句子对不上段落文本：${x.text}`);
    off = i0 + x.text.length;
    return { ...x, i0, i1: off };
  });
}
const SENT_ENDS = TL.segments.flatMap(s => s.sents.map(x => x.end));

/** 每个"字"的朗读权重：汉字 1；全大写缩写按字母数；其它英文词按音节粗估；逗号顿一下，句中冒号停久一点 */
function units(str) {
  const out = [];
  for (const m of str.matchAll(/[A-Za-z]+|[0-9]+|./gsu)) {
    const s = m[0];
    let w = 0;
    if (/^[A-Z]+$/.test(s)) w = s.length;
    else if (/^[A-Za-z]+$/.test(s)) w = Math.ceil(s.length / 3);
    else if (/^[0-9]+$/.test(s)) w = s.length;
    else if (/[一-鿿]/.test(s)) w = 1;
    else if ('，、'.includes(s)) w = 0.8;
    else if ('。？！：；'.includes(s)) w = 1.4;
    out.push([s, w, m.index]);
  }
  // 句尾标点不占时长（音频首尾静音已裁掉）
  for (let k = out.length - 1; k >= 0 && !/[一-鿿A-Za-z0-9]/.test(out[k][0]); k--) out[k][1] = 0;
  return out;
}
/** 段内第 idx 个字符（UTF-16 下标）开始的时刻：先定位到句子，再在句内按字数比例插值 */
function timeAt(id, idx) {
  const s = seg(id);
  const x = s.sents.find(x => idx < x.i1) ?? s.sents[s.sents.length - 1];
  const rel = idx - x.i0;
  let before = 0, total = 0;
  for (const [, w, i] of units(x.text)) { if (i < rel) before += w; total += w; }
  return x.start + (x.end - x.start) * (total ? before / total : 0);
}
/** 一句说完后 0.5s 内画面不起新动作：落在 (句末, 句末+0.5) 的时刻推到句末+0.5 */
function hold(tt) {
  for (const e of SENT_ENDS) if (tt > e + 1e-3 && tt < e + 0.5) return e + 0.5;
  return tt;
}
/** 关键词开始说出的时刻；end=true 取说完的时刻 */
function kw(id, needle, end = false) {
  const i = seg(id).text.indexOf(needle);
  if (i < 0) throw new Error(`段落 ${id} 里没有「${needle}」`);
  return hold(timeAt(id, end ? i + needle.length : i));
}
/** 第 k 句（从 1 起）的起止 */
const sent = (id, k) => seg(id).sents[k - 1];
/** 节奏参数（CLAUDE.md）：切点离上一句说完 ≥ 1.0s；新画面先出现 ≥ 0.3s 下一句才开口 */
const CUT_AFTER = 1.0, CUT_BEFORE = 0.3;
/** 段后的镜头切点：说完 1.0s 之后，把段间静音里剩下的余量对半分（段前停顿需 ≥ 1.3s，见 script.md） */
function cutAfter(id) {
  const i = TL.segments.findIndex(s => s.id === id), s = TL.segments[i], n = TL.segments[i + 1];
  const room = n ? n.start - s.end - CUT_AFTER - CUT_BEFORE : 0;
  return s.end + CUT_AFTER + Math.max(0, room) / 2;
}

/* ---------- 字幕：按句切换，文字与旁白逐字一致；长句在最靠中间的逗号处断开 ---------- */
const SUB_FONT = `600 46px ${F.zh}`, SUB_Y = 1012, SUB_MAX_W = 1760, SUB_MAX_CH = 26;
function splitLong(p) {
  if (Array.from(p).length <= SUB_MAX_CH) return [p];
  const cuts = [...p.matchAll(/[，、：]/g)].map(m => m.index + 1).filter(c => c < p.length);
  if (!cuts.length) return [p];
  const mid = p.length / 2, c = cuts.reduce((a, b) => (Math.abs(b - mid) < Math.abs(a - mid) ? b : a));
  return [...splitLong(p.slice(0, c)), ...splitLong(p.slice(c))];
}
const SUBS = [];
for (const s of TL.segments) {
  s.sents.forEach((x, k) => {
    const chunks = splitLong(x.text);
    let idx = x.i0;
    const starts = chunks.map(c => { const tt = timeAt(s.id, idx); idx += c.length; return tt; });
    const next = s.sents[k + 1]?.start ?? TL.segments[TL.segments.indexOf(s) + 1]?.start ?? Infinity;
    chunks.forEach((c, i) => SUBS.push({ id: s.id, text: c, t0: starts[i], t1: i + 1 < chunks.length ? starts[i + 1] : Math.min(x.end + 0.3, next - 0.02) }));
  });
}

function drawSubtitle() {
  const s = SUBS.find(s => t >= s.t0 && t < s.t1);
  if (!s) return;
  const a = clamp((t - s.t0) / 0.12) * (1 - clamp((t - (s.t1 - 0.1)) / 0.1));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = SUB_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(245,239,226,0.92)'; ctx.lineWidth = 14; ctx.strokeText(s.text, 960, SUB_Y);
  ctx.fillStyle = C.ink; ctx.fillText(s.text, 960, SUB_Y);
  ctx.restore();
}


/* ---------- 共用小件 ---------- */
const ZH = F.zh;
function withCam(cx, cy, z, fn) { ctx.save(); ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
const w2s = (cam, x, y) => [(x - cam[0]) * cam[2] + 960, (y - cam[1]) * cam[2] + 540];
const s2w = (cam, x, y) => [(x - 960) / cam[2] + cam[0], (y - 540) / cam[2] + cam[1]];
/** 红色蜡笔线：从 a 画到 b，p 为进度 */
function crayonLine(x0, y0, x1, y1, p, w = 12, col = C.red) {
  if (p <= 0) return;
  const x = lerp(x0, x1, p), y = lerp(y0, y1, p);
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
  ctx.globalAlpha *= 0.45; ctx.lineWidth = w * 0.45; ctx.strokeStyle = '#FFF4E8';
  ctx.beginPath(); ctx.moveTo(x0 + 3, y0 - 3); ctx.lineTo(x + 3, y - 3); ctx.stroke();
  ctx.restore();
}
/** 手绘红圈（逐渐画出） */
function inkCircle(cx, cy, rx, ry, p, seed, col = C.red) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate((hash(seed, 1) * 6) * RAD);
  ctx.strokeStyle = col; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath();
  const a0 = -2.2 + hash(seed, 2) * 0.4, span = Math.PI * 2.15 * p;
  for (let i = 0; i <= 40; i++) {
    const a = a0 + span * i / 40, wob = 1 + 0.05 * Math.sin(a * 3 + seed);
    const x = Math.cos(a) * rx * wob, y = Math.sin(a) * ry * wob;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke(); ctx.restore();
}
function pill(x, y, label, col, seed, size = 30) {
  ctx.font = `600 ${size}px ${ZH}`;
  const w = ctx.measureText(label).width + size * 1.2, h = size * 1.6;
  paper(rr(x, y, w, h, h / 2, seed), [x, y, w, h], { fill: col, lift: 0.4, seed, inkW: 2.4 });
  text(label, x + w / 2, y + h / 2 + 1, size, { align: 'center', base: 'middle', font: ZH, weight: 600 });
  return w;
}
/** 代码行：简单着色 */
const CODE_KW = /^(const|pub|fn|void|typedef|union|struct|return|try|_)$/;
function codeLine(s, x, y, size, o = {}) {
  ctx.font = `500 ${size}px ${F.code}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const cw = ctx.measureText('m').width;
  const toks = s.match(/"[^"]*"?|\w+|\s+|[^\w\s]/g) || [];
  let cx = x;
  for (const tk of toks) {
    let col = o.color ?? C.ink;
    if (!o.plain) {
      if (tk[0] === '"') col = C.red;
      else if (CODE_KW.test(tk)) col = C.blue;
      else if (/^[{}()[\];=.,*!@]$/.test(tk)) col = C.mute;
    }
    ctx.fillStyle = col; ctx.fillText(tk, cx, y);
    cx += cw * tk.length;
  }
  return cw;
}


function greenCheck(x, y, t0, seed, r = 38) {
  const ok = eBack(clamp((t - t0) / 0.25));
  if (ok <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(ok * r / 38, ok * r / 38);
  paper(circ(0, 0, 38, seed), [-38, -38, 76, 76], { fill: C.green, lift: 0.8, seed, inkW: 2.4 });
  ctx.strokeStyle = C.card; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-16, 1); ctx.lineTo(-4, 14); ctx.lineTo(17, -12); ctx.stroke();
  ctx.restore();
}
function stamp(label, x, y, tt, rot = -8, col = C.red, size = 44) {
  const sp = eBack(clamp((t - tt) / 0.25));
  if (sp <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * RAD); ctx.scale(sp, sp);
  ctx.font = `600 ${size}px ${ZH}`;
  const sw = ctx.measureText(label).width + size;
  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.strokeRect(-sw / 2, -size * 0.86, sw, size * 1.6);
  text(label, 0, 0, size, { align: 'center', base: 'middle', font: ZH, weight: 600, color: col });
  ctx.restore();
}
/** 淡入的小字说明 */
function note(s, x, y, size, t0, o = {}) {
  const a = clamp((t - t0) / 0.3);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  text(s, x, y + (1 - eo3(a)) * 12, size, { font: ZH, weight: 600, color: C.mute, ...o });
  ctx.restore();
}
/** 小人右手 / 左手在屏幕上的位置（draw 返回的状态） */
function handPos(st, side = 1) {
  const [ox, oy] = side === 1 ? st.handR : st.handL;
  return [st.x + st.s * (side * (105 + 12) + ox), st.y + st.s * (-36 + st.dy - 128 * st.sqy * 0.45 + oy)];
}
/** 「先试这个」小纸条：中心 (x, y) */
function trySlip(x, y, s = 1, rot = -6, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * RAD); ctx.scale(s, s);
  paper(rr(-120, -46, 240, 92, 8, 171), [-120, -46, 240, 92], { fill: o.fill ?? C.mustard, lift: 1.2, seed: 171, inkW: 2.6 });
  text(o.label ?? '先试这个', 0, 3, 40, { align: 'center', base: 'middle', font: ZH, weight: 700 });
  ctx.restore();
}
/** 纸便签（正方形），lines 条涂鸦线 */
function sticky(x, y, sz, rot, col, seed, lines = 3) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * RAD);
  paper(rr(-sz / 2, -sz / 2, sz, sz, 6, seed, 0.8), [-sz / 2, -sz / 2, sz, sz], { fill: col, lift: 0.9, seed, inkW: 2.4 });
  ctx.fillStyle = 'rgba(30,27,24,0.28)';
  for (let i = 0; i < lines; i++) ctx.fillRect(-sz * 0.34, -sz * 0.22 + i * sz * 0.2, sz * (0.5 + 0.18 * hash(seed, i)), sz * 0.07);
  ctx.restore();
}

/* ================================================================
 * 本集道具
 * ================================================================ */
/** 仪表：cx, cy 为表盘中心；v ∈ [0,1] 指针（0 绿端，1 红端）；broken：指针断了、表盘裂了；lamp：底部小灯颜色；sticker：贴纸揭开进度（-1 = 不画贴纸） */
function gauge(cx, cy, r, o = {}) {
  const seed = o.seed ?? 401;
  paper(rr(cx - r * 1.2, cy - r * 1.2, r * 2.4, r * 2.4, 26, seed), [cx - r * 1.2, cy - r * 1.2, r * 2.4, r * 2.4], { fill: '#D8D4CC', lift: 1.2, seed });
  ctx.fillStyle = '#4A433C'; ctx.fillRect(cx - r * 0.4, cy - r * 1.2 + 10, r * 0.8, 12);          // 顶上的投样口
  paper(circ(cx, cy, r, seed + 1), [cx - r, cy - r, r * 2, r * 2], { fill: C.card, lift: 0.3, seed: seed + 1, inkW: 2.6 });
  const a0 = Math.PI * 1.08, a1 = Math.PI * 1.92;
  ctx.save(); ctx.lineWidth = r * 0.15; ctx.lineCap = 'butt';
  for (const [u0, u1, col] of [[0, 0.55, C.green], [0.55, 0.76, C.mustard], [0.76, 1, C.red]]) {
    ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(cx, cy, r * 0.76, lerp(a0, a1, u0), lerp(a0, a1, u1)); ctx.stroke();
  }
  ctx.restore();
  if (o.broken) {
    ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath(); [[-0.42, -0.36], [-0.12, -0.08], [-0.2, 0.1], [0.1, 0.34], [0.05, 0.46]].forEach(([x, y], k) => (k ? ctx.lineTo(cx + x * r, cy + y * r) : ctx.moveTo(cx + x * r, cy + y * r))); ctx.stroke();
    ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.strokeStyle = C.ink;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * 0.1, cy - r * 0.2); ctx.stroke();            // 断掉的指针根
    ctx.beginPath(); ctx.moveTo(cx - r * 0.3, cy + r * 0.3); ctx.lineTo(cx + r * 0.12, cy + r * 0.38); ctx.stroke();   // 掉下来的半截
    ctx.restore();
  } else {
    const a = lerp(a0, a1, o.v ?? 0.2);
    ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r * 0.7, cy + Math.sin(a) * r * 0.7); ctx.stroke(); ctx.restore();
  }
  paper(circ(cx, cy, r * 0.08, seed + 2), [cx - 12, cy - 12, 24, 24], { fill: C.ink, lift: 0, seed: seed + 2, inkW: 1 });
  paper(circ(cx, cy + r * 0.62, r * 0.13, seed + 3), [cx - r * 0.13, cy + r * 0.49, r * 0.26, r * 0.26], { fill: o.lamp ?? '#BDB5A6', lift: 0.2, seed: seed + 3, inkW: 2.2 });
  const sp = o.sticker ?? -1;
  if (sp >= 0 && sp < 1) {
    ctx.save(); ctx.translate(cx + sp * r * 1.1, cy - r * 0.05 - sp * r * 0.9); ctx.rotate(sp * 32 * RAD); ctx.globalAlpha *= 1 - clamp((sp - 0.7) / 0.3);
    const pop = o.pop == null ? 1 : eBack(clamp(o.pop));
    if (o.pop != null && o.pop <= 0) {
      paper(circ(0, 0, r * 0.52, seed + 4), [-r * 0.52, -r * 0.52, r * 1.04, r * 1.04], { fill: C.sand, lift: 0.6, seed: seed + 4, inkW: 2.6 });
      ctx.restore(); return;
    }
    ctx.scale(lerp(1.35, 1, pop), lerp(1.35, 1, pop));
    paper(circ(0, 0, r * 0.52, seed + 4), [-r * 0.52, -r * 0.52, r * 1.04, r * 1.04], { fill: C.green, lift: 0.6 + sp * 2, seed: seed + 4, inkW: 2.6 });
    ctx.strokeStyle = C.card; ctx.lineWidth = r * 0.1; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-r * 0.22, 0); ctx.lineTo(-r * 0.05, r * 0.18); ctx.lineTo(r * 0.25, -r * 0.18); ctx.stroke();
    ctx.restore();
  }
}

/** 段 id 第 k 句（从 1 起）里关键词开始说出的时刻 */
function kwS(id, k, needle) {
  const x = seg(id).sents[k - 1], i = x.text.indexOf(needle);
  if (i < 0) throw new Error(`段落 ${id} 第 ${k} 句里没有「${needle}」`);
  return hold(timeAt(id, x.i0 + i));
}

/* ================================================================
 * 前几集的招牌画面（本地坐标 640×360）
 * ================================================================ */
// ep01：插头与万能插座（plugShape / plugLeft 照 ep01）
function plugShape(xr, cy, col, seed, o = {}) {
  const w = o.w ?? 210, h = o.h ?? 150, pl = o.pl ?? 84, gap = o.gap ?? 100;
  for (const dy of [-gap / 2, gap / 2]) paper(rr(xr - 6, cy + dy - 11, pl + 6, 22, 5, seed + (dy > 0 ? 3 : 4), 0.4), [xr - 6, cy + dy - 11, pl + 6, 22], { fill: '#CFCBC3', lift: 0.3, seed: seed + 5, inkW: 2.4 });
  paper(rr(xr - w, cy - h / 2, w, h, 26, seed), [xr - w, cy - h / 2, w, h], { fill: col, lift: 1.2, seed });

    if (L.i === 3 && t >= T.redraw) ctx.globalAlpha = 0;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, p), lerp(y0, y1, p)); ctx.stroke();
    ctx.restore();
    if (L.i === 3 && t >= T.redraw) crayonLine(x0, y0, x1, y1, clamp((t - T.redraw) / 0.6), 7, C.green);
    paper(circ(x0, y0, 9, 610 + L.i), [x0 - 9, y0 - 9, 18, 18], { fill: C.ink, lift: 0, seed: 610 + L.i, inkW: 1 });
  });
  // 右栏的小卡片（已缩回的）+ 关键词；中间正在放大的那张最后画
  let active = null;
  LINKS.forEach(L => {
    if (t < L.link - 0.2) return;
    if (t < L.shrink + 0.55) { active = L; return; }
    const e = linkEnd(L);
    thumbCard(L.i, e.cx, e.cy, e.s);
    note(L.key, COL.rx + TW * SLOT_S + 20, COL.rowY(L.i) + 11, 30, L.shrink + 0.4, { color: C.ink });
  });
  if (active) {
    const e = linkEnd(active), pop = eBack(clamp((t - active.link + 0.2) / 0.35));
    thumbCard(active.i, e.cx, e.cy, e.s * pop, clamp(pop * 3), t - active.link);
  }
}
function shotBoard() {
  const u = eio(clamp((t - T.up0) / (T.up1 - T.up0)));
  ctx.save(); ctx.translate(960, 40); ctx.scale(lerp(1, 0.6, u), lerp(1, 0.6, u)); ctx.translate(-960, -40);
  drawBoard();
  ctx.restore();
  buddy2.draw(t);
  bigType('找出原平台替你做的事', 960, 700, 76, T.big1, { align: 'center', font: ZH, weight: 600, stagger: 0.04 });
  bigType('确认你的工具没在骗你', 960, 830, 76, T.big2, { align: 'center', font: ZH, weight: 600, stagger: 0.04 });
}

/* ---------- 镜头 3（s07）：回到开头三张「好了」——连线在哪？ ---------- */
const buddy3 = createBuddy(ctx, {
  path: [[T.cut.s06, 2120, 940], [T.back + 0.2, 2120, 940], [T.back + 2.0, 1680, 940]],
  acts: [
    { type: 'question', t0: T.back + 1.9, t1: T.ask - 0.2 },   // 走到位直接疑问（去掉中间的 look）
    { type: 'point', t0: T.ask - 0.2, t1: T.end0, at: [960, 760], hand: 'l' },
  ],
});
function shotBack() {
  CARDS.forEach((_, i) => {
    const a = eo3(clamp((t - T.cut.s06 - i * 0.15) / 0.4));
    ctx.save(); ctx.globalAlpha = a; reportCard(i, 300 + i * 480, 400 - (1 - a) * 40, 0.8, 1, 1); ctx.restore();
    inkCircle(300 + i * 480 + 40, 400 + 64, 130, 60, clamp((t - T.back - 0.3 - i * 0.7) / 0.5), 620 + i);
  });
  bigType('连线在哪？', 960, 790, 110, T.ask, { align: 'center', font: ZH, weight: 600, stagger: 0.07 });
  buddy3.draw(t);
}

/* ---------- 结尾字卡 ---------- */
function shotEnd() {
  const p = eo3(clamp((t - T.end0) / 0.2));
  ctx.save(); ctx.globalAlpha = p;
  text('《移植不是翻译》', 960, 470, 80, { align: 'center', base: 'middle', font: ZH, weight: 600 });
  text('全系列完', 960, 590, 44, { align: 'center', base: 'middle', font: ZH, weight: 600, color: C.mute });
  ctx.restore();
}

/* ---------- 镜头表 ---------- */
const SHOTS = [
  { id: 'hook', t0: 0, draw: shotHook },
  { id: 'card', t0: T.card0, draw: shotCard },
  { id: 'board', t0: T.card1, draw: shotBoard },
  { id: 'back', t0: T.cut.s06, draw: shotBack },
  { id: 'end', t0: T.end0, draw: shotEnd },
];
SHOTS.forEach((s, i) => { s.t1 = SHOTS[i + 1]?.t0 ?? Infinity; });
const SENTS = TL.segments.flatMap(s => s.sents);
const CUTS = SHOTS.slice(1).map(s => {
  const prevEnd = Math.max(...SENTS.filter(x => x.end <= s.t0).map(x => x.end));
  const inSent = SENTS.find(x => x.start < s.t0 && s.t0 < x.end);
  const next = SENTS.find(x => x.start >= s.t0);
  const c = { id: s.id, t: +s.t0.toFixed(3), afterEnd: +(s.t0 - prevEnd).toFixed(3), beforeStart: next ? +(next.start - s.t0).toFixed(3) : null };
  if (inSent || c.afterEnd < CUT_AFTER - 1e-6 || (next && c.beforeStart < CUT_BEFORE - 1e-6)) throw new Error(`切点 ${s.id} 不满足节奏参数：${JSON.stringify(c)}`);
  return c;
});
// 放大画面的「镜头」也要守节奏：每张卡片的放大和缩回都不许压在同一句话中间开始之前 0.3s 内（放大跟着「要连到」，缩回在下一句开口前 0.35s）
LINKS.forEach(L => { if (!(L.shrink > L.link + 1.0)) throw new Error(`连线 ${L.label} 放大停留不足 1s`); });

const SFX = [
  ...T.st.map(x => ({ t: x, kind: 'pop' })), ...T.ck.map(x => ({ t: x, kind: 'snip' })),
  { t: T.report, kind: 'whoosh' }, { t: T.gap, kind: 'click' },
  { t: T.card0, kind: 'whoosh' },
  ...LINKS.map(L => ({ t: L.link, kind: 'pop' })), ...LINKS.map(L => ({ t: L.shrink, kind: 'whoosh' })),
  { t: T.erase, kind: 'snip' }, { t: T.redraw, kind: 'ding' }, { t: T.up0, kind: 'whoosh' },
  { t: T.ask, kind: 'ding' },
];

/* ---------- seek：t 的纯函数 ---------- */
function render(tt) {
  t = Math.max(0, Math.min(TL.duration, tt));
  K.setTime(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  K.drawBG();
  const shot = SHOTS.find(s => t >= s.t0 && t < s.t1) ?? SHOTS[SHOTS.length - 1];
  const since = t - shot.t0;
  const z = shot.t0 > 0 ? 1 + 0.015 * Math.exp(-since * 12) : 1;
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  shot.draw();
  ctx.restore();
  drawSubtitle();
}

/* ---------- 配乐 ---------- */
let musicBuf = null;
const music = async () => (musicBuf ??= await renderLofi({
  duration: TL.duration,
  speech: TL.segments.map(s => [s.start, s.end]),
  speechDb: TL.speech_mean_db ?? -21,
  bright: [[0, 3.0], [T.card0, T.card1], [T.end0, TL.duration]],
  sfx: SFX,
}));
/* ---------- 预览：空格播放（旁白 + 配乐），← → 跳 2 秒 ---------- */
function startPreview() {
  const hud = document.getElementById('hud'); hud.hidden = false;
  let actx = null, narr = null, srcs = [], playing = false, tt = 0, t0 = 0;
  const stop = () => { srcs.forEach(s => s.stop()); srcs = []; playing = false; };
  const play = async () => {
    actx ??= new AudioContext();
    narr ??= await actx.decodeAudioData(await (await fetch('narration/narration.mp3')).arrayBuffer());
    const mb = await music();
    if (tt >= TL.duration) tt = 0;
    srcs = [narr, mb].map(b => { const s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0, tt); return s; });
    t0 = actx.currentTime - tt; playing = true;
  };
  const toggle = () => (playing ? (tt = actx.currentTime - t0, stop()) : play());
  const jump = d => { const was = playing; if (playing) { tt = actx.currentTime - t0; stop(); } tt = clamp(tt + d, 0, TL.duration); if (was) play(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowLeft') jump(-2);
    if (e.code === 'ArrowRight') jump(2);
  });
  document.getElementById('hud-bar').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    jump((e.clientX - r.left) / r.width * TL.duration - (playing ? actx.currentTime - t0 : tt));
  });
  (function loop() {
    if (playing) { tt = actx.currentTime - t0; if (tt >= TL.duration) { tt = TL.duration; stop(); } }
    render(tt);
    document.getElementById('hud-play').textContent = playing ? '❚❚' : '▶ 空格播放';
    document.getElementById('hud-time').textContent = `${tt.toFixed(2)} / ${TL.duration.toFixed(2)}s`;
    hud.querySelector('.bar i').style.width = `${tt / TL.duration * 100}%`;
    requestAnimationFrame(loop);
  })();
}

await document.fonts.load(`600 46px ${F.zh}`, '报告和发生之间的连线');
await document.fonts.load(`800 100px ${F.big}`);
await document.fonts.load(`600 30px ${F.ui}`);
await document.fonts.load(`500 30px ${F.code}`);
ctx.font = SUB_FONT;
for (const s of SUBS) s.width = Math.round(ctx.measureText(s.text).width);
render(0);
window.__debug = { buddies: BUDDIES, LINKS: LINKS.map(L => ({ label: L.label, link: L.link, shrink: L.shrink })), SUBS, SHOTS: SHOTS.map(s => ({ id: s.id, t0: s.t0, t1: s.t1 })), CUTS, T, SUB_MAX_W, kw, SEGS: TL.segments.map(s => ({ id: s.id, start: s.start, end: s.end })) };
window.__video = {
  width: W, height: H, fps: FPS, duration: TL.duration,
  seek: render,
  renderAudio: async () => encodeWav(await music()),
};
if (!RENDER) startPreview();
</script>
