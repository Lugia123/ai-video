<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud" hidden><span id="hud-play">▶ 空格播放</span><div class="bar" id="hud-bar"><i></i></div><span id="hud-time"></span></div>
<script type="module">
/*
 * ep04《原平台零行 ≠ 零工作》
 *
 *   - 全部 Canvas 2D，画面是 t 的纯函数。纸剪 UI 来自 assets/lib/paper-kit.js，讲解员来自 paper-girl.js（切图版纸片女孩，#1027 起替换原来的 box-buddy.js；全片统一 s = 2.0），
 *     配乐来自 lofi.js（renderAudio 返回 WAV，渲染器与旁白混音）。时间轴/字幕/切点写法与 ep02、ep03 相同。
 *   - 时间轴全部由 narration/timings.json 推出（按句）。kw(段, '关键词') 定位到句内按字数比例估时刻，
 *     落在「句末后 0.5s」之内的推到句末 + 0.5s（hold）。镜头切点 cutAfter()：离说完 ≥ 1.0s、离下一句开口 ≥ 0.3s（CUTS 校验）。
 *   - 开头没有口号和片头：第 0 帧就是一扇纸质终端窗口，0.3–0.9s 被小人拉大，右边和上边露出一圈黑边；系列名只在 s02 之后 1.5s 的无配音字卡上。
 *   - 黑边的画法：画框（GL 视口）钉在内容区左下角、大小不跟窗口走，所以多出来的右边和上边是黑的（termWin）。
 *   - 运镜：s01 窗口被拉大；s06 从「设画框」拉远扫过整个项目；s07 横移到 Linux 再横移回 Windows；s12 回到开头那扇窗口。
 *   - 再抓回来：s04 三张猜测卡依次推翻（~23%）、s06–s07 没人调用 → Linux 那边有人代劳（~44–49%）、s10「不做菜单栏」被否（~74%）、s12 回扣黑边（~91%）。
 *   - 字幕按句切换，文字与 script.md 逐字一致（window.__debug.SUBS 可核对）。
 */
import { createKit, C, F, RAD, clamp, lerp, eo3, ei3, eio, eBack, hash, mulberry32 } from '../../assets/lib/paper-kit.js';
import { createBuddy as createBuddy0 } from '../../assets/lib/paper-girl.js';
const BUDDIES = [];   // 自查用（tools/render/pose-stats.mjs）：按创建顺序收集每个讲解员
const createBuddy = (c, o) => { const b = createBuddy0(c, o); BUDDIES.push(b); return b; };
/** 讲解员大小：全片统一 s = 2.0（站着约 480px 高，约 45% 画高），基准是 assets/characters/girl-q/motion.mp4 */
const GS = 2;
import { renderLofi, encodeWav } from '../../assets/lib/lofi.js';

const W = 1920, H = 1080, FPS = 30;
const RENDER = new URLSearchParams(location.search).get('render') === '1';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const K = createKit(ctx);
const { rr, circ, poly, paper, text, bigType, win, l2s } = K;
let t = 0;

/* ---------- 时间轴（旁白驱动，按句） ---------- */
const TL = await (await fetch('narration/timings.json', { cache: 'no-store' })).json();
const SEG = Object.fromEntries(TL.segments.map(s => [s.id, s]));
const seg = id => SEG[id] ?? (() => { throw new Error(`timings.json 里没有段落 ${id}`); })();
for (const s of TL.segments) {
  let off = 0;
  s.sents = (s.sentences ?? [{ text: s.text, start: s.start, end: s.end }]).map(x => {
    const i0 = s.text.indexOf(x.text, off);
    if (i0 < 0) throw new Error(`${s.id} 的句子对不上段落文本：${x.text}`);
    off = i0 + x.text.length;
    return { ...x, i0, i1: off };
  });
}
const SENT_ENDS = TL.segments.flatMap(s => s.sents.map(x => x.end));

/** 每个"字"的朗读权重：汉字 1；全大写缩写按字母数；其它英文词按音节粗估；逗号顿一下，句中冒号停久一点 */
function units(str) {
  const out = [];
  for (const m of str.matchAll(/[A-Za-z]+|[0-9]+|./gsu)) {
    const s = m[0];
    let w = 0;
    if (/^[A-Z]+$/.test(s)) w = s.length;
    else if (/^[A-Za-z]+$/.test(s)) w = Math.ceil(s.length / 3);
    else if (/^[0-9]+$/.test(s)) w = s.length;
    else if (/[一-鿿]/.test(s)) w = 1;
    else if ('，、'.includes(s)) w = 0.8;
    else if ('。？！：；'.includes(s)) w = 1.4;
    out.push([s, w, m.index]);
  }
  for (let k = out.length - 1; k >= 0 && !/[一-鿿A-Za-z0-9]/.test(out[k][0]); k--) out[k][1] = 0;
  return out;
}
function timeAt(id, idx) {
  const s = seg(id);
  const x = s.sents.find(x => idx < x.i1) ?? s.sents[s.sents.length - 1];
  const rel = idx - x.i0;
  let before = 0, total = 0;
  for (const [, w, i] of units(x.text)) { if (i < rel) before += w; total += w; }
  return x.start + (x.end - x.start) * (total ? before / total : 0);
}
function hold(tt) {
  for (const e of SENT_ENDS) if (tt > e + 1e-3 && tt < e + 0.5) return e + 0.5;
  return tt;
}
function kw(id, needle, end = false) {
  const i = seg(id).text.indexOf(needle);
  if (i < 0) throw new Error(`段落 ${id} 里没有「${needle}」`);
  return hold(timeAt(id, end ? i + needle.length : i));
}
const sent = (id, k) => seg(id).sents[k - 1];
const CUT_AFTER = 1.0, CUT_BEFORE = 0.3;
function cutAfter(id) {
  const i = TL.segments.findIndex(s => s.id === id), s = TL.segments[i], n = TL.segments[i + 1];
  const room = n ? n.start - s.end - CUT_AFTER - CUT_BEFORE : 0;
  return s.end + CUT_AFTER + Math.max(0, room) / 2;
}

/* ---------- 字幕：按句切换，文字与旁白逐字一致；长句在最靠中间的逗号处断开 ---------- */
const SUB_FONT = `600 46px ${F.zh}`, SUB_Y = 1012, SUB_MAX_W = 1760, SUB_MAX_CH = 26;
function splitLong(p) {
  if (Array.from(p).length <= SUB_MAX_CH) return [p];
  const cuts = [...p.matchAll(/[，、：；]/g)].map(m => m.index + 1).filter(c => c < p.length);
  if (!cuts.length) return [p];
  const mid = p.length / 2, c = cuts.reduce((a, b) => (Math.abs(b - mid) < Math.abs(a - mid) ? b : a));
  return [...splitLong(p.slice(0, c)), ...splitLong(p.slice(c))];
}
const SUBS = [];
for (const s of TL.segments) {
  s.sents.forEach((x, k) => {
    const chunks = splitLong(x.text);
    let idx = x.i0;
    const starts = chunks.map(c => { const tt = timeAt(s.id, idx); idx += c.length; return tt; });
    const next = s.sents[k + 1]?.start ?? TL.segments[TL.segments.indexOf(s) + 1]?.start ?? Infinity;
    chunks.forEach((c, i) => SUBS.push({ id: s.id, text: c, t0: starts[i], t1: i + 1 < chunks.length ? starts[i + 1] : Math.min(x.end + 0.3, next - 0.02) }));
  });
}
function drawSubtitle() {
  const s = SUBS.find(s => t >= s.t0 && t < s.t1);
  if (!s) return;
  const a = clamp((t - s.t0) / 0.12) * (1 - clamp((t - (s.t1 - 0.1)) / 0.1));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = SUB_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(245,239,226,0.92)'; ctx.lineWidth = 14; ctx.strokeText(s.text, 960, SUB_Y);
  ctx.fillStyle = C.ink; ctx.fillText(s.text, 960, SUB_Y);
  ctx.restore();
}

/* ---------- 共用小件 ---------- */
const ZH = F.zh;
function withCam(cx, cy, z, fn) { ctx.save(); ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function crayonLine(x0, y0, x1, y1, p, w = 12, col = C.red) {
  if (p <= 0) return;
  const x = lerp(x0, x1, p), y = lerp(y0, y1, p);
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
  ctx.globalAlpha *= 0.45; ctx.lineWidth = w * 0.45; ctx.strokeStyle = '#FFF4E8';
  ctx.beginPath(); ctx.moveTo(x0 + 3, y0 - 3); ctx.lineTo(x + 3, y - 3); ctx.stroke();
  ctx.restore();
}
function inkCircle(cx, cy, rx, ry, p, seed, col = C.red) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate((hash(seed, 1) * 6) * RAD);
  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  const a0 = -2.2 + hash(seed, 2) * 0.4, span = Math.PI * 2.15 * p;
  for (let i = 0; i <= 40; i++) {
    const a = a0 + span * i / 40, wob = 1 + 0.05 * Math.sin(a * 3 + seed);
    const x = Math.cos(a) * rx * wob, y = Math.sin(a) * ry * wob;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke(); ctx.restore();
}
function pill(x, y, label, col, seed, size = 30, o = {}) {
  ctx.font = `${o.weight ?? 600} ${size}px ${o.font ?? ZH}`;
  const w = ctx.measureText(label).width + size * 1.2, h = size * 1.6;
  paper(rr(x, y, w, h, h / 2, seed), [x, y, w, h], { fill: col, lift: 0.4, seed, inkW: 2.4 });
  text(label, x + w / 2, y + h / 2 + 1, size, { align: 'center', base: 'middle', font: o.font ?? ZH, weight: o.weight ?? 600, color: o.color });
  return w;
}
function pillW(label, size = 30, font = ZH, weight = 600) { ctx.font = `${weight} ${size}px ${font}`; return ctx.measureText(label).width + size * 1.2; }
function codeLine(s, x, y, size, col) {
  ctx.font = `500 ${size}px ${F.code}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = col ?? C.ink; ctx.fillText(s, x, y);
}
function greenCheck(x, y, t0, seed, r = 38) {
  const ok = eBack(clamp((t - t0) / 0.25));
  if (ok <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(ok * r / 38, ok * r / 38);
  paper(circ(0, 0, 38, seed), [-38, -38, 76, 76], { fill: C.green, lift: 0.8, seed, inkW: 2.4 });
  ctx.strokeStyle = C.card; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-16, 1); ctx.lineTo(-4, 14); ctx.lineTo(17, -12); ctx.stroke();
  ctx.restore();
}
function stamp(label, x, y, tt, rot = -8, col = C.red, size = 44) {
  const sp = eBack(clamp((t - tt) / 0.25));
  if (sp <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * RAD); ctx.scale(sp, sp);
  ctx.font = `600 ${size}px ${ZH}`;
  const sw = ctx.measureText(label).width + size;
  ctx.fillStyle = 'rgba(255,252,245,0.85)'; ctx.fillRect(-sw / 2, -size * 0.86, sw, size * 1.6);
  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.strokeRect(-sw / 2, -size * 0.86, sw, size * 1.6);
  text(label, 0, 0, size, { align: 'center', base: 'middle', font: ZH, weight: 600, color: col });
  ctx.restore();
}
function note(s, x, y, size, t0, o = {}) {
  const a = clamp((t - t0) / 0.3);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  text(s, x, y + (1 - eo3(a)) * 12, size, { font: ZH, weight: 600, color: C.mute, ...o });
  ctx.restore();
}
function dashed(x0, y0, x1, y1, col = C.mute, w = 3, dash = [14, 10]) {
  ctx.save(); ctx.setLineDash(dash); ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore();
}
/** 箭头：从 (x, y) 朝 dir（1 上 / -1 下）长 len */
function arrow(x, y, dir, len, col, p = 1) {
  if (p <= 0) return;
  const L = len * eo3(p), y1 = y - dir * L;
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y1 + dir * 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x - 26, y1 + dir * 34); ctx.lineTo(x + 26, y1 + dir * 34); ctx.closePath(); ctx.fill();
  ctx.restore();
}
/** 纸柱子：底边中心 (x, base)，高 h */
function bar(x, base, w, h, col, seed) {
  if (h <= 1) return;
  paper(rr(x - w / 2, base - h, w, h, 8, seed, 0.9), [x - w / 2, base - h, w, h], { fill: col, lift: 1, seed, inkW: 2.6 });
}

/* ================================================================
 * 时刻表（全部从 timings.json 推出）
 * ================================================================ */
// 读到没定义的时刻直接报错（防止某个时刻被误并进注释、动作悄悄不出现）
const T = new Proxy({}, { get(o, k) { if (typeof k === 'string' && k !== 'toJSON' && !(k in o)) throw new Error(`时刻 T.${k} 没有定义`); return o[k]; } });
for (const s of TL.segments) T[s.id] = s;
T.cut = Object.fromEntries(TL.segments.map(s => [s.id, cutAfter(s.id)]));
T.card0 = T.s02.end + 1.0; T.card1 = T.card0 + 1.5;              // s02 说完 1.0s 后 1.5s 无配音系列字卡
T.end0 = T.s12.end + 2.8; T.end1 = TL.duration;                // 最后一句说完画面停 2.8s，再接结尾字卡到片尾
// s01：前 1 秒窗口就被拉大、黑边露出（front load，不等旁白说到）
T.grow0 = 0.3; T.grow1 = 0.9;
T.edge = kw('s01', '右边和上边'); T.line1 = kw('s01', '一行从来没人写过');
// s02
T.zero = kw('s02', '一行代码都不用写'); T.neq = hold(sent('s02', 2).start);
// s03
T.polter = Math.min(kw('s03', 'Polter'), T.card1 + 0.2); T.three = kw('s03', '连猜了三次'); T.wrong3 = kw('s03', '三次都猜错');
// s04
T.g1 = kw('s04', '先猜'); T.g1t = kw('s04', '一试'); T.g1x = kw('s04', '不是');
T.g2 = kw('s04', '再猜'); T.g2ok = kw('s04', '改完居然好了'); T.g2x = kw('s04', '碰巧');
T.g3 = kw('s04', '又猜'); T.g3t = kw('s04', '一查'); T.g3ok = kw('s04', '尺寸全对'); T.g3x = kw('s04', '尺寸全对', true) + 0.3;
// s05
T.print = kw('s05', '打了出来'); T.frame = kw('s05', '画框，就是'); T.gpu = kw('s05', '告诉显卡');
T.stuck = hold(sent('s05', 3).start); T.still = kw('s05', '卡着没动');
// s06
T.hunt = hold(sent('s06', 1).start); T.whole = kw('s06', '整个项目里'); T.none = kw('s06', '一次都没人用过');
// s07
T.why = kw('s07', '那为什么'); T.pan0 = T.cut.s06 + 0.1; T.pan1 = kw('s07', 'Linux', true);
T.gtk = kw('s07', '界面工具包'); T.every = kw('s07', '每一帧');
T.back0 = kw('s07', '换到 Windows'); T.back1 = T.back0 + 1.0; T.nobody = kw('s07', '就没人管了');
// s08
T.noIf = kw('s08', '没加'); T.shared = kw('s08', '两边共用'); T.self = kw('s08', '自己把画框设好');
// s09
T.more = Math.min(kw('s09', '不止一件'), T.cut.s08 + 0.3); T.menu = kw('s09', '比如主菜单'); T.n103 = kw('s09', '一百多个');
T.xib = kw('s09', '界面图纸'); T.noCode = kw('s09', '一行代码都没写');
// s10
T.plan = kw('s10', '原本打算'); T.noBar = kw('s10', '干脆不做菜单栏'); T.veto = kw('s10', '当面否了'); T.ask = kw('s10', '一个从没人教过'); T.btn = kw('s10', '这些命令');
// s11
T.list = kw('s11', '把原来零行'); T.whyZ = kw('s11', '为什么是零'); T.sort = hold(sent('s11', 2).start); T.someone = kw('s11', '还是有人替你做了');
// s12
T.back = kw('s12', '回到那圈黑边'); T.fill = kw('s12', '而在'); T.fill1 = kw('s12', '那一行');

/* ---------- 终端窗口：画框（视口）钉在内容区左下角，没跟上窗口大小时右边和上边露黑 ---------- */
const TB = K.TB, BLACK = '#1C1916';
/** (x, y, w, h)：窗口外框；vw, vh：画框大小（null = 跟窗口一样大）；o.frame：画出虚线画框 */
function termWin(x, y, w, h, vw, vh, o = {}) {
  win({ x, y, w, h, title: o.title ?? 'Polter', seed: o.seed ?? 11, rot: o.rot ?? 0, t0: o.t0, s: o.s }, (iw, ih) => {
    const fw = Math.min(iw - 24, vw ?? iw), fh = Math.min(ih - 20, vh ?? ih);
    ctx.fillStyle = BLACK; ctx.fillRect(12, 8, iw - 24, ih - 20);           // 整块内容区先涂黑
    const fx = 12, fy = ih - 12 - (vh == null ? ih - 20 : fh), FW = vw == null ? iw - 24 : fw, FH = vh == null ? ih - 20 : fh;
    ctx.fillStyle = '#FBF6EA'; ctx.fillRect(fx, fy, FW, FH);               // 画框里是正常的终端画面
    ctx.save(); ctx.beginPath(); ctx.rect(fx, fy, FW, FH); ctx.clip();
    const lines = Math.floor((FH - 30) / 46);
    for (let k = 0; k < lines; k++) {
      const yy = fy + 42 + k * 46;
      ctx.font = `600 ${26 * (o.fs ?? 1)}px ${F.code}`; ctx.fillStyle = C.green; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      if (k % 3 === 0) ctx.fillText('$', fx + 22, yy);
      ctx.fillStyle = k % 3 === 0 ? 'rgba(30,27,24,0.55)' : 'rgba(30,27,24,0.25)';
      ctx.fillRect(fx + (k % 3 === 0 ? 52 : 22), yy - 16, Math.min(FW - 80, 160 + 260 * (0.5 + 0.5 * hash(k, o.seed ?? 11))), 14);
    }
    ctx.restore();
    if (o.frame > 0) {
      ctx.save(); ctx.globalAlpha *= o.frame; ctx.setLineDash([16, 10]); ctx.lineDashOffset = -t * 30;
      ctx.strokeStyle = C.red; ctx.lineWidth = 5; ctx.strokeRect(fx + 3, fy + 3, FW - 6, FH - 6); ctx.restore();
    }
  });
}
/** 放大镜：t0–t1 之间沿 pts 来回扫 */
function lens(pts, t0, t1, r = 90, up = false) {
  const a = clamp((t - t0) / 0.3) * (1 - clamp((t - t1) / 0.3));
  if (a <= 0) return;
  const u = 0.5 - 0.5 * Math.cos((t - t0) * 1.9), [x0, y0] = pts[0], [x1, y1] = pts[1];
  const x = lerp(x0, x1, u), y = lerp(y0, y1, u) + Math.sin((t - t0) * 3.1) * 20;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = 'rgba(255,252,245,0.28)'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 11; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.lineCap = 'round'; ctx.lineWidth = 24; const sy = up ? -1 : 1; ctx.beginPath(); ctx.moveTo(x + r * 0.72, y + sy * r * 0.72); ctx.lineTo(x + r * 1.5, y + sy * r * 1.5); ctx.stroke();   // 贴近字幕带时把柄朝上
  ctx.restore();
}
/** 窗口大小在两个矩形之间插值 */
const lerpRect = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
/** 空的虚线代码行（「从来没人写过的那一行」）；fill>0 时被填上 */
function missingLine(x, y, w, a, fill = 0) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  if (fill > 0) {

  const prevEnd = Math.max(...SENTS.filter(x => x.end <= s.t0).map(x => x.end));
  const inSent = SENTS.find(x => x.start < s.t0 && s.t0 < x.end);
  const next = SENTS.find(x => x.start >= s.t0);
  const c = { id: s.id, t: +s.t0.toFixed(3), afterEnd: +(s.t0 - prevEnd).toFixed(3), beforeStart: next ? +(next.start - s.t0).toFixed(3) : null };
  if (inSent || c.afterEnd < CUT_AFTER - 1e-6 || (next && c.beforeStart < CUT_BEFORE - 1e-6)) throw new Error(`切点 ${s.id} 不满足节奏参数：${JSON.stringify(c)}`);

});

/* ---------- 预览：空格播放（旁白 + 配乐），← → 跳 2 秒 ---------- */
function startPreview() {
  const hud = document.getElementById('hud'); hud.hidden = false;
  let actx = null, narr = null, srcs = [], playing = false, tt = 0, t0 = 0;
  const stop = () => { srcs.forEach(s => s.stop()); srcs = []; playing = false; };
  const play = async () => {
    actx ??= new AudioContext();
    narr ??= await actx.decodeAudioData(await (await fetch('narration/narration.mp3')).arrayBuffer());
    const mb = await music();
    if (tt >= TL.duration) tt = 0;
    srcs = [narr, mb].map(b => { const s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0, tt); return s; });
    t0 = actx.currentTime - tt; playing = true;
  };
  const toggle = () => (playing ? (tt = actx.currentTime - t0, stop()) : play());
  const jump = d => { const was = playing; if (playing) { tt = actx.currentTime - t0; stop(); } tt = clamp(tt + d, 0, TL.duration); if (was) play(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowLeft') jump(-2);
    if (e.code === 'ArrowRight') jump(2);
  });
  document.getElementById('hud-bar').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    jump((e.clientX - r.left) / r.width * TL.duration - (playing ? actx.currentTime - t0 : tt));
  });
  (function loop() {
    if (playing) { tt = actx.currentTime - t0; if (tt >= TL.duration) { tt = TL.duration; stop(); } }
    render(tt);
    document.getElementById('hud-play').textContent = playing ? '❚❚' : '▶ 空格播放';
    document.getElementById('hud-time').textContent = `${tt.toFixed(2)} / ${TL.duration.toFixed(2)}s`;
    hud.querySelector('.bar i').style.width = `${tt / TL.duration * 100}%`;
    requestAnimationFrame(loop);
  })();
}

await document.fonts.load(`600 46px ${F.zh}`, '原平台零行不等于零工作');
await document.fonts.load(`800 100px ${F.big}`);
await document.fonts.load(`600 30px ${F.ui}`);
await document.fonts.load(`500 30px ${F.code}`);
ctx.font = SUB_FONT;
for (const s of SUBS) s.width = Math.round(ctx.measureText(s.text).width);
render(0);
window.__debug = { buddies: BUDDIES, SUBS, SHOTS: SHOTS.map(s => ({ id: s.id, t0: s.t0, t1: s.t1 })), CUTS, T, SUB_MAX_W, SEGS: TL.segments.map(s => ({ id: s.id, start: s.start, end: s.end })) };
window.__video = {
  width: W, height: H, fps: FPS, duration: TL.duration,
  seek: render,
  renderAudio: async () => encodeWav(await music()),
};
if (!RENDER) startPreview();
</script>
</body>
</html>
