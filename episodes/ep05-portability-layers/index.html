<!doctype html>
<html lang="zh-CN">
<head>

<title>ep05 可移植性分层</title>
<style>

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud" hidden><span id="hud-play">▶ 空格播放</span><div class="bar" id="hud-bar"><i></i></div><span id="hud-time"></span></div>
<script type="module">
/*
 * ep05《可移植性分层：编译 → 链接 → 运行 → 绘制》（标题：编译通过了，为什么还是跑不起来？）
 *
 *   - 全部 Canvas 2D，画面是 t 的纯函数。纸剪 UI 来自 assets/lib/paper-kit.js，讲解员来自 paper-girl.js（纸片女孩，原方块小人版见 out/final-boxbuddy.mp4），
 *     配乐来自 lofi.js。时间轴 / 字幕 / 切点校验的写法与 ep02 相同。
 *   - 时间轴全部由 narration/timings.json 推出（按句）。kw(段, '关键词') 定位到句内按字数比例估时刻，
 *     落在「句末后 0.5s」之内的推到句末 + 0.5s（hold）。镜头切点 cutAfter()：离说完 ≥ 1.0s、离下一句开口 ≥ 0.3s（CUTS 校验）。
 *   - 开头没有口号和片头：第 0 帧就是「编译通过 ✓」的绿字 + 举旗的小人；前 3 秒内红叉铺满、「29 个失败」砸下来。
 *     系列名只在 s02 之后 1.5s 的无配音字卡上。
 *   - 主比喻「四道门」：编译 / 链接 / 运行 / 绘制。
 *   - 运镜：s02 从第一扇门拉远露出四扇门；s07–s09 顺着断掉的传话通道一层层往下俯冲；s09 推近工具箱；s14 再从第一扇门拉远。
 *   - 再抓回来：s06 29 个失败里 14 个拧成一根断管（~25%）、s09 工具箱没守住自己立的规矩（~50%）、s11 运气条 30% → 13%（~75%）。
 *   - 字幕按句切换，文字与 script.md 逐字一致（window.__debug.SUBS 可核对）。
 */
import { createKit, C, F, RAD, clamp, lerp, eo3, ei3, eio, eBack, hash, mulberry32 } from '../../assets/lib/paper-kit.js';
import { createBuddy as createGirl } from '../../assets/lib/paper-girl.js';
// 纸片女孩全片统一 s = 2.0（= girl-q/motion.mp4 里的大小，约占画高 45%；用户 2026-10-01 定）。
// 各镜头 path 里原来给方块小人写的 s 一律忽略，只用 x / y 站位；画在镜头缩放里的用 keepS 自己按 GIRL_S / 缩放 给 s。
const GIRL_S = 2.0;
const BUDDIES = [];   // 自查用：window.__debug.buddies 里每个讲解员的 state(t)（tools/render/pose-stats.mjs）
const createBuddy = (c, o) => { const b = createGirl(c, { ...o, path: o.keepS ? o.path : o.path.map(([t, x, y]) => [t, x, y, GIRL_S]) }); BUDDIES.push(b); return b; };
import { renderLofi, encodeWav } from '../../assets/lib/lofi.js';

const W = 1920, H = 1080, FPS = 30;
const RENDER = new URLSearchParams(location.search).get('render') === '1';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const K = createKit(ctx);
const { rr, circ, poly, paper, text, bigType, win } = K;
let t = 0;

/* ---------- 时间轴（旁白驱动，按句） ---------- */
const TL = await (await fetch('narration/timings.json', { cache: 'no-store' })).json();
const SEG = Object.fromEntries(TL.segments.map(s => [s.id, s]));
const seg = id => SEG[id] ?? (() => { throw new Error(`timings.json 里没有段落 ${id}`); })();
for (const s of TL.segments) {
  let off = 0;
  s.sents = (s.sentences ?? [{ text: s.text, start: s.start, end: s.end }]).map(x => {
    const i0 = s.text.indexOf(x.text, off);
    if (i0 < 0) throw new Error(`${s.id} 的句子对不上段落文本：${x.text}`);
    off = i0 + x.text.length;
    return { ...x, i0, i1: off };
  });
}
const SENT_ENDS = TL.segments.flatMap(s => s.sents.map(x => x.end));

/** 每个"字"的朗读权重：汉字 1；全大写缩写按字母数；其它英文词按音节粗估；逗号顿一下，句中冒号停久一点 */
function units(str) {
  const out = [];
  for (const m of str.matchAll(/[A-Za-z]+|[0-9]+|./gsu)) {
    const s = m[0];
    let w = 0;
    if (/^[A-Z]+$/.test(s)) w = s.length;
    else if (/^[A-Za-z]+$/.test(s)) w = Math.ceil(s.length / 3);
    else if (/^[0-9]+$/.test(s)) w = s.length;
    else if (/[一-鿿]/.test(s)) w = 1;
    else if ('，、'.includes(s)) w = 0.8;
    else if ('。？！：；'.includes(s)) w = 1.4;
    out.push([s, w, m.index]);
  }
  for (let k = out.length - 1; k >= 0 && !/[一-鿿A-Za-z0-9]/.test(out[k][0]); k--) out[k][1] = 0;
  return out;
}
function timeAt(id, idx) {
  const s = seg(id);
  const x = s.sents.find(x => idx < x.i1) ?? s.sents[s.sents.length - 1];
  const rel = idx - x.i0;
  let before = 0, total = 0;
  for (const [, w, i] of units(x.text)) { if (i < rel) before += w; total += w; }
  return x.start + (x.end - x.start) * (total ? before / total : 0);
}
function hold(tt) {
  for (const e of SENT_ENDS) if (tt > e + 1e-3 && tt < e + 0.5) return e + 0.5;
  return tt;
}
function kw(id, needle, end = false) {
  const i = seg(id).text.indexOf(needle);
  if (i < 0) throw new Error(`段落 ${id} 里没有「${needle}」`);
  return hold(timeAt(id, end ? i + needle.length : i));
}
const sent = (id, k) => seg(id).sents[k - 1];
const CUT_AFTER = 1.0, CUT_BEFORE = 0.3;
function cutAfter(id) {
  const i = TL.segments.findIndex(s => s.id === id), s = TL.segments[i], n = TL.segments[i + 1];
  const room = n ? n.start - s.end - CUT_AFTER - CUT_BEFORE : 0;
  return s.end + CUT_AFTER + Math.max(0, room) / 2;
}

/* ---------- 字幕：按句切换，文字与旁白逐字一致；长句在最靠中间的逗号处断开 ---------- */
const SUB_FONT = `600 46px ${F.zh}`, SUB_Y = 1012, SUB_MAX_W = 1760, SUB_MAX_CH = 26;
function splitLong(p) {
  if (Array.from(p).length <= SUB_MAX_CH) return [p];
  const cuts = [...p.matchAll(/[，、：；]/g)].map(m => m.index + 1).filter(c => c < p.length);
  if (!cuts.length) return [p];
  const mid = p.length / 2, c = cuts.reduce((a, b) => (Math.abs(b - mid) < Math.abs(a - mid) ? b : a));
  return [...splitLong(p.slice(0, c)), ...splitLong(p.slice(c))];
}
const SUBS = [];
for (const s of TL.segments) {
  s.sents.forEach((x, k) => {
    const chunks = splitLong(x.text);
    let idx = x.i0;
    const starts = chunks.map(c => { const tt = timeAt(s.id, idx); idx += c.length; return tt; });
    const next = s.sents[k + 1]?.start ?? TL.segments[TL.segments.indexOf(s) + 1]?.start ?? Infinity;
    chunks.forEach((c, i) => SUBS.push({ id: s.id, text: c, t0: starts[i], t1: i + 1 < chunks.length ? starts[i + 1] : Math.min(x.end + 0.3, next - 0.02) }));
  });
}
function drawSubtitle() {
  const s = SUBS.find(s => t >= s.t0 && t < s.t1);
  if (!s) return;
  const a = clamp((t - s.t0) / 0.12) * (1 - clamp((t - (s.t1 - 0.1)) / 0.1));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = SUB_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(245,239,226,0.92)'; ctx.lineWidth = 14; ctx.strokeText(s.text, 960, SUB_Y);
  ctx.fillStyle = C.ink; ctx.fillText(s.text, 960, SUB_Y);
  ctx.restore();
}

/* ---------- 共用小件 ---------- */
const ZH = F.zh;
function withCam(cx, cy, z, fn) { ctx.save(); ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function crayonLine(x0, y0, x1, y1, p, w = 12, col = C.red) {
  if (p <= 0) return;
  const x = lerp(x0, x1, p), y = lerp(y0, y1, p);
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
  ctx.globalAlpha *= 0.45; ctx.lineWidth = w * 0.45; ctx.strokeStyle = '#FFF4E8';
  ctx.beginPath(); ctx.moveTo(x0 + 3, y0 - 3); ctx.lineTo(x + 3, y - 3); ctx.stroke();
  ctx.restore();
}
function inkCircle(cx, cy, rx, ry, p, seed, col = C.red) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate((hash(seed, 1) * 6) * RAD);
  ctx.strokeStyle = col; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath();
  const a0 = -2.2 + hash(seed, 2) * 0.4, span = Math.PI * 2.15 * p;
  for (let i = 0; i <= 40; i++) {
    const a = a0 + span * i / 40, wob = 1 + 0.05 * Math.sin(a * 3 + seed);
    const x = Math.cos(a) * rx * wob, y = Math.sin(a) * ry * wob;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke(); ctx.restore();
}
function pill(x, y, label, col, seed, size = 30, o = {}) {
  ctx.font = `600 ${size}px ${ZH}`;
  const w = ctx.measureText(label).width + size * 1.2, h = size * 1.6;
  const x0 = o.center ? x - w / 2 : x;
  paper(rr(x0, y, w, h, h / 2, seed), [x0, y, w, h], { fill: col, lift: 0.4, seed, inkW: 2.4 });
  text(label, x0 + w / 2, y + h / 2 + 1, size, { align: 'center', base: 'middle', font: ZH, weight: 600, color: o.color ?? C.ink });
  return w;
}
function codeLine(s, x, y, size, o = {}) {
  ctx.font = `500 ${size}px ${F.code}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = o.color ?? C.ink; ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
function greenCheck(x, y, t0, seed, r = 38) {
  const ok = eBack(clamp((t - t0) / 0.25));
  if (ok <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(ok * r / 38, ok * r / 38);
  paper(circ(0, 0, 38, seed), [-38, -38, 76, 76], { fill: C.green, lift: 0.8, seed, inkW: 2.4 });
  ctx.strokeStyle = C.card; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-16, 1); ctx.lineTo(-4, 14); ctx.lineTo(17, -12); ctx.stroke();
  ctx.restore();
}
/** 红叉小卡（测试失败） */
function failTile(x, y, s, p, seed) {
  if (p <= 0) return;
  const k = eBack(p);
  ctx.save(); ctx.translate(x, y); ctx.rotate(hash(seed, 3) * 5 * RAD); ctx.scale(k * s, k * s);
  paper(rr(-30, -30, 60, 60, 8, seed, 0.6), [-30, -30, 60, 60], { fill: '#FBE3DC', lift: 0.6, seed, inkW: 2 });
  ctx.strokeStyle = C.red; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(14, 14); ctx.moveTo(14, -14); ctx.lineTo(-14, 14); ctx.stroke();
  ctx.restore();
}
function stamp(label, x, y, tt, rot = -8, col = C.red, size = 44) {
  const sp = eBack(clamp((t - tt) / 0.25));
  if (sp <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * RAD); ctx.scale(sp, sp);
  ctx.font = `600 ${size}px ${ZH}`;
  const sw = ctx.measureText(label).width + size;
  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.strokeRect(-sw / 2, -size * 0.86, sw, size * 1.6);
  text(label, 0, 0, size, { align: 'center', base: 'middle', font: ZH, weight: 600, color: col });
  ctx.restore();
}
function note(s, x, y, size, t0, o = {}) {
  const a = clamp((t - t0) / 0.3);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  text(s, x, y + (1 - eo3(a)) * 12, size, { font: ZH, weight: 600, color: C.mute, ...o });
  ctx.restore();
}
function handPos(st, side = 1) {
  if (st.hand) return st.hand;              // 纸片女孩：draw() 直接给手的画布坐标
  const [ox, oy] = side === 1 ? st.handR : st.handL;
  return [st.x + st.s * (side * (105 + 12) + ox), st.y + st.s * (-36 + st.dy - 128 * st.sqy * 0.45 + oy)];
}
/** 小旗：杆底在 (x, y)，droop 0..1 耷拉 */
function flag(x, y, droop, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -120); ctx.stroke();
  ctx.translate(0, -118); ctx.rotate(lerp(0, 68, droop) * RAD);
  const wave = Math.sin(t * 7) * 6 * (1 - droop);
  paper(poly([[0, 0], [86, 14 + wave], [0, 48]], 7, 0.5, 20), [0, 0, 86, 48], { fill: C.green, lift: 0.5, seed: 7, inkW: 2.2 });
  ctx.restore();
}

/* ---------- 门：中心 x、底边 y、宽高；open 0..1（门板向左翻开，露出门后）；inside(w,h) 画门后 ---------- */
function door(x, yb, w, h, o = {}) {
  const x0 = x - w / 2, y0 = yb - h, seed = o.seed ?? 1;
  // 门框
  paper(rr(x0 - 16, y0 - 16, w + 32, h + 16, 6, seed + 50, 0.6), [x0 - 16, y0 - 16, w + 32, h + 16], { fill: '#CDBFA6', lift: 0.8, seed: seed + 50, inkW: 2.6 });
  // 门后（开门后才看得见）
  const open = clamp(o.open ?? 0);
  if (open > 0) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
    ctx.fillStyle = o.dark ?? '#3A3430'; ctx.fillRect(x0, y0, w, h);
    ctx.translate(x0, y0);
    o.inside?.(w, h);
    ctx.restore();
  }
  // 门板：以左边为轴翻开 → 画成越来越窄的梯形
  const pw = w * (1 - 0.82 * eio(open)), skew = h * 0.06 * eio(open);
  const panel = poly([[x0, y0], [x0 + pw, y0 - skew], [x0 + pw, yb + skew], [x0, yb]], seed, 0.5, 30);
  paper(panel, [x0, y0 - skew, Math.max(pw, 4), h + 2 * skew], { fill: o.col ?? C.faint, lift: 0.6 + open, seed, inkW: 2.6 });
  if (pw > w * 0.4) {
    const kx = x0 + pw - 34 * (pw / w), ky = y0 + h * 0.55;
    paper(circ(kx, ky, 12, seed + 3), [kx - 12, ky - 12, 24, 24], { fill: C.mustard, lift: 0.3, seed: seed + 3, inkW: 2 });
    if (o.panel) { ctx.save(); ctx.translate(x0, y0); ctx.transform(pw / w, -skew / w, 0, 1, 0, 0); o.panel(w, h); ctx.restore(); }
  }
}
/** 门牌：门顶上方的小纸牌 */
function plate(x, y, label, a, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(a * 3); ctx.translate(x, y - (1 - eBack(clamp(a))) * 30);
  pill(0, 0, label, o.fill ?? C.card, o.seed ?? 3, o.size ?? 40, { center: true, color: o.color });
  ctx.restore();
}
const DOOR_NAMES = ['编译', '链接', '运行', '绘制'];
const ROW = { xs: [320, 710, 1100, 1490], yb: 820, w: 300, h: 480 };
/** 四扇门一排：st = { plates:[a0..a3], green:[bool..], q:[a..], glow:[..], open:[..] } */
function doorRow(st) {
  ROW.xs.forEach((x, i) => {
    const green = st.green?.[i];
    door(x, ROW.yb, ROW.w, ROW.h, {
      seed: 200 + i * 7, col: green ? C.mint : C.faint, open: st.open?.[i] ?? 0,
      panel: (w, h) => {
        if (i === 0 && st.sign) {                      // 第一扇门上贴着那行绿字
          paper(rr(22, 90, w - 44, 150, 10, 211), [22, 90, w - 44, 150], { fill: '#2A2623', lift: 0.5, seed: 211, inkW: 2.2 });
          text('编译通过 ✓', w / 2, 170, 44, { align: 'center', base: 'middle', font: ZH, weight: 700, color: '#7FD08F' });
        }
        const q = st.q?.[i] ?? 0;
        if (q > 0) { ctx.save(); ctx.globalAlpha *= q; text('？', w / 2, h * 0.42, 150, { align: 'center', base: 'middle', font: ZH, weight: 800, color: 'rgba(30,27,24,0.28)' }); ctx.restore(); }
      },
    });
    plate(x, ROW.yb - ROW.h - 100, DOOR_NAMES[i], st.plates?.[i] ?? 0, { fill: green ? C.mint : C.card, seed: 230 + i });
    const g = st.glow?.[i] ?? 0;
    if (g > 0) { ctx.save(); ctx.globalAlpha = g * (0.8 + 0.2 * Math.sin(t * 6)); ctx.strokeStyle = C.orange; ctx.lineWidth = 10; ctx.strokeRect(x - ROW.w / 2 - 26, ROW.yb - ROW.h - 26, ROW.w + 52, ROW.h + 26); ctx.restore(); }
  });
  ctx.save(); ctx.strokeStyle = 'rgba(30,27,24,0.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(90, ROW.yb + 4); ctx.lineTo(1830, ROW.yb + 4); ctx.stroke(); ctx.restore();
}

/* ================================================================
 * 时刻表（全部从 timings.json 推出）
 * ================================================================ */
const T = {};
for (const s of TL.segments) T[s.id] = s;
T.cut = Object.fromEntries(TL.segments.map(s => [s.id, cutAfter(s.id)]));
T.card0 = T.s02.end + 1.1; T.card1 = T.card0 + 1.5;               // s02 说完 1.1s 后 1.5s 无配音系列字卡
T.end0 = T.s14.end + 2.8; T.end1 = TL.duration;                   // 最后一句说完画面停 2.8s，再接结尾字卡到片尾
// s01 钩子：前 3 秒内红叉铺满、「29 个失败」砸下（不等旁白说到，front load）
T.run = 1.35;                                                     // 「运行测试 …」出现
T.flood = 2.2;                                                    // 红叉铺满
T.n29 = 2.75;                                                     // 「29 个失败」砸下
T.win1 = kw('s01', '真的 Windows');
T.say29 = kw('s01', '二十九个测试');
// s02
T.gate1 = kw('s02', '只是第一道门');
T.four = kw('s02', '得连过四道门');
T.names = ['编译、', '链接、', '运行、', '绘制'].map(n => kw('s02', n));
// s03
T.ex = ['编译，是', '链接，是', '运行，是', '绘制，是'].map(n => kw('s03', n));
// s04
T.block = kw('s04', '都把后面的问题'); T.push = kw('s04', '不推开这一道'); T.see = kw('s04', '看不见');
// s05
T.polter = kw('s05', 'Polter'); T.errs = kw('s05', '只报了几个错'); T.own = kw('s05', '全在自己写的代码里');
T.fix = kw('s05', '修好之后'); T.miss = kw('s05', '拼零件时'); T.patch = kw('s05', '也补上了'); T.two = kw('s05', '前两道门');
// s06
T.test6 = kw('s06', '直到测试'); T.fail6 = kw('s06', '二十九个失败'); T.half = kw('s06', '将近一半');
T.same = kw('s06', '卡在同一件事上'); T.pipe6 = kw('s06', '程序之间传话');
// s07–s09 往下挖
T.dig = kw('s07', '他们一层一层往下挖'); T.l1 = kw('s07', '第一层'); T.sw = kw('s07', '有个开关'); T.off = kw('s07', '悄悄把这条通道关掉了');
T.on = kw('s08', '把开关打开'); T.crash = kw('s08', '就崩了'); T.calm = kw('s08', '别慌'); T.deeper = kw('s08', '是又挖深了一层');

  y = mv(T.dig + 0.2, 1.8, DIG.surf, DIG.l1, y);

  const cam = doorsCam(T.truth - 0.2, T.onlyFirst + 0.2);
  withCam(cam[0], cam[1], cam[2], () => {
    doorRow({
      sign: true, green: [true, false, false, false], plates: [1, 1, 1, 1],
      q: [0, 1, 1, 1],
      glow: [0, 1, 2, 3].map(i => (i ? clamp((t - T.onlyFirst - 0.5 - i * 0.35) / 0.3) : clamp((t - T.truth) / 0.3) * (1 - clamp((t - T.onlyFirst - 0.3) / 0.3)))),
    });
  });
  buddy14.draw(t, { alpha: clamp((t - T.onlyFirst - 0.1) / 0.5) });
}

/* ---------- 结尾字卡 ---------- */
function shotEnd() {
  const p = eo3(clamp((t - T.end0) / 0.2));
  ctx.save(); ctx.globalAlpha = p;
  pill(960, 380, '下一集', C.mustard, 99, 34, { center: true });
  text('平台惯例不是字符串替换', 960, 560, 72, { align: 'center', base: 'middle', font: ZH, weight: 600 });
  ctx.restore();
}

/* ---------- 镜头表：切点在段间静音里，离上一句说完 ≥ 1.0s、离下一句开口 ≥ 0.3s（下面 CUTS 校验） ---------- */
const SHOTS = [
  { id: 'hook', t0: 0, draw: shotHook },
  { id: 'doors', t0: T.cut.s01, draw: shotDoors },
  { id: 'card', t0: T.card0, draw: shotCard },
  { id: 'explain', t0: T.card1, draw: shotExplain },
  { id: 'block', t0: T.cut.s03, draw: shotBlock },
  { id: 'compile', t0: T.cut.s04, draw: shotCompile },
  { id: 'realrun', t0: T.cut.s05, draw: shotRealRun },
  { id: 'dig', t0: T.cut.s06, draw: shotDig },
  { id: 'pipe', t0: T.cut.s09, draw: shotPipe },
  { id: 'odds', t0: T.cut.s10, draw: shotOdds },
  { id: 'report', t0: T.cut.s12, draw: shotReport },
  { id: 'back', t0: T.cut.s13, draw: shotBack },
  { id: 'end', t0: T.end0, draw: shotEnd },
];
SHOTS.forEach((s, i) => { s.t1 = SHOTS[i + 1]?.t0 ?? Infinity; });
const SENTS = TL.segments.flatMap(s => s.sents);
const CUTS = SHOTS.slice(1).map(s => {
  const prevEnd = Math.max(...SENTS.filter(x => x.end <= s.t0).map(x => x.end));
  const inSent = SENTS.find(x => x.start < s.t0 && s.t0 < x.end);
  const next = SENTS.find(x => x.start >= s.t0);
  const c = { id: s.id, t: +s.t0.toFixed(3), afterEnd: +(s.t0 - prevEnd).toFixed(3), beforeStart: next ? +(next.start - s.t0).toFixed(3) : null };
  if (inSent || c.afterEnd < CUT_AFTER - 1e-6 || (next && c.beforeStart < CUT_BEFORE - 1e-6)) throw new Error(`切点 ${s.id} 不满足节奏参数：${JSON.stringify(c)}`);
  return c;
});
if (T.end0 - T.s14.end < 2.5 || TL.duration - T.end0 < 2.5) throw new Error('结尾停留 / 结尾字卡不足 2.5s');

// 交互音效（和画面同一张时刻表）
const SFX = [
  { t: T.flood, kind: 'snip' }, { t: T.n29, kind: 'boing' },
  { t: T.gate1 - 0.2, kind: 'whoosh' }, ...T.names.map(tt => ({ t: tt, kind: 'pop' })),
  { t: T.card0, kind: 'whoosh' },
  ...T.ex.map(tt => ({ t: tt, kind: 'click' })),
  { t: T.push + 0.2, kind: 'whoosh' }, { t: T.see, kind: 'pop' },
  { t: T.errs, kind: 'pop' }, { t: T.fix + 0.2, kind: 'snip' }, { t: T.patch, kind: 'click' }, { t: T.two + 0.45, kind: 'ding' },
  { t: T.fail6, kind: 'boing' }, { t: T.same, kind: 'whoosh' },
  { t: T.dig + 0.2, kind: 'whoosh' }, { t: T.on + 0.1, kind: 'click' }, { t: T.crash, kind: 'snip' }, { t: T.deeper + 0.2, kind: 'ding' },
  { t: T.dig3, kind: 'whoosh' }, { t: T.rule, kind: 'boing' },
  { t: T.detour, kind: 'whoosh' }, { t: T.newpipe, kind: 'click' }, { t: T.nochange + 0.2, kind: 'ding' }, { t: T.lock, kind: 'click' }, { t: T.port + 0.6, kind: 'snip' },
  { t: T.p30, kind: 'pop' }, { t: T.p13, kind: 'whoosh' }, { t: T.all5 + 0.1, kind: 'ding' },
  { t: T.only + 0.2, kind: 'snip' }, { t: T.say, kind: 'pop' },
  { t: T.onlyFirst + 0.85, kind: 'pop' },
];

/* ---------- seek：t 的纯函数 ---------- */
function render(tt) {
  t = Math.max(0, Math.min(TL.duration, tt));
  K.setTime(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  K.drawBG();
  const shot = SHOTS.find(s => t >= s.t0 && t < s.t1) ?? SHOTS[SHOTS.length - 1];
  const since = t - shot.t0;
  const z = shot.t0 > 0 ? 1 + 0.015 * Math.exp(-since * 12) : 1;
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  shot.draw();
  ctx.restore();
  drawSubtitle();
}

/* ---------- 配乐 ---------- */
let musicBuf = null;
const music = async () => (musicBuf ??= await renderLofi({
  duration: TL.duration,
  speech: TL.segments.map(s => [s.start, s.end]),
  speechDb: TL.speech_mean_db ?? -21,
  bright: [[0, 3.0], [T.card0, T.card1], [T.end0, TL.duration]],
  sfx: SFX,
}));
/* ---------- 预览：空格播放（旁白 + 配乐），← → 跳 2 秒 ---------- */
function startPreview() {
  const hud = document.getElementById('hud'); hud.hidden = false;
  let actx = null, narr = null, srcs = [], playing = false, tt = 0, t0 = 0;
  const stop = () => { srcs.forEach(s => s.stop()); srcs = []; playing = false; };
  const play = async () => {
    actx ??= new AudioContext();
    narr ??= await actx.decodeAudioData(await (await fetch('narration/narration.mp3')).arrayBuffer());
    const mb = await music();
    if (tt >= TL.duration) tt = 0;
    srcs = [narr, mb].map(b => { const s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0, tt); return s; });
    t0 = actx.currentTime - tt; playing = true;
  };
  const toggle = () => (playing ? (tt = actx.currentTime - t0, stop()) : play());
  const jump = d => { const was = playing; if (playing) { tt = actx.currentTime - t0; stop(); } tt = clamp(tt + d, 0, TL.duration); if (was) play(); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'ArrowLeft') jump(-2);
    if (e.code === 'ArrowRight') jump(2);
  });
  document.getElementById('hud-bar').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    jump((e.clientX - r.left) / r.width * TL.duration - (playing ? actx.currentTime - t0 : tt));
  });
  (function loop() {
    if (playing) { tt = actx.currentTime - t0; if (tt >= TL.duration) { tt = TL.duration; stop(); } }
    render(tt);
    document.getElementById('hud-play').textContent = playing ? '❚❚' : '▶ 空格播放';
    document.getElementById('hud-time').textContent = `${tt.toFixed(2)} / ${TL.duration.toFixed(2)}s`;
    hud.querySelector('.bar i').style.width = `${tt / TL.duration * 100}%`;
    requestAnimationFrame(loop);
  })();
}

await document.fonts.load(`600 46px ${F.zh}`, '编译通过了为什么还是跑不起来');
await document.fonts.load(`800 100px ${F.big}`);
await document.fonts.load(`600 30px ${F.ui}`);
await document.fonts.load(`500 30px ${F.code}`);
ctx.font = SUB_FONT;
for (const s of SUBS) s.width = Math.round(ctx.measureText(s.text).width);
render(0);
window.__debug = { buddies: BUDDIES, SUBS, SHOTS: SHOTS.map(s => ({ id: s.id, t0: s.t0, t1: s.t1 })), CUTS, T, SUB_MAX_W, kw, SEGS: TL.segments.map(s => ({ id: s.id, start: s.start, end: s.end })) };
window.__video = {
  width: W, height: H, fps: FPS, duration: TL.duration,
  seek: render,
  renderAudio: async () => encodeWav(await music()),
};
if (!RENDER) startPreview();
</script>
