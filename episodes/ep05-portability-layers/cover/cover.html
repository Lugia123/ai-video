<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ep05 封面</title>
<style>
  html, body { margin: 0; background: #EFE7D6; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
/*
 * ep05 封面：一排四扇纸门，第一扇绿门贴着「编译 ✓」，最远那扇门缝里透出红光「29 个失败」；小人举着小旗站在门边回头一愣。
 *   ?ratio=4x3  → 1440×1080（横版）
 *   ?ratio=16x9 → 1920×1080（宽版：标题放大压在上方，下方主画面横向铺开）
 *   ?ratio=9x16 → 1080×1920（竖版：上标题、中间四扇门、下小人）
 * 导出：node tools/cover/cover.mjs episodes/ep05-portability-layers
 * 页面画完后置 window.__coverReady = true。
 */
import { createKit, C, F, RAD, clamp, lerp, eo3, hash, mulberry32 } from '../../../assets/lib/paper-kit.js';
import { createBuddy } from '../../../assets/lib/paper-girl.js';   // 纸片女孩 s=2.0（原方块小人版封面见 _boxbuddy/）

const RATIO = new URLSearchParams(location.search).get('ratio') ?? '4x3';
const V = RATIO === '9x16', WIDE = RATIO === '16x9';
const W = V ? 1080 : WIDE ? 1920 : 1440, H = V ? 1920 : 1080;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const K = createKit(ctx, { W, H, bgSeed: 505, creases: V ? [[-10, 1180, 1090, 1230]] : WIDE ? [[-10, 610, 1930, 650]] : [[-10, 610, 1450, 650]] });
const { rr, paper, text, poly } = K;
const ZH = F.zh;

/* ---------- 版式 ---------- */
const L = V ? {
  title: [{ x: 540, y: 330, align: 'center', size: 150 }, { x: 540, y: 500, align: 'center', size: 92 }],
  doors: { xs: [180, 420, 660, 900], yb: 1380, w: 205, h: 580 },
  buddy: { x: 540, y: 1880, s: 2.0 },
  tape: { x: 30, y: 60, rot: -4 },
} : WIDE ? {
  title: [{ x: 80, y: 235, align: 'left', size: 170 }, { x: 86, y: 395, align: 'left', size: 104 }],
  doors: { xs: [240, 540, 840, 1140], yb: 985, w: 240, h: 430 },
  buddy: { x: 1560, y: 985, s: 2.0 },
  tape: { x: 1500, y: 44, rot: 5 },
} : {
  title: [{ x: 70, y: 215, align: 'left', size: 150 }, { x: 76, y: 355, align: 'left', size: 92 }],
  doors: { xs: [170, 430, 690, 950], yb: 985, w: 210, h: 420 },
  buddy: { x: 1250, y: 985, s: 2.0 },
  tape: { x: 1060, y: 40, rot: 5 },
};

/* ---------- 门 ---------- */
function door(x, yb, w, h, o = {}) {
  const x0 = x - w / 2, y0 = yb - h, seed = o.seed ?? 1;
  paper(rr(x0 - 14, y0 - 14, w + 28, h + 14, 6, seed + 50, 0.6), [x0 - 14, y0 - 14, w + 28, h + 14], { fill: '#CDBFA6', lift: 1, seed: seed + 50, inkW: 2.6 });
  const open = o.open ?? 0;
  if (open > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
    ctx.fillStyle = C.red; ctx.fillRect(x0, y0, w, h);
    const g = ctx.createRadialGradient(x0 + w * 0.7, y0 + h * 0.5, 10, x0 + w * 0.7, y0 + h * 0.5, h * 0.7);
    g.addColorStop(0, 'rgba(255,220,180,0.55)'); g.addColorStop(1, 'rgba(120,20,10,0.4)');
    ctx.fillStyle = g; ctx.fillRect(x0, y0, w, h);
    o.inside?.(x0, y0, w, h);
    ctx.restore();
  }
  const pw = w * (1 - 0.82 * open), skew = h * 0.06 * open;
  paper(poly([[x0, y0], [x0 + pw, y0 - skew], [x0 + pw, yb + skew], [x0, yb]], seed, 0.5, 30), [x0, y0 - skew, pw, h + 2 * skew], { fill: o.col ?? C.faint, lift: 0.8 + open, seed, inkW: 2.6 });
  if (open < 0.3) paper(K.circ(x0 + pw - 28, y0 + h * 0.55, 11, seed + 3), [x0 + pw - 39, y0 + h * 0.55 - 11, 22, 22], { fill: C.mustard, lift: 0.3, seed: seed + 3, inkW: 2 });
  o.panel?.(x0, y0, pw, h);
}
function drawDoors(o) {
  ctx.strokeStyle = 'rgba(30,27,24,0.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(o.xs[0] - 160, o.yb + 4); ctx.lineTo(o.xs[3] + 160, o.yb + 4); ctx.stroke();
  const names = ['编译', '链接', '运行', '绘制'];
  o.xs.forEach((x, i) => {
    door(x, o.yb, o.w, o.h, {
      seed: 200 + i * 7, col: i === 0 ? C.mint : C.faint, open: i === 3 ? 0.8 : 0,
      panel: (x0, y0, pw, h) => {
        if (i === 0) {
          paper(rr(x0 + 14, y0 + 70, pw - 28, 100, 10, 211), [x0 + 14, y0 + 70, pw - 28, 100], { fill: '#2A2623', lift: 0.5, seed: 211, inkW: 2.2 });
          text('编译 ✓', x0 + pw / 2, y0 + 122, 44, { align: 'center', base: 'middle', font: ZH, weight: 800, color: '#7FD08F' });
        } else if (i < 3) text('？', x0 + pw / 2, y0 + h * 0.42, 110, { align: 'center', base: 'middle', font: ZH, weight: 800, color: 'rgba(30,27,24,0.25)' });
      },
      inside: (x0, y0, w, h) => {
        ctx.save(); ctx.translate(x0 + w * 0.68, y0 + h * 0.45); ctx.rotate(-6 * RAD);
        text('29', 0, 0, 96, { align: 'center', base: 'middle', font: F.big, weight: 800, color: C.card });
        text('个失败', 0, 80, 32, { align: 'center', base: 'middle', font: ZH, weight: 700, color: C.card });
        ctx.restore();
      },
    });
    const py = o.yb - o.h - 70;
    ctx.font = `600 36px ${ZH}`; const pw = ctx.measureText(names[i]).width + 44;
    paper(rr(x - pw / 2, py, pw, 56, 28, 230 + i), [x - pw / 2, py, pw, 56], { fill: i === 0 ? C.mint : C.card, lift: 0.4, seed: 230 + i, inkW: 2.2 });
    text(names[i], x, py + 29, 36, { align: 'center', base: 'middle', font: ZH, weight: 600 });
  });
}
function flag(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -130); ctx.stroke();
  paper(poly([[0, -128], [92, -110], [0, -76]], 7, 0.5, 20), [0, -128, 92, 52], { fill: C.green, lift: 0.5, seed: 7, inkW: 2.2 });
  ctx.restore();
}

/* ---------- 主标题：纸剪字——白纸描边 + 投影 + 错位色版；数字用红/绿强调 ---------- */
const fontOf = (p, size) => p.num ? `800 ${size * 1.12}px ${F.big}` : `600 ${size}px ${ZH}`;
function paperType(parts, x, y, size, align) {
  const widths = parts.map(p => { ctx.font = fontOf(p, size); return ctx.measureText(p.s).width; });
  const total = widths.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  const x0 = cx;
  ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  // 1. 整行白纸底（带投影），2. 错位色版，3. 墨色字
  for (const pass of [0, 1, 2]) {
    cx = x0;
    parts.forEach((p, i) => {
      ctx.font = fontOf(p, size);
      if (pass === 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(70,48,25,0.38)'; ctx.shadowBlur = 14; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 10;
        ctx.strokeStyle = C.card; ctx.lineWidth = size * 0.2; ctx.strokeText(p.s, cx, y);
        ctx.restore();
      } else if (pass === 1) {
        ctx.fillStyle = p.col && p.col !== C.mute ? C.ink : C.mustard;
        ctx.fillText(p.s, cx + size * 0.04, y + size * 0.04);
      } else {
        ctx.fillStyle = p.col ?? C.ink; ctx.fillText(p.s, cx, y);
      }
      cx += widths[i];
    });
  }
  ctx.restore();
  return { x0, x1: x0 + total };
}

/* ---------- 系列标签：斜贴的纸胶带 ---------- */
function tape(o) {
  const label = '移植不是翻译 · 05';
  ctx.font = `600 34px ${ZH}`;
  const w = ctx.measureText(label).width + 70, h = 64;
  ctx.save(); ctx.translate(o.x + w / 2, o.y + h / 2); ctx.rotate(o.rot * RAD);
  // 胶带两端锯齿
  const p = new Path2D(), r = mulberry32(77);
  p.moveTo(-w / 2, -h / 2);
  p.lineTo(w / 2, -h / 2);
  for (let k = 0; k <= 8; k++) p.lineTo(w / 2 + (k % 2 ? -7 : 0) + (r() - 0.5) * 3, -h / 2 + h * k / 8);
  p.lineTo(-w / 2, h / 2);
  for (let k = 8; k >= 0; k--) p.lineTo(-w / 2 + (k % 2 ? 7 : 0) + (r() - 0.5) * 3, -h / 2 + h * k / 8);
  p.closePath();
  paper(p, [-w / 2, -h / 2, w, h], { fill: 'rgba(240,180,60,0.88)', lift: 0.5, seed: 141, ink: false });
  text(label, 0, 2, 34, { align: 'center', base: 'middle', font: ZH, weight: 600 });
  ctx.restore();
}

/* ---------- 主标题 ---------- */
const TITLE = [
  [{ s: '编译通过', col: C.green }, { s: '了，' }],
  [{ s: '为什么还是' }, { s: '跑不起来', col: C.red }, { s: '？' }],
];

const buddy = createBuddy(ctx, {
  path: [[0, L.buddy.x, L.buddy.y, L.buddy.s]],
  acts: [{ type: 'startle', t0: 3.0 }, { type: 'look', t0: 0, t1: 99, at: [L.doors.xs[3], L.buddy.y - 300] }],
});

await document.fonts.load(`600 150px ${ZH}`, '编译通过了，为什么还是跑不起来？移植不是翻译链接运行绘制个失败');
await document.fonts.load(`800 120px ${F.big}`);
K.setTime(0);
K.drawBG();
tape(L.tape);
drawDoors(L.doors);
// 纸片女孩：吓一跳（举手的小旗去掉，吃惊脸 + 举起的双手已经够了）
buddy.draw(3.35);
TITLE.forEach((parts, i) => paperType(parts, L.title[i].x, L.title[i].y, L.title[i].size, L.title[i].align));
ctx.font = `600 ${L.title[0].size}px ${ZH}`;
const m = ctx.measureText('编译通过了');
window.__coverInfo = { W, H, titleInkH: Math.round(m.actualBoundingBoxAscent + m.actualBoundingBoxDescent), minH: Math.round(H * (V ? 0.06 : 0.09)) };
window.__coverReady = true;
</script>
</body>
</html>
