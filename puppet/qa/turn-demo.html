<!doctype html>
<meta charset="utf-8">
<title>转头演示</title>
<style>html,body{margin:0;background:#f3f8fb}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// 4 秒：左右转头 → 点头 → 歪头，只画头（引擎直接画，不经过讲解员）。画面是 t 的纯函数。?pack=…
import { createPuppet } from '../engine/index.js';
const Q = new URLSearchParams(location.search), c = document.getElementById('c'), ctx = c.getContext('2d'), W = 1920, H = 1080;
const p = await createPuppet('../' + (Q.get('pack') || 'characters/beret-girl/'), { width: W, height: H });
const u = p.character.unit, k = 0.7, place = { x: W / 2 - u.headCenter[0] * k, y: H / 2 + 40 - u.headCenter[1] * k, scale: k };
const ss = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
const key = (t, ks) => { if (t <= ks[0][0]) return ks[0][1]; for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) { const [a, va] = ks[i - 1], [b, vb] = ks[i]; return va + (vb - va) * ss((t - a) / (b - a)); } return ks.at(-1)[1]; };
const LIM = Object.fromEntries(p.character.parameters.map(q => [q.id, q]));
// 读数显示实际生效的角度；要求的值超出数据包限幅时写成「实际/要求」
const show = (id, want) => { const got = p.get(id), f = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(0) + '°'; return Math.abs(got - want) > 0.5 ? `${f(got)}/${f(want)}` : f(got); };
function seek(t) {
  const v = { ParamAngleX: key(t, [[0.1, 0], [0.6, -30], [1.4, 30], [1.9, 0]]), ParamAngleY: key(t, [[2.0, 0], [2.4, -30], [2.9, 30], [3.2, 0]]), ParamAngleZ: key(t, [[3.2, 0], [3.5, 30], [3.8, -30], [4, 0]]) };
  p.set(v);
  ctx.fillStyle = '#f3f8fb'; ctx.fillRect(0, 0, W, H); p.draw(ctx, place);
  ctx.fillStyle = '#1e2a4a'; ctx.font = '28px "PingFang SC", "Heiti SC", sans-serif';
  ctx.fillText(`只画头 · 转头 ${show('ParamAngleX', v.ParamAngleX)}   点头 ${show('ParamAngleY', v.ParamAngleY)}   歪头 ${show('ParamAngleZ', v.ParamAngleZ)}`, 40, 56);
  ctx.font = '22px "PingFang SC", "Heiti SC", sans-serif'; ctx.fillStyle = '#5A6B86';
  ctx.fillText(`各层按深度平移；点头整头一体（数据包限幅 ±${LIM.ParamAngleY.max}°）。读数是实际生效的角度，超出限幅时写成 实际/要求。`, 40, 92);
}
seek(0);
window.__video = { width: W, height: H, fps: 30, duration: 4, seek };
if (Q.get('render') !== '1') { let t0; const loop = now => { t0 ??= now; seek(((now - t0) / 1000) % 4); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
