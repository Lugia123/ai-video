<style>

<div id="stage">

<script type="module">

  eye_white_R: '眼白 右', iris_R: '瞳 右', eye_highlight_R: '高光 右', lash_lower_R: '下睫毛 右', lash_R: '上睫毛 右', lid_R: '眼睑 右', eye_white_L: '眼白 左', iris_L: '瞳 左', eye_highlight_L: '高光 左', lash_lower_L: '下睫毛 左', lash_L: '上睫毛 左', lid_L: '眼睑 左', brow_R: '眉 右', brow_L: '眉 左' };

// ---------- 场景 ----------
let BODY = [0, 0, CW, CH]; const RAIL = [0, 0];

  const k = 0.25, c = document.createElement('canvas'); c.width = Math.ceil(w * k); c.height = Math.ceil(h * k); const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(im, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height).data; let x0 = c.width, x1 = 0, y0 = c.height, y1 = 0;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 16) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }

    const M = l.mesh, sx = Math.max(1, Math.ceil(M.gx / 24)), sy = Math.max(1, Math.ceil(M.gy / 16)); l.tris = []; l.gridStep = [sx, sy];          // 网格很密时隔行隔列取点（最多约 24×16 格）

    for (let j = 0; j < M.gy; j += sy) for (let i = 0; i < M.gx; i += sx) for (const t of [[V(i, j), V(i + sx, j), V(i, j + sy)], [V(i + sx, j), V(i + sx, j + sy), V(i, j + sy)]]) {

    }

  }

    if (l.full) { const b = alphaBox(im, w, h); l.rect = [b[0], b[1], b[2], b[3]]; e.style.overflow = 'hidden'; im.style.left = -b[0] + 'px'; im.style.top = -b[1] + 'px'; if (l.id === 'base') BODY = b; }          // 整幅的层（身体、手臂）：片只取不透明的那一块，位置不变
    im.style.width = w + 'px'; im.style.height = h + 'px'; e.appendChild(im); }
  e.style.width = l.rect[2] + 'px'; e.style.height = l.rect[3] + 'px';
  scene.appendChild(e); l.e = e;
}
{ const hb = PARTS.filter(p => p.group === 'head').reduce((b, p) => [Math.min(b[0], p.rect[0]), Math.min(b[1], p.rect[1]), Math.max(b[2], p.rect[0] + p.rect[2]), Math.max(b[3], p.rect[1] + p.rect[3])], [1e9, 1e9, 0, 0]);
  const x0 = Math.min(hb[0], BODY[0]) - 40, y0 = Math.min(hb[1], BODY[1]) - 40, x1 = Math.max(hb[2], BODY[0] + BODY[2]) + 40, y1 = Math.max(hb[3], BODY[1] + BODY[3]) + 40;
  RAIL[0] = x1 + 90; RAIL[1] = y0 - 110;
  for (const l of L) if (l.id === 'ov-back' || l.id === 'ov-top') { l.rect = [x0, y0, x1 - x0, y1 - y0]; l.e.style.width = l.rect[2] + 'px'; l.e.style.height = l.rect[3] + 'px'; } }
const mkPlane = cls => { const e = document.createElement('div'); e.className = 'layer ' + cls; e.style.width = CW * 0.74 + 'px'; e.style.height = CH * 0.76 + 'px'; scene.appendChild(e); return e; };
const zeroPlane = mkPlane(PIVOT != null ? 'axis' : 'plane'), axisPlane = null;
L.forEach(l => { const d = document.createElement('div'); d.className = 'lab'; const f = v => v == null ? '—' : (+v).toFixed(2).replace(/\.?0+$/, '') || '0';
  const dep = l.mesh ? `${f(l.mesh.min)}…${f(l.mesh.max)}` : f(l.depth);
  d.innerHTML = `<span class="n">${l.i + 1}</span><b>${l.name}</b> <span class="f">${l.file}</span> · <span class="d">横 ${dep} / 纵 ${f(l.depthY)}</span> · <span class="g">${l.follow}</span>`;
  d.onclick = () => { l.hidden = !l.hidden; d.classList.toggle('off', l.hidden); redraw(); }; d.onmouseenter = () => { HOVER = l; redraw(); }; d.onmouseleave = () => { HOVER = null; redraw(); };
  labels.appendChild(d); l.lab = d; });
let HOVER = null;

// ---------- 投影（自己算，层和标签引线用同一套矩阵） ----------

{ const wt = L.map(l => l.rect[2] * l.rect[3] > 250000 ? 1 : 0.28); let acc = 0; const zs = L.map((l, k) => { if (k) acc += (wt[k - 1] + wt[k]) / 2; return acc; }); L.forEach((l, k) => { l.zo = (zs[k] / acc - 0.5) * ZA; }); }

  const place = (e, x, y, z) => { e.style.transform = css(mul(cam, T(x - CW / 2, y - CH / 2, z))); };
  for (const l of L) {
    const z = zOf(l), [x, y, w, h] = l.rect, vis = !l.hidden; l.lab.classList.toggle('hi', HOVER === l);

      const M = l.mesh, P = []; for (let j = 0; j <= M.gy; j++) { P.push([]); for (let i = 0; i <= M.gx; i++) { const d = M.d[j][i]; P[j].push(proj(cam, x + w * i / M.gx + dxOf(l, d) - CW / 2, y + h * j / M.gy - CH / 2, zOf(l, d))); } }

        const du1 = u1[0] - u0[0], dv1 = u1[1] - u0[1], du2 = u2[0] - u0[0], dv2 = u2[1] - u0[1], det = du1 * dv2 - du2 * dv1;          // 贴图三角形 → 屏幕三角形的仿射

      if (vis) { const [sx, sy] = l.gridStep; over.strokeStyle = HOVER === l ? '#D6336C' : 'rgba(214,51,108,0.38)'; over.lineWidth = HOVER === l ? 2 : 0.8; over.beginPath();          // 网格线：画在最上面，看得出这是一张弯的面
        for (let j = 0; j <= M.gy; j += sy) { const jj = Math.min(j, M.gy); P[jj].forEach((q, i) => i ? over.lineTo(q[0], q[1]) : over.moveTo(q[0], q[1])); if (jj === M.gy) break; if (j + sy > M.gy) j = M.gy - sy; }
        for (let i = 0; i <= M.gx; i += sx) { const ii = Math.min(i, M.gx); for (let j = 0; j <= M.gy; j++) j ? over.lineTo(P[j][ii][0], P[j][ii][1]) : over.moveTo(P[j][ii][0], P[j][ii][1]); if (ii === M.gx) break; if (i + sx > M.gx) i = M.gx - sx; }

    }
    else { l.e.style.display = vis ? '' : 'none'; l.e.classList.toggle('hi', HOVER === l); place(l.e, x + dxOf(l), y, z); l.e.style.zIndex = 1000 + l.i; }
    // 引线：每层在自己的进深上、沿整摞图的右上棱有一个点（「导轨」），标签连到这个点，再从它拉一小段到这层自己的右上角。导轨上的点按进深排成一线，引线不会绞在一起
    if (vis) { const dm = l.mesh ? l.mesh.d[0][l.mesh.gx] : undefined, zr = zOf(l, dm), rail = proj(cam, RAIL[0] - CW / 2, RAIL[1] - CH / 2, zr), a = proj(cam, x + dxOf(l, dm) + w - CW / 2, y - CH / 2, zr), ly = 12 + l.i * 28.4 + 14.2, hot = HOVER === l;

  const showB = state.mix * state.spread; zeroPlane.style.opacity = showB; zeroPlane.style.zIndex = 500; place(zeroPlane, CW * 0.13, CH * 0.12, state.spread * state.mix * (0 - DMID) * ZB - 2);

}

// ---------- 正交俯视图（?view=top）：横轴 = 画面 x，纵轴 = 横向深度 ----------

  for (let d = Math.ceil(da * 10) / 10; d <= db; d = Math.round((d + 0.1) * 10) / 10) { g.beginPath(); g.moveTo(X0, Y(d)); g.lineTo(X1, Y(d)); g.stroke(); g.fillText(d.toFixed(1), X0 - 38, Y(d) + 5); }
  g.strokeStyle = PIVOT != null ? '#D6336C' : '#2FB5A8'; g.lineWidth = 2; g.setLineDash([10, 6]); g.beginPath(); g.moveTo(X0, Y(0)); g.lineTo(X1, Y(0)); g.stroke(); g.setLineDash([]);
  g.fillStyle = PIVOT != null ? '#D6336C' : '#0B7A6E'; g.font = `600 15px ${FONT}`; g.fillText(PIVOT != null ? `红虚线 = 深度 0 = 转轴（原深度表里的 ${PIVOT}）。身体、手臂、脖子也在这条线上，不动` : '绿虚线 = 深度 0：身体底图、手臂、脖子（转头时不动）', X0 + 6, Y(da) + 22);

    g.strokeStyle = c2; g.lineWidth = 3.2; g.beginPath();
    if (l.mesh) { g.setLineDash([]); for (const [j, dash] of [[l.mesh.gy, false], [0, true]]) { g.setLineDash(dash ? [6, 5] : []); g.beginPath(); l.mesh.d[j].forEach((dv, i) => { const px = X(x + w * i / l.mesh.gx), py = Y(dv); i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke(); } g.setLineDash([]); }

// ---------- 固定演示（seek）与交互 ----------
const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }, lerp = (a, b, k) => a + (b - a) * k;
const DURATION = 18, FPS = 30;
function seek(t) {
  t = Math.min(Math.max(t, 0), DURATION - 1e-6);
  const open = sm((t - 1.2) / 2.4), close = sm((t - 16.3) / 1.5), toB = sm((t - 9.2) / 1.6);
  state.spread = open * (1 - close); state.mix = toB;
  const orbit = t < 4 ? -62 : t < 9 ? -62 * Math.cos((t - 4) / 5 * 2 * Math.PI) : -62, side = sm((t - 10.6) / 1.2) * (1 - sm((t - 15.4) / 0.9));

  const u = (t - 11.6) / 3.6; state.headYaw = u > 0 && u < 1 ? 24 * Math.sin(u * 2 * Math.PI) : 0;
  redraw();
}
const TOP = Q.get('view') === 'top';
if (TOP) drawTop();
else {
  if (Q.get('mode') === 'depth') state.mix = 1; if (Q.has('spread')) state.spread = Number(Q.get('spread')); if (Q.has('yaw')) state.headYaw = Number(Q.get('yaw'));
  if (Q.has('cam')) [state.camYaw, state.camPitch] = Q.get('cam').split(',').map(Number);
  for (const id of (Q.get('hide') || '').split(',').filter(Boolean)) { const l = L.find(q => q.id === id); if (l) { l.hidden = true; l.lab.classList.add('off'); } }
  redraw();
}
const ui = document.getElementById('ui');
if (RENDER || TOP) ui.style.display = 'none';
else {
  ui.innerHTML = `<button id="bA">A 按绘制顺序</button><button id="bB">B 按深度</button><button id="b0">合拢</button><button id="bP">播放演示</button>
    <label>拉开 <input id="sS" type="range" min="0" max="1.6" step="0.01"></label><label>转头 <input id="sY" type="range" min="-30" max="30" step="1"> <span id="vY"></span></label>
    <label>姿势 <select id="sP">${Object.keys(POSES).map(k => `<option${k === POSE ? ' selected' : ''}>${k}</option>`).join('')}</select></label> 拖动画面旋转 · 点右侧的行隐藏 / 显示`;
  const $ = id => document.getElementById(id), sync = () => { $('sS').value = state.spread; $('sY').value = state.headYaw; $('vY').textContent = state.headYaw.toFixed(0) + '°'; $('bA').classList.toggle('on', state.mix < 0.5 && state.spread > 0.02); $('bB').classList.toggle('on', state.mix >= 0.5 && state.spread > 0.02); };
  let playing = null; const stop = () => { if (playing) cancelAnimationFrame(playing); playing = null; };
  $('bA').onclick = () => { stop(); state.mix = 0; if (state.spread < 0.05) state.spread = 1; redraw(); sync(); }; $('bB').onclick = () => { stop(); state.mix = 1; if (state.spread < 0.05) state.spread = 1; redraw(); sync(); };
  $('b0').onclick = () => { stop(); state.spread = 0; redraw(); sync(); }; $('sS').oninput = e => { stop(); state.spread = +e.target.value; redraw(); sync(); }; $('sY').oninput = e => { stop(); state.headYaw = +e.target.value; redraw(); sync(); };
  $('sP').onchange = e => { Q.set('pose', e.target.value); location.search = Q.toString(); };
  $('bP').onclick = () => { stop(); const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION); sync(); playing = requestAnimationFrame(loop); }; loop(); };
  let drag = null; const st = document.getElementById('stage');
  st.addEventListener('pointerdown', e => { if (e.target.closest('#ui, #labels')) return; stop(); drag = [e.clientX, e.clientY, state.camYaw, state.camPitch]; });
  addEventListener('pointermove', e => { if (!drag) return; const k = 0.35 / (st.getBoundingClientRect().width / 1920); state.camYaw = drag[2] + (e.clientX - drag[0]) * k; state.camPitch = Math.max(-80, Math.min(80, drag[3] + (e.clientY - drag[1]) * k)); redraw(); });
  addEventListener('pointerup', () => { drag = null; });
  const fit = () => { st.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; }; fit(); addEventListener('resize', fit); sync();
}
window.__video = { width: 1920, height: 1080, fps: FPS, duration: DURATION, seek: TOP || Q.has('still') ? () => {} : seek, ready: Promise.resolve() };
</script>
